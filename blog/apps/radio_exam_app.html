"p":"4.1.4","q":"电源的内阻对电路的影响是：","a":"A","A":"使电源的实际输出电压降低","B":"使电源的电动势降低","C":"使电源的输出功率增加","D":"使电源的自身的能耗降低","n":1,"img":""},{"i":"MC1-0973","p":"4.1.4","q":"有些收发信机会在直流 13.8V 供电线路中串联一个熔断器，并在其后反向并联一个额定电流很大的二极管作保护之用。该电路利用了二极管的什么特性？是如何工作的？","a":"A","A":"利用二极管中 PN 结的单向导电性；若电源极性接反，近乎短路的电流烧断熔丝，切断供电","B":"在电源过压时利用二极管的击穿特性吸收电流以稳定供电电压","C":"在电源过流时利用二极管的击穿特性吸收电流以稳定供电电压","D":"若设备过热时利用二极管的热失控特性短路电源，烧断熔丝，切断供电","n":1,"img":""},{"i":"MC2-0974","p":"4.1.4","q":"有些收发信机会在 13.8V 直流电源插座附近安装一个标有数字的复位按钮。其作用是什么？","a":"AB","A":"当设备过流时切断电源","B":"当电源极性接反时切断电源","C":"如果工作温度超过数字所注的温度值则切断电源","D":"如果工作电压超过数字所注的伏特数则切断电源","n":2,"img":""},{"i":"MC1-1298","p":"4.6.1","q":"用万用表的直流电压档测量正负对称的方波电压（占空比为 1:1）。所得读数为：","a":"A","A":"零值","B":"该电压的最大值","C":"该电压最大值的 1/2","D":"该电压最大值的 2 倍","n":1,"img":""},{"i":"MC1-1299","p":"4.6.1","q":"如果用磁电式万用表的交流电压档测量正负对称的方波电压（占空比为 1:1），其指针所示的电压读数：","a":"A","A":"大于该电压的峰值","B":"为该电压的峰值","C":"为该电压的峰-峰值","D":"为该电压的平均值","n":1,"img":""},{"i":"MC1-1300","p":"4.6.1","q":"用指针式万用表的直流电压档测量最小值为 0 的方波电压（占空比为 1:1），得到的读数是该电压的：","a":"A","A":"峰值的 1/2，亦为有效值","B":"零值","C":"峰值","D":"峰-峰值","n":1,"img":""},{"i":"MC1-1301","p":"4.6.1","q":"用万用表的电阻档测量一个电路。最开始，电表指示电路的阻值很小。但是随着测量时间的延长，测量值却变得越来越大。这是因为：","a":"A","A":"这个电路两端可能存在一个很大的电容","B":"万用表出了故障","C":"这个电路两端可能存在一个很大的电感","D":"这个电路中存在一个周期性的交流电压","n":1,"img":""},{"i":"MC2-1302","p":"4.6.1","q":"测量一个电解电容器是否完好应当使用：","a":"AB","A":"指针式万用表的电阻档","B":"数字万用表的电容测试档（如果仪表具备该功能）","C":"任意一种万用表的电流档","D":"蓄电池充电器并配合进行短路放电实验","n":2,"img":""},{"i":"MC1-1303","p":"4.6.1","q":"用指针式万用电表的电阻档测量一个常用元件，表笔第一次连接时表针挥动了一下，但很快回到零点。断开表笔重新连接，表针却不再有任何指示。正确的推论是：","a":"A","A":"该元件可能是一个电解电容器","B":"该元件肯定是一支损坏了的电阻","C":"万用表的准确度肯定有问题","D":"万用表的电池肯定电量不足了","n":1,"img":""},{"i":"MC1-1304","p":"4.6.1","q":"指针式万用表的电压档有个“欧姆/伏（每伏欧姆）”指标。越大的每伏欧姆数越说明：","a":"A","A":"测量电压时电表对电路工作状态的影响小","B":"测量电压时电表对电路工作状态的影响大","C":"可以耐受的电压过载能力强","D":"可以耐受的电压过载能力弱","n":1,"img":""},{"i":"MC1-1305","p":"4.6.1","q":"用数字万用表的直流电压档测量电路两点间某个等幅音频信号的电压，发现读数不为零。交换两支表笔之后再测，所得读数的极性反转。正确的推论是：","a":"A","A":"音频信号上叠加有直流成分","B":"音频信号含有丰富的谐波","C":"万用表的频率响应太差","D":"表笔导线间的分布电容影响了测量","n":1,"img":""},{"i":"MC1-1345","p":"5.1.1","q":"业余无线电发射设备的下列指标必须符合国家的相关规定：","a":"A","A":"频率容限和杂散域发射功率","B":"频率调制频偏和调制度","C":"频率容限和带外发射","D":"指配频段和必要带宽","n":1,"img":""},{"i":"MC1-1346","p":"5.1.1","q":"业余电台的无线电发射设备应符国家规定的下列主要技术指标：","a":"A","A":"符合频率容限、符合杂散发射最大允许功率电平","B":"杂散发射不低于最大允许功率电平、电源电压及频率符合国家电网标准、采用标准天线阻抗","C":"杂散发射不低于最大允许功率电平、频率漂移不低于频率容限、电源利用效率满足节能要求","D":"工作频率范围足够宽、杂散发射不低于最大允许功率电平、带宽大于允许最低值","n":1,"img":""},{"i":"MC2-1347","p":"5.1.1","q":"频率容限是指：","a":"AB","A":"发射所占频段的中心频率偏离指配频率的最大容许偏差","B":"发射的特征频率偏离参考频率的最大容许偏差","C":"发射所占频段的中心频率偏离最高频率的最大容许偏差","D":"发射的特征频率偏离必要频率的最大容许偏差","n":2,"img":""},{"i":"MC2-1348","p":"5.1.1","q":"频率容限是发射设备的重要指标，通常用下述单位来表示：","a":"AB","A":"百万分之几","B":"赫兹","C":"百分之几","D":"兆赫","n":2,"img":""},{"i":"MC3-1349","p":"5.1.1","q":"杂散域发射功率是发射设备的重要指标，通常用下述单位来表示：","a":"ABC","A":"绝对功率 dBm","B":"低于载波发射功率的分贝值 dBc","C":"低于 PEP 发射功率的相对值 dB","D":"绝对功率（瓦）","n":3,"img":""},{"i":"MC3-1350","p":"5.1.1","q":"杂散发射是指：","a":"ABC","A":"必要带宽之外的一个或多个频率的发射，其发射电平可降低而不致影响相应信息的传输","B":"杂散发射包括谐波发射、寄生发射","C":"杂散发射包括互调产物、变频产物","D":"杂散发射包括谐波发射、带外发射","n":3,"img":""},{"i":"MC1-1351","p":"5.1.1","q":"业余无线电专用发射设备必须满足的主要技术指标要求包括：","a":"A","A":"频率容限和杂散辐射不超过限值，发射频率不超出国家规定的业余业务和卫星业余业务频率","B":"频率容限不低于限值，杂散辐射不超过限值，发射频率不超出国家规定的业余业务和卫星业余业务频率","C":"频率容限和杂散辐射不超过限值，发射频率包括业余业务和卫星业余业务频率","D":"发射功率不低于功率限值，输出阻抗符合工业标准","n":1,"img":""},{"i":"MC1-1352","p":"5.1.1","q":"下列情况会产生减幅波辐射：","a":"A","A":"电路接触点打火","B":"对讲机按键发射","C":"电视机本振泄漏","D":"医用高频加热器泄漏","n":1,"img":""},{"i":"MC2-1353","p":"5.1.2","q":"按照国家标准 GB8702-2014《电磁环境控制限值》，从电磁环境保护管理角度，向没有屏蔽空间发射电磁场可以免于管理的有：","a":"AB","A":"频率范围为 0.1-3MHz，等效辐射功率小于 300 瓦的无线电通信设施（设备）","B":"频率范围为 3MHz-300GHz，等效辐射功率小于 100 瓦的无线电通信设施（设备）","C":"发射频率在 30MHz 以下的所有业余电台","D":"发射频率在 30MHz 以上的所有业余电台","n":2,"img":""},{"i":"MC1-1354","p":"5.1.2","q":"根据国家标准 GB8702-2014《电磁环境控制限值》，公众曝露是指：","a":"A","A":"公众所受的全部电场、磁场、电磁场照射","B":"职业照射","C":"医疗照射","D":"医学诊断或治疗所受到的辐射照射","n":1,"img":""},{"i":"MC1-1355","p":"5.1.2","q":"为什么我国《电磁环境控制限值》标准中的照射限值伴随频率有所不同？","a":"A","A":"人体对某些特定波长的电磁波有更多的吸收","B":"较低频率的无线电波不会穿透人体","C":"因为自然界中频率较高电磁波并不常见","D":"较低频率的无线电波较更高频率的无线电波拥有更高的能量","n":1,"img":""},{"i":"MC3-1356","p":"5.1.2","q":"关于自制、改装、拼装无线电发射设备，下列说法正确的是：","a":"ABC","A":"自制、改装、拼装的无线电发射设备，应符合《业余无线电设备射频技术要求及测试方法》（GB/T 32658-2016）所列技术要求","B":"自制、改装、拼装的无线电发射设备，应符合《短波单边带通信设备通用规范》（GB/T16946-2017）所列技术要求","C":"无线电管理机构可根据相关标准规范免费开展有关技术检测","D":"自制、改装、拼装无线电发射设备可不受无线电管理机构的监督管理","n":3,"img":""},{"i":"MC1-1357","p":"5.1.2","q":"空中的 VHF 和 UHF 信号属于下面哪一类辐射？","a":"A","A":"非电离辐射","B":"电离辐射","C":"阿尔法辐射","D":"伽玛辐射","n":1,"img":""},{"i":"MC1-1358","p":"5.1.3","q":"业余电台安装防雷装置是为了防止雷电危害。传统防雷装置的主要组成部分包括：","a":"A","A":"接闪器（避雷针）、引下线、接地体","B":"天线、断路器、地线","C":"避雷针、氖灯、自复保险丝","D":"避雷针、氧化锌过压保护器、断路器","n":1,"img":""},{"i":"MC1-1359","p":"5.1.3","q":"防雷接地的作用是：","a":"A","A":"把接闪器引入的雷击电流有效地泄入大地","B":"用接闪器感应到的雷电高压启动过压保护电路","C":"有效地阻断接闪器引入的雷击电流使其不致流入大地","D":"当接闪器引入雷击电流时迅速烧断熔丝，阻断其流动","n":1,"img":""},{"i":"MC1-1360","p":"5.1.3","q":"关于防雷装置的接地，最基本要求为：","a":"A","A":"要有单独的接地体，接地电阻要小，接闪器到接地体之间的引下线应尽量短而粗","B":"可以利用自来水管作为接地体，如果这种管线有相当长的一段是埋入地下的","C":"交流电网的“零线”在配电系统中已经接地。这可代替防雷接地体及其引下线","D":"接闪器到接地体之间的引下线平时没有电流流过，采用直径 0.5 毫米的导线足矣","n":1,"img":""},{"i":"MC1-1361","p":"5.1.3","q":"对于一般建筑物，单支避雷针的保护范围至多能有多大：","a":"A","A":"在避雷针顶点至地面之间，由 60 米半径滚球曲线所构成的空间","B":"在任何情况下，避雷针都可以保护其周边低于避雷针高度的空间","C":"在任何情况下，避雷针都可以保护其周边半径 30 米之内的物体","D":"从避雷针顶点起、以避雷针高度为半径所做半球体以内的空间","n":1,"img":""},{"i":"MC1-1362","p":"5.1.3","q":"下列哪种导电材料最适宜连接天线、塔架和入室馈线等处的各个接地部件？","a":"A","A":"镀银软铜丝编织扁带","B":"圆形铜包钢单股导线","C":"以太网双绞线","D":"50-3 同轴电缆","n":1,"img":""},{"i":"MC1-1363","p":"5.1.3","q":"在为同轴馈线安装避雷器时应当注意什么？","a":"A","A":"将所有避雷器的地线接到同一个金属条带上，然后将条带可靠连到室外的接地处","B":"在每个避雷器的地线连接处安装开关以在发信时断开，防止射频电流损伤避雷器","C":"将每个避雷器的接地连线都单独引出，然后将它们与电台的地线连在一起","D":"可用廉价的氖灯或气体放电管自制避雷器。这样的 DIY 可谓经济实用，效果卓著","n":1,"img":""},{"i":"MC1-1364","p":"5.1.3","q":"以下哪一项是天线铁塔防雷接地的有效措施？","a":"A","A":"接地连接要尽可能地短而直","B":"确保需要弯折的地线已做干净漂亮的直角弯","C":"为接地系统做好防水处理","D":"打入地下的接地装置应当尽量远离天线塔","n":1,"img":""},{"i":"MC1-1365","p":"5.1.4","q":"考虑实际工作环境必然存在一定的湿度，则根据 GB/T 3805－2008《特低电压 ELV 限值》在潮湿条件下的限值，当人体握紧某个带电零件时，零件与人体间的电压不可高于：","a":"A","A":"交流 16V（r.m.s.），直流 33V","B":"交流 24V（r.m.s.），直流 36V","C":"交流 36V（r.m.s.），直流 24V","D":"交流 6.3V（r.m.s.），直流 13.8V","n":1,"img":""},{"i":"MC1-1366","p":"5.1.4","q":"假如接触电压相同，则触及带有射频电压（例如，频率不低于 LF）的裸露导线与触及带有直流或交流 50Hz 电压的裸露导线相比，人体所受的安全威胁有什么不同？","a":"A","A":"致死风险有所下降，但是灼伤皮肤或深层皮下组织的风险显著上升","B":"更容易导致神经系统损伤或使心肺功能紊乱，存在更高的致死风险","C":"射频交流电从不威胁人身安全，所以发射机的天线都可以随意触摸","D":"触及不同频率但电压相同的交流电，人体当然面临相同的安全威胁","n":1,"img":""},{"i":"MC1-1367","p":"5.1.4","q":"如果用两手分别接触电压有效值相同但频率不同的电路的两个端点，则所受安全威胁由大到小可以排序为：","a":"A","A":"工频交流电、HF 射频交流电、UHF 射频交流电","B":"UHF 射频交流电、HF 射频交流电、工频交流电","C":"HF 射频交流电、工频交流电、UHF 射频交流电","D":"HF 射频交流电、UHF 射频交流电、工频交流电","n":1,"img":""},{"i":"MC1-1368","p":"5.1.4","q":"如果不得已，必须带电检修由市电供电的无线电设备，则应做到：","a":"A","A":"双脚与地绝缘，单手操作，另一只手不触摸机壳等任何与电路或接地有关的金属件","B":"双脚与地绝缘，单手操作，另一只手通过触摸机壳或水管等接地物件探测是否有电","C":"只要设备外壳良好接地，双脚是否与地绝缘、双手是否同时操作都不存在安全风险","D":"只要设备外壳与地绝缘，双脚是否与地绝缘、双手是否同时操作都不存在安全关系","n":1,"img":""},{"i":"MC3-1369","p":"5.1.4","q":"设备的外壳带电可能危及人身安全。相关预防措施包括：","a":"ABC","A":"对于使用交流市电供电的设备，应将其金属机箱与某个可靠的公共地线相连","B":"应在供电线路中安装漏电保护器，以在发生漏电时迅速切断供电","C":"如果某设备使用了带有单独保护地线的三线插头，则必须确认接地是有效的","D":"公共地线应具有较低的接地电阻，与自来水管道相连是个一劳永逸的好主意","n":3,"img":""},{"i":"MC1-1370","p":"5.1.4","q":"即使设备的电源线已经拔掉，检修时仍可能遇到什么安全风险？","a":"A","A":"充满高电压的电容器可能让维修者遭遇电击风险","B":"地磁活动可在变压器中激起高压，电到维修人员","C":"打开电源设备或电子管线性放大器的机箱，其内置保险丝就会烧断","D":"如果打开机箱，静电放电就可能损坏设备的接地系统","n":1,"img":""},{"i":"MC1-1371","p":"5.1.4","q":"自制由 220 伏交流市电供电的设备，安全措施应至少包括：","a":"A","A":"在交流电源入口的火线中串联一个保险丝","B":"在交流供电入口处并联一个交流电压表","C":"在交流供电入口处串联一个电感","D":"在交流供电入口处并联一个电容","n":1,"img":""},{"i":"MC3-1372","p":"5.1.4","q":"如何确保自制的业余无线电作品具有较高的用电安全性？","a":"ABC","A":"使用三芯电源线和金属机箱，将机箱与市电插座的地线可靠连接","B":"如果设备内部含有高压整流装置，则为其滤波电容并联泄放电阻","C":"为业余自制的射频功率放大器安装断开市电供应的机箱联动开关","D":"为配电箱和天馈系统的配线柜安装喷淋装置，发现火警立即喷水","n":3,"img":""},{"i":"MC1-1373","p":"5.1.5","q":"使用普通 12 伏铅酸蓄电池为电台供电存在什么潜在风险？","a":"A","A":"如果通风不良，会有爆炸性气体聚集","B":"有高电压，存在触电风险","C":"会释放臭氧，进而污染大气层","D":"若长时间闲置不用就可能自燃","n":1,"img":""},{"i":"MC1-1374","p":"5.1.5","q":"如果铅酸蓄电池的充电或放电过程过快会有什么风险？","a":"A","A":"电池可能过热，甚至释放氢气，抬升爆炸风险","B":"电压会变为负值，导致电池报废。这就是所谓“反极”","C":"导致“记忆效应”，从而使电池的可用容量下降","D":"可能导致过高的电池电压，抬升触电风险","n":1,"img":""},{"i":"MC1-1375","p":"5.1.5","q":"电台室如遇电气设备、电线电缆或者电源装置失火，正确的处置应当为：","a":"A","A":"立即切断所有供电，使用二氧化碳灭火器或干粉灭火器","B":"立即切断所有供电，使用泡沫灭火器灭火。不得已时可用干砂灭火","C":"立即切断所有供电，用水灭火","D":"迅速起身逃离火场","n":1,"img":""}];
const OVERVIEW_HTML = "<h1>🚀 突击 30 分钟总览（看这一页可应付一半题）</h1>\n<h2>一、法规身份（5 分钟）</h2>\n<ul><li>行政法规：<strong>《无线电管理条例》</strong>——国务院 + 中央军委。</li><li>部门规章：<strong>《业余无线电台管理办法》</strong>——工信部，<strong>2024-3-1 起施行</strong>。</li><li>业余术语定义：<strong>《无线电频率划分规定》</strong>。</li><li>国际机构：<strong>ITU（无线电规则）</strong>、<strong>IARU（视业余为\"国家资源\"）</strong>。</li><li>频谱国家所有 → <strong>《民法典》第 252 条</strong>。</li></ul>\n<h2>二、记数字（10 分钟，必背！）</h2>\n<table><thead><tr><th>项目</th><th>数字</th></tr></thead><tbody><tr><td><strong>执照有效期</strong></td><td>≤ <strong>5 年</strong></td></tr><tr><td><strong>续期</strong></td><td>届满前 <strong>30 个工作日</strong></td></tr><tr><td><strong>注销后拆天线</strong></td><td><strong>60 个工作日</strong>内</td></tr><tr><td><strong>紧急临时设台报告</strong></td><td><strong>48 小时</strong>内</td></tr><tr><td><strong>15 W 以上短波</strong></td><td>国家无管局许可</td></tr><tr><td><strong>B 类申请门槛</strong></td><td>持执照 ≥ <strong>6 个月</strong></td></tr><tr><td><strong>C 类申请门槛</strong></td><td>持 30 MHz 以下频段执照 ≥ <strong>18 个月</strong></td></tr><tr><td><strong>A 类功率</strong></td><td>V/UHF ≤ <strong>25 W</strong>（<strong>无 HF！</strong>）</td></tr><tr><td><strong>B 类功率</strong></td><td>HF <strong>&lt; 15 W</strong>，V/UHF ≤ <strong>25 W</strong></td></tr><tr><td><strong>C 类功率</strong></td><td>HF ≤ <strong>1000 W</strong>，V/UHF ≤ <strong>25 W</strong></td></tr><tr><td><strong>通信中报呼号</strong></td><td>不超过 <strong>10 分钟</strong>一次</td></tr><tr><td><strong>2 m 中继频差</strong></td><td><strong>600 kHz</strong></td></tr><tr><td><strong>70 cm 中继频差</strong></td><td><strong>5 MHz</strong></td></tr><tr><td><strong>VHF/UHF S 表每档</strong></td><td><strong>6 dB</strong></td></tr><tr><td><strong>特低电压潮湿限值</strong></td><td>交流 <strong>16 V</strong> / 直流 <strong>33 V</strong></td></tr><tr><td><strong>避雷针保护范围</strong></td><td><strong>60 m 半径滚球</strong>曲线</td></tr><tr><td><strong>高压线安全距离</strong></td><td>35 kV 及以下 ≥ <strong>1 m</strong></td></tr><tr><td><strong>音频范围</strong></td><td><strong>16 Hz – 20 kHz</strong></td></tr><tr><td><strong>CTCSS 频率</strong></td><td><strong>67 – 250.3 Hz</strong></td></tr><tr><td><strong>业余首选阻抗</strong></td><td><strong>50 Ω</strong></td></tr><tr><td><strong>理想点源 vs 半波偶极</strong></td><td><strong>2.15 dBi = 0 dBd</strong></td></tr></tbody></table>\n<h2>三、波段对照（必背！）</h2>\n<table><thead><tr><th>俗称</th><th>频率</th><th>状态</th></tr></thead><tbody><tr><td><strong>160 m</strong></td><td>1800–2000 kHz</td><td>主要</td></tr><tr><td><strong>80 m</strong></td><td>3.5–3.9 MHz</td><td>主要</td></tr><tr><td><strong>40 m</strong>（ITU3 区）</td><td><strong>7.0–7.2 MHz</strong></td><td>专用</td></tr><tr><td><strong>30 m</strong></td><td>10.1–10.15 MHz</td><td>次要</td></tr><tr><td><strong>20 m</strong></td><td>14–14.35 MHz（14–14.25 专用）</td><td>共用</td></tr><tr><td><strong>17 m</strong></td><td>18.068–18.168 MHz</td><td>—</td></tr><tr><td><strong>15 m</strong></td><td><strong>21–21.45 MHz</strong></td><td>专用</td></tr><tr><td><strong>10 m</strong></td><td><strong>28–29.7 MHz</strong></td><td>专用</td></tr><tr><td><strong>6 m</strong></td><td><strong>50–54 MHz</strong></td><td>主要</td></tr><tr><td><strong>2 m</strong></td><td><strong>144–148 MHz</strong>（144–146 唯一主要）</td><td>—</td></tr><tr><td><strong>70 cm</strong></td><td><strong>430–440 MHz</strong></td><td><strong>次要</strong>（主：定位+航空导航）</td></tr><tr><td><strong>最低 LF</strong></td><td><strong>135.7–137.8 kHz</strong></td><td>次要</td></tr><tr><td><strong>最高</strong></td><td><strong>241–250 GHz</strong>（EHF）</td><td>—</td></tr></tbody></table>\n<p><strong>习惯</strong>：10.1 MHz 以下 LSB / 以上 USB / V·UHF SSB = USB / <strong>40 m 用 LSB</strong>（陷阱！）</p>\n<p><strong>卫星专用段（不可话音占用）</strong>：29.3–29.51 MHz、<strong>145.8–146 MHz</strong>、<strong>435–438 MHz</strong></p>\n<h2>四、呼号与分区（必背！）</h2>\n<ul><li>结构：<strong>前缀 B / 电台种类字母 / 分区号 / 后缀</strong></li><li>一般电台字母序：<strong>G H I D A B C E F K L</strong></li><li><strong>J = 空间台</strong>；<strong>R = 中继/信标</strong></li><li>分区：<strong>1 北京 / 2 黑吉辽 / 3 津蒙冀晋 / 4 沪鲁苏 / 5 浙赣闽 / 6 皖豫鄂 / 7 湘粤桂琼 / 8 川渝黔滇 / 9 陕甘宁青 / 0 新疆西藏</strong></li></ul>\n<h2>五、面板键缩写（送分题，必拿）</h2>\n<table><thead><tr><th>缩写</th><th>一句话</th></tr></thead><tbody><tr><td>PTT</td><td>按下发射</td></tr><tr><td>SQL</td><td>静噪（关音频噪声）</td></tr><tr><td>VOX</td><td>声控发射（免提）</td></tr><tr><td><strong>ATT</strong></td><td><strong>衰减</strong>（接收强信号）</td></tr><tr><td><strong>PRE</strong></td><td><strong>前置放大</strong>（接收弱信号）</td></tr><tr><td><strong>AGC</strong></td><td>接收<strong>中频</strong>自动增益（防过载）</td></tr><tr><td><strong>ALC</strong></td><td>发射<strong>射频</strong>电平控制（防过驱动）</td></tr><tr><td><strong>PROC</strong></td><td>语音压缩</td></tr><tr><td><strong>NB</strong></td><td>抑制脉冲噪声（如火花塞）</td></tr><tr><td><strong>AT/TUNE</strong></td><td>自动天调</td></tr><tr><td><strong>CTCSS</strong></td><td>亚音静噪</td></tr><tr><td><strong>DCS</strong></td><td>数字亚音静噪</td></tr><tr><td><strong>DTMF</strong></td><td>双音多频遥控</td></tr><tr><td><strong>NFM/WFM</strong></td><td>窄带 25/12.5 kHz / 宽带 180 kHz</td></tr></tbody></table>\n<h2>六、必背口诀</h2>\n<ol><li><strong>\"划给业务、分给部门、指给电台\"</strong> — 划分/分配/指配。</li><li><strong>A 类无 HF</strong>；<strong>B 类 HF 用\"&lt;\"</strong>（小于 15 W，不是 ≤）。</li><li><strong>回答 CQ：先呼对方，再呼自己</strong>。</li><li><strong>次要业务</strong>：\"不得干扰主要 + 不得要求保护\"。</li><li><strong>40 m 用 LSB</strong>（不是 USB）。</li><li><strong>镜频</strong> = 工作频率 ± 2 × 中频；<strong>前端预选</strong>抑制。</li><li><strong>EME 用月亮近地点</strong>（不是满月）。</li><li><strong>电气火灾</strong>：CO₂ / 干粉（<strong>不用水/泡沫</strong>）。</li><li><strong>触电检修</strong>：双脚绝缘 + 单手操作。</li><li><strong>业余电台只用于</strong>：<strong>相互通信、技术研究、自我训练</strong>。</li></ol>\n<hr>";
const POCKET_HTML = "<h1>🏆 高分必背口袋卡（考前最后看 5 分钟）</h1>\n<ol><li><strong>A/B/C</strong>：A=25/无 HF；B=25/&lt;15；C=25/≤1000。</li><li><strong>执照 5 年</strong>；续期<strong>30 工作日</strong>；拆天线<strong>60 工作日</strong>；应急<strong>48 小时报告</strong>。</li><li>持证操作<strong>不限年龄</strong>；<strong>未成年人</strong>可申请。</li><li><strong>GHIDABCEFKL</strong>=一般 / J=空间 / R=中继信标。</li><li><strong>分区 1 北京 / 0 新疆西藏</strong>。</li><li><strong>中继频差</strong>：2 m 600 kHz / 70 cm 5 MHz。</li><li>俗称→频率：<strong>1.8 / 3.5 / 7 / 14 / 21 / 28 / 50 / 144 / 430 MHz</strong>。</li><li><strong>40 m LSB</strong>（陷阱！）；<strong>V/UHF SSB = USB</strong>；10.1 MHz 分界。</li><li>业余必备指标 = <strong>频率容限 + 杂散发射</strong>。</li><li>触电检修 = <strong>双脚绝缘 + 单手操作</strong>。</li><li>电气火灾 = <strong>CO₂/干粉</strong>。</li><li><strong>SQL 静噪 / VOX 声控 / ATT 衰减 / PRE 前放 / AGC 中频 / ALC 射频 / NB 抑脉冲 / PROC 语音压缩</strong>。</li><li><strong>DC 收信机</strong> = Direct Conversion。</li><li><strong>EME 月球近地点最佳</strong>。</li><li><strong>5 W = 37 dBm；1 μV (50 Ω) = –107 dBm；S 表每档 6 dB</strong>。</li><li><strong>理想无噪声</strong>：Fn=1，NF=0 dB，Te=0 K。</li><li><strong>17℃ 等效</strong>：Fn=2，NF=3 dB，Te=290 K。</li><li><strong>镜频 = 工作频率 ± 2 × 中频</strong>；前端预选抑制。</li><li>业余电台用途 = <strong>相互通信 / 技术研究 / 自我训练</strong>。</li><li><strong>20–50 万</strong>罚款 = 干扰<strong>人身安全频率</strong>（船舶/航空/铁路/航天）。</li></ol>\n<hr>";

const Q_BY_ID = {};
QUESTIONS.forEach(q => { Q_BY_ID[q.i] = q; });
const SEC_BY_ID = {};
SECTIONS.forEach(s => { SEC_BY_ID[s.id] = s; });

// Build reverse index: question id → section id
const Q_TO_SEC = {};
SECTIONS.forEach(s => s.qIds.forEach(id => { Q_TO_SEC[id] = s.id; }));

// ============================================================
// Persistent state
// ============================================================
const StorageKey = 'radio-a-stats-v2';
const ThemeKey = 'radio-a-theme';
const FavKey = 'radio-a-favs';

function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
  catch (e) { return fallback; }
}
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

let stats = loadJSON(StorageKey, { results: {}, wrong: [] });
let favorites = new Set(loadJSON(FavKey, []));

function saveStats() { saveJSON(StorageKey, stats); }
function saveFavs() { saveJSON(FavKey, [...favorites]); updateBadges(); }

function recordResult(qid, correct) {
  stats.results[qid] = correct;
  if (correct) {
    stats.wrong = stats.wrong.filter(id => id !== qid);
  } else if (!stats.wrong.includes(qid)) {
    stats.wrong.push(qid);
  }
  saveStats();
  updateBadges();
}

function toggleFavorite(qid) {
  if (favorites.has(qid)) favorites.delete(qid);
  else favorites.add(qid);
  saveFavs();
}

function updateBadges() {
  const fc = document.getElementById('favCount');
  if (fc) fc.textContent = favorites.size;
  const wc = document.getElementById('wrongCount');
  if (wc) wc.textContent = stats.wrong.length;
}

// ============================================================
// Theme management
// ============================================================
function getPreferredTheme() {
  const saved = localStorage.getItem(ThemeKey);
  if (saved === 'light' || saved === 'dark') return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  if (btn) btn.title = theme === 'dark' ? '切换到浅色模式' : '切换到深色模式';
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem(ThemeKey, next);
  applyTheme(next);
}
applyTheme(getPreferredTheme());

// ============================================================
// HTML escape
// ============================================================
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const queryEsc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(queryEsc, 'gi');
  return escaped.replace(re, m => `<mark class="search-hit">${m}</mark>`);
}

// ============================================================
// Render sidebar
// ============================================================
function renderSidebar() {
  const root = document.getElementById('sidebarInner');
  const parts = {};
  SECTIONS.forEach(s => {
    if (!parts[s.part]) parts[s.part] = { name: s.partName, ord: s.partOrd, items: [] };
    parts[s.part].items.push(s);
  });
  let html = '';
  html += '<button class="nav-link" data-target="overview"><span class="sec-num">🚀</span><span class="nav-text">突击速记总览</span></button>';
  Object.keys(parts).sort((a,b) => +a - +b).forEach(k => {
    const p = parts[k];
    html += `<div class="part-label">第 ${p.ord} 篇 · ${p.name}</div>`;
    p.items.forEach(s => {
      html += `<button class="nav-link" data-target="sec-${s.id}"><span class="sec-num">${s.id}.</span><span class="nav-text">${escapeHtml(s.title)}</span><span class="q-badge">${s.qCount}</span></button>`;
    });
  });
  html += '<button class="nav-link" data-target="pocket"><span class="sec-num">🏆</span><span class="nav-text">考前口袋卡</span></button>';
  root.innerHTML = html;
  root.querySelectorAll('button.nav-link').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.target;
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      closeSidebar();
    };
  });
}

// ============================================================
// Render main
// ============================================================
function renderMain() {
  const root = document.getElementById('mainInner');
  let html = '';
  html += `<section id="overview" class="section"><div class="content">${OVERVIEW_HTML}</div></section>`;
  SECTIONS.forEach(s => {
    const chTags = s.chapters.map(c => `<span class="chapter-tag">章 ${c}</span>`).join('');
    html += `<section id="sec-${s.id}" class="section" data-section-id="${s.id}">
      <h2><span class="num">${s.id}</span><span>${escapeHtml(s.title)}</span></h2>
      <div class="chapter-tags">${chTags}<span class="chapter-tag" style="background:var(--primary-soft);color:var(--primary-dark);">${s.qCount} 道考题</span></div>
      <div class="content">${s.body}</div>
      <div class="practice-zone">
        <button class="practice-btn" data-practice-section="${s.id}" ${s.qCount === 0 ? 'disabled' : ''}>
          <span class="ic">▶</span> 练习本节 ${s.qCount} 道题
        </button>
        <span class="practice-progress" data-progress="${s.id}"></span>
      </div>
    </section>`;
  });
  html += `<section id="pocket" class="section"><div class="content">${POCKET_HTML}</div>
    <div class="practice-zone">
      <button class="practice-btn" id="allFromPocket"><span class="ic">📝</span> 进入全部题库练习</button>
    </div></section>`;
  root.innerHTML = html;
  root.querySelectorAll('button[data-practice-section]').forEach(btn => {
    btn.onclick = () => startSectionPractice(+btn.dataset.practiceSection);
  });
  const allBtn = document.getElementById('allFromPocket');
  if (allBtn) allBtn.onclick = startAllPractice;
  updateProgressLabels();
}

function updateProgressLabels() {
  document.querySelectorAll('[data-progress]').forEach(el => {
    const sid = +el.dataset.progress;
    const sec = SEC_BY_ID[sid];
    if (!sec) return;
    let correct = 0, wrong = 0, favCount = 0;
    sec.qIds.forEach(id => {
      if (stats.results[id] === true) correct++;
      else if (stats.results[id] === false) wrong++;
      if (favorites.has(id)) favCount++;
    });
    let txt = '';
    if (correct + wrong === 0) {
      txt = '尚未练习';
    } else {
      txt = `已答 <span class="correct-count">✓${correct}</span> · <span class="wrong-count">✗${wrong}</span> / ${sec.qIds.length}`;
    }
    if (favCount > 0) txt += `　<span style="color:var(--star);">⭐${favCount}</span>`;
    el.innerHTML = txt;
  });
}

// ============================================================
// Practice engine
// ============================================================
let practice = null;

function startSectionPractice(sid) {
  const sec = SEC_BY_ID[sid];
  if (!sec || sec.qIds.length === 0) return;
  startPractice(sec.qIds.map(id => Q_BY_ID[id]), `${sec.id}. ${sec.title}`, '章节练习');
}

function startAllPractice() {
  startPractice(QUESTIONS.slice(), '全部题库', `顺序练习（${QUESTIONS.length} 题）`);
}

function startRandomPractice(n) {
  const pool = QUESTIONS.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const subset = pool.slice(0, n);
  startPractice(subset, '随机练习', `随机抽取 ${n} 道题`);
}

function startWrongPractice() {
  const wrongIds = stats.wrong.slice();
  if (wrongIds.length === 0) {
    showToast('暂无错题记录，先完成一些练习吧');
    return;
  }
  const qs = wrongIds.map(id => Q_BY_ID[id]).filter(Boolean);
  startPractice(qs, '错题练习', `共 ${qs.length} 道错题`);
}

function startFavoritesPractice() {
  if (favorites.size === 0) {
    showToast('还未收藏任何题目。练习时点 ☆ 即可收藏');
    return;
  }
  const qs = [...favorites].map(id => Q_BY_ID[id]).filter(Boolean);
  startPractice(qs, '收藏练习', `共 ${qs.length} 道收藏`);
}

function startSingleQuestion(qid) {
  const q = Q_BY_ID[qid];
  if (!q) return;
  const sec = SEC_BY_ID[Q_TO_SEC[qid]];
  const title = sec ? `${sec.id}. ${sec.title}` : '题目';
  startPractice([q], title, '单题练习');
}

function startPractice(qs, title, sub) {
  if (!qs || qs.length === 0) return;
  practice = {
    questions: qs,
    index: 0,
    title, sub,
    selected: {},
    submitted: {},
    correctness: {}
  };
  closeSearch();
  document.getElementById('practiceModal').hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('pTitle').textContent = title;
  document.getElementById('pClose').onclick = closePractice;
  document.getElementById('pFavBtn').onclick = () => {
    const cur = practice.questions[practice.index];
    toggleFavorite(cur.i);
    updateStarBtn();
  };
  renderQuestion();
}

function closePractice() {
  document.getElementById('practiceModal').hidden = true;
  document.body.style.overflow = '';
  practice = null;
  updateProgressLabels();
  updateBadges();
}

function updateStarBtn() {
  if (!practice) return;
  const q = practice.questions[practice.index];
  const btn = document.getElementById('pFavBtn');
  if (favorites.has(q.i)) {
    btn.classList.add('fav');
    btn.textContent = '★';
    btn.title = '取消收藏';
  } else {
    btn.classList.remove('fav');
    btn.textContent = '☆';
    btn.title = '收藏本题';
  }
}

function renderQuestion() {
  if (!practice) return;
  const i = practice.index;
  const total = practice.questions.length;
  const q = practice.questions[i];
  const isMulti = q.n > 1;
  const submitted = !!practice.submitted[i];
  const sel = practice.selected[i] || [];
  const correctAns = q.a.split('').sort();

  document.getElementById('pSub').textContent = `${practice.sub} · 第 ${i + 1} / ${total} 题`;
  document.getElementById('pBar').style.width = ((i + 1) / total * 100) + '%';
  updateStarBtn();

  let body = '<div class="q-meta">';
  body += `<span class="tag mc${isMulti ? ' multi' : ''}">${isMulti ? `多选 (${q.n} 项)` : '单选'}</span>`;
  body += `<span class="tag">${q.i}</span>`;
  body += `<span class="tag">章 ${q.p}</span>`;
  const sec = SEC_BY_ID[Q_TO_SEC[q.i]];
  if (sec) body += `<span class="tag" style="background:var(--primary-soft);color:var(--primary-dark);cursor:pointer;" data-jump="${sec.id}">§${sec.id} ${escapeHtml(sec.title)}</span>`;
  body += '</div>';
  if (q.img) {
    body += `<div class="q-img-notice">📷 此题包含附图（${escapeHtml(q.img)}），本应用未内嵌图像，请参考原 PDF</div>`;
  }
  body += `<div class="q-body">${escapeHtml(q.q)}</div>`;
  body += '<div class="options">';
  ['A','B','C','D'].forEach(letter => {
    const text = q[letter] || '';
    if (!text) return;
    let cls = 'option';
    if (submitted) {
      cls += ' submitted';
      const isCorrect = correctAns.includes(letter);
      const wasSelected = sel.includes(letter);
      if (isCorrect) cls += ' correct';
      else if (wasSelected) cls += ' incorrect-selected';
    } else if (sel.includes(letter)) {
      cls += ' selected';
    }
    body += `<div class="${cls}" data-letter="${letter}">
      <div class="option-letter">${letter}</div>
      <div class="option-text">${escapeHtml(text)}</div>
    </div>`;
  });
  body += '</div>';

  if (submitted) {
    const correct = practice.correctness[i];
    if (correct) {
      body += `<div class="feedback correct"><span class="ic">✓</span><div><strong>回答正确！</strong><br>正确答案：${correctAns.join('、')}</div></div>`;
    } else {
      body += `<div class="feedback wrong"><span class="ic">✗</span><div><strong>回答错误</strong><br>正确答案：${correctAns.join('、')}　你的选择：${sel.length ? sel.join('、') : '(未作答)'}${sec ? `<br><a class="jump-link" data-jump="${sec.id}">→ 复习相关知识点 §${sec.id}</a>` : ''}</div></div>`;
    }
  }

  document.getElementById('pBody').innerHTML = body;

  document.getElementById('pBody').querySelectorAll('.option').forEach(el => {
    if (submitted) return;
    el.onclick = () => {
      const letter = el.dataset.letter;
      let cur = practice.selected[i] || [];
      if (isMulti) {
        if (cur.includes(letter)) cur = cur.filter(x => x !== letter);
        else cur = [...cur, letter];
      } else {
        cur = [letter];
      }
      practice.selected[i] = cur;
      renderQuestion();
    };
  });

  document.getElementById('pBody').querySelectorAll('[data-jump]').forEach(el => {
    el.style.cursor = 'pointer';
    el.onclick = () => {
      const sid = el.dataset.jump;
      closePractice();
      const target = document.getElementById('sec-' + sid);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    };
  });

  const f = document.getElementById('pFooter');
  let footerHtml = '';
  footerHtml += `<button id="prevBtn" ${i === 0 ? 'disabled' : ''}>← 上一题</button>`;
  footerHtml += '<span class="spacer"></span>';
  if (!submitted) {
    const ready = sel.length > 0 && (isMulti ? sel.length === q.n : true);
    footerHtml += `<button id="submitBtn" class="primary" ${ready ? '' : 'disabled'}>提交答案</button>`;
  } else if (i < total - 1) {
    footerHtml += `<button id="nextBtn" class="primary">下一题 →</button>`;
  } else {
    footerHtml += `<button id="finishBtn" class="primary">查看结果 →</button>`;
  }
  f.innerHTML = footerHtml;
  const prev = document.getElementById('prevBtn');
  if (prev) prev.onclick = () => { practice.index = Math.max(0, i - 1); renderQuestion(); };
  const subBtn = document.getElementById('submitBtn');
  if (subBtn) subBtn.onclick = submitAnswer;
  const nxt = document.getElementById('nextBtn');
  if (nxt) nxt.onclick = () => { practice.index = i + 1; renderQuestion(); };
  const fin = document.getElementById('finishBtn');
  if (fin) fin.onclick = showResults;
}

function submitAnswer() {
  if (!practice) return;
  const i = practice.index;
  const q = practice.questions[i];
  const sel = (practice.selected[i] || []).slice().sort();
  const correctAns = q.a.split('').sort();
  const correct = sel.length === correctAns.length && sel.every((v, idx) => v === correctAns[idx]);
  practice.submitted[i] = true;
  practice.correctness[i] = correct;
  recordResult(q.i, correct);
  renderQuestion();
}

function showResults() {
  if (!practice) return;
  const total = practice.questions.length;
  let correct = 0, wrong = 0, skipped = 0;
  const wrongList = [];
  practice.questions.forEach((q, i) => {
    if (!practice.submitted[i]) { skipped++; return; }
    if (practice.correctness[i]) correct++;
    else { wrong++; wrongList.push({ q, sel: practice.selected[i] || [] }); }
  });
  const score = total > 0 ? Math.round(correct / total * 100) : 0;
  const ringDeg = (correct / total) * 360;
  const ringColor = score >= 80 ? 'var(--success)' : score >= 60 ? 'var(--warning)' : 'var(--error)';

  document.getElementById('pSub').textContent = `${practice.sub} · 结果`;
  document.getElementById('pBar').style.width = '100%';

  let html = '<div class="result-card">';
  html += `<div class="score-ring" style="--ring-deg: ${ringDeg}deg; background: conic-gradient(${ringColor} ${ringDeg}deg, var(--border) 0deg);">
    <div class="score-num">${score}%<small>正确率</small></div>
  </div>`;
  html += `<div class="summary">本次共 <strong>${total}</strong> 题</div>`;
  html += `<div class="breakdown">
    <div class="item correct"><div class="label">正确</div><div class="val">${correct}</div></div>
    <div class="item wrong"><div class="label">错误</div><div class="val">${wrong}</div></div>
    ${skipped ? `<div class="item"><div class="label">跳过</div><div class="val">${skipped}</div></div>` : ''}
  </div>`;
  html += '<div class="result-actions">';
  if (wrong > 0) html += '<button class="action-btn primary" id="retryWrong">🔁 重做错题</button>';
  html += '<button class="action-btn" id="retryAll">↺ 全部重做</button>';
  html += '<button class="action-btn" id="backLearn">📖 返回学习</button>';
  html += '</div>';
  if (wrongList.length > 0) {
    html += '<div class="review-section"><h4>错题回顾</h4>';
    wrongList.forEach(w => {
      const correctAns = w.q.a.split('').sort().join('、');
      const sec = SEC_BY_ID[Q_TO_SEC[w.q.i]];
      html += `<div class="review-item">
        <div class="rq">${escapeHtml(w.q.q)}</div>
        <div class="ra">
          <span class="right">正确：${correctAns}</span>
          <span class="your">你的：${w.sel.length ? w.sel.join('、') : '(未答)'}</span>
          ${sec ? `<span data-jump="${sec.id}" style="cursor:pointer;color:var(--primary-dark);text-decoration:underline;">§${sec.id} ${escapeHtml(sec.title)}</span>` : ''}
        </div>
      </div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('pBody').innerHTML = html;
  document.getElementById('pFooter').innerHTML = '<span class="spacer"></span><button class="primary" id="closeResult">完成</button>';
  document.getElementById('closeResult').onclick = closePractice;
  const rw = document.getElementById('retryWrong');
  if (rw) rw.onclick = () => {
    const wq = wrongList.map(w => w.q);
    startPractice(wq, practice.title + '（错题回顾）', `${wq.length} 道错题`);
  };
  document.getElementById('retryAll').onclick = () => {
    const qs = practice.questions.slice();
    const title = practice.title;
    const sub = practice.sub;
    startPractice(qs, title, sub);
  };
  document.getElementById('backLearn').onclick = closePractice;
  document.querySelectorAll('[data-jump]').forEach(el => {
    el.onclick = () => {
      const sid = el.dataset.jump;
      closePractice();
      const target = document.getElementById('sec-' + sid);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
    };
  });
}

// ============================================================
// Search
// ============================================================
let searchState = { tab: 'questions', query: '', results: { questions: [], sections: [] } };

function openSearch() {
  document.getElementById('searchModal').hidden = false;
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('searchInput').focus(), 50);
}
function closeSearch() {
  document.getElementById('searchModal').hidden = true;
  document.body.style.overflow = '';
}

function runSearch() {
  const q = document.getElementById('searchInput').value.trim();
  searchState.query = q;
  if (!q) {
    searchState.results = { questions: [], sections: [] };
    renderSearchResults();
    return;
  }
  const ql = q.toLowerCase();
  // Question matches
  const qMatches = [];
  for (const item of QUESTIONS) {
    const hay = (item.q + ' ' + item.A + ' ' + item.B + ' ' + item.C + ' ' + item.D).toLowerCase();
    if (hay.includes(ql)) {
      qMatches.push(item);
      if (qMatches.length >= 200) break;
    }
  }
  // Section matches
  const sMatches = SECTIONS.filter(s => {
    const stripped = s.body.replace(/<[^>]+>/g, ' ').toLowerCase();
    return s.title.toLowerCase().includes(ql) || stripped.includes(ql);
  });
  searchState.results = { questions: qMatches, sections: sMatches };
  renderSearchResults();
}

function renderSearchResults() {
  const { tab, query, results } = searchState;
  document.getElementById('qResCount').textContent = results.questions.length;
  document.getElementById('sResCount').textContent = results.sections.length;
  const root = document.getElementById('searchResults');
  if (!query) {
    root.innerHTML = '<div class="search-empty"><div class="big">🔎</div>输入关键词搜索题目或知识点</div>';
    return;
  }
  const items = tab === 'questions' ? results.questions : results.sections;
  if (items.length === 0) {
    root.innerHTML = `<div class="search-empty"><div class="big">∅</div>未找到 "${escapeHtml(query)}" 相关${tab === 'questions' ? '题目' : '知识点'}</div>`;
    return;
  }
  let html = '';
  if (tab === 'questions') {
    items.forEach(q => {
      const sec = SEC_BY_ID[Q_TO_SEC[q.i]];
      const isMulti = q.n > 1;
      // Find best snippet from q text or options
      let snippetSrc = q.q;
      const lowerQ = q.q.toLowerCase();
      const ql = query.toLowerCase();
      if (!lowerQ.includes(ql)) {
        // search in options
        for (const L of ['A','B','C','D']) {
          if (q[L].toLowerCase().includes(ql)) {
            snippetSrc = `${q.q}　→ 选项 ${L}: ${q[L]}`;
            break;
          }
        }
      }
      const snippet = makeSnippet(snippetSrc, query, 140);
      html += `<button class="search-result" data-qid="${q.i}">
        <div class="res-title">${highlightText(snippet, query)}</div>
        <div class="res-meta">
          <span class="badge">${q.i}</span>
          ${sec ? `<span>§${sec.id} ${escapeHtml(sec.title)}</span>` : ''}
          <span>${isMulti ? `多选 ${q.n} 项` : '单选'}</span>
          ${favorites.has(q.i) ? '<span style="color:var(--star);">⭐</span>' : ''}
        </div>
      </button>`;
    });
  } else {
    items.forEach(s => {
      // Get snippet from section body (stripped)
      const stripped = s.body.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      const snippet = makeSnippet(stripped, query, 160);
      html += `<button class="search-result" data-sid="${s.id}">
        <div class="res-title">§${s.id} ${highlightText(s.title, query)}</div>
        <div class="res-meta">${highlightText(snippet, query)}</div>
      </button>`;
    });
  }
  root.innerHTML = html;
  root.querySelectorAll('button.search-result').forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.qid) {
        startSingleQuestion(btn.dataset.qid);
      } else if (btn.dataset.sid) {
        const target = document.getElementById('sec-' + btn.dataset.sid);
        closeSearch();
        if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
      }
    };
  });
}

function makeSnippet(text, query, maxLen) {
  if (!text) return '';
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1 || text.length <= maxLen) return text.length > maxLen ? text.slice(0, maxLen) + '…' : text;
  const half = Math.floor((maxLen - query.length) / 2);
  let start = Math.max(0, idx - half);
  let end = Math.min(text.length, start + maxLen);
  if (end - start < maxLen) start = Math.max(0, end - maxLen);
  let snippet = text.slice(start, end);
  if (start > 0) snippet = '…' + snippet;
  if (end < text.length) snippet = snippet + '…';
  return snippet;
}

document.getElementById('searchInput').addEventListener('input', runSearch);
document.querySelectorAll('.search-tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.search-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    searchState.tab = t.dataset.tab;
    renderSearchResults();
  };
});
document.getElementById('closeSearch').onclick = closeSearch;
document.getElementById('searchModal').addEventListener('click', e => {
  if (e.target.id === 'searchModal') closeSearch();
});

// ============================================================
// Keyboard shortcuts
// ============================================================
document.addEventListener('keydown', e => {
  // ⌘K / Ctrl+K → search
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openSearch();
    return;
  }
  if (e.key === 'Escape') {
    if (!document.getElementById('searchModal').hidden) { closeSearch(); return; }
    if (!document.getElementById('practiceModal').hidden) { closePractice(); return; }
  }
});

// ============================================================
// Toast (simple status message)
// ============================================================
function showToast(msg) {
  let t = document.getElementById('__toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '__toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:0.9rem;z-index:9999;box-shadow:var(--shadow-lg);opacity:0;transition:opacity 0.2s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

// ============================================================
// Section nav highlight (intersection observer)
// ============================================================
function setupNavHighlight() {
  const sections = document.querySelectorAll('section.section');
  const navLinks = {};
  document.querySelectorAll('button.nav-link').forEach(b => {
    navLinks[b.dataset.target] = b;
  });
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        Object.values(navLinks).forEach(b => b.classList.remove('active'));
        const link = navLinks[e.target.id];
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });
  sections.forEach(s => observer.observe(s));
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
  if (!localStorage.getItem(ThemeKey)) {
    applyTheme(e.matches ? 'dark' : 'light');
  }
});
