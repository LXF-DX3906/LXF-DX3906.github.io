:"请尽快寄出 QSL 卡片","D":"请勿通过卡片管理局交换 QSL 卡片","n":1,"img":""},{"i":"MC1-0410","p":"2.4.2","q":"在通联中，如需更正刚才发错的内容，我们通常以“抱歉”开启会话，缩语为：","a":"A","A":"SRI","B":"SNR","C":"STN","D":"SMS","n":1,"img":""},{"i":"MC1-0411","p":"2.4.2","q":"“温度”的缩语是：","a":"A","A":"TEMP","B":"TMPO","C":"TUNE","D":"WX","n":1,"img":""},{"i":"MC1-0412","p":"2.4.2","q":"“谢谢”的缩语是：","a":"A","A":"TNX、TKS","B":"SRI、SAE","C":"CU、GB","D":"TVI、RFI","n":1,"img":""},{"i":"MC1-0413","p":"2.4.2","q":"“谢谢你”的缩语是：","a":"A","A":"TU","B":"ATU","C":"TX","D":"ATT","n":1,"img":""},{"i":"MC1-0414","p":"2.4.2","q":"“你的”或者“你是”可用缩语表示为：","a":"A","A":"UR","B":"TU","C":"FB","D":"US","n":1,"img":""},{"i":"MC1-0415","p":"2.4.2","q":"在 CW 通联中，我们有时会抄到缩语“WL”，意思是：","a":"A","A":"将要","B":"超级棒","C":"物理","D":"滑铁卢","n":1,"img":""},{"i":"MC1-0416","p":"2.4.2","q":"收听 CW 或 SSB 联络，我们有时会听到缩语 “XYL”。其含义是：","a":"A","A":"妻子","B":"晶体","C":"女士","D":"发信机","n":1,"img":""},{"i":"MC1-0417","p":"2.4.2","q":"有一类业余无线电操作员享有称呼“YL”。而有些业余无线电竞赛也为这些人士制定了专享的规则。缩语“YL”的含义是：","a":"A","A":"女士","B":"好运","C":"你的","D":"领导","n":1,"img":""},{"i":"MC1-0418","p":"2.4.2","q":"术语“单元”通常指天线振子。其缩语是：","a":"A","A":"EL、ELE 或 ELS","B":"YAGI","C":"ANT","D":"UNIT","n":1,"img":""},{"i":"MC1-0419","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 DP 代表：","a":"A","A":"偶极天线","B":"长线天线","C":"定向天线","D":"垂直天线","n":1,"img":""},{"i":"MC1-0420","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 GP 代表：","a":"A","A":"垂直接地天线","B":"对数周期天线","C":"偶极天线","D":"定向天线","n":1,"img":""},{"i":"MC1-0421","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 VER 代表：","a":"A","A":"垂直天线","B":"垂直接地天线","C":"定向天线","D":"偶极天线","n":1,"img":""},{"i":"MC1-0422","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 LW 代表：","a":"A","A":"长线天线","B":"偶极天线","C":"定向天线","D":"垂直天线","n":1,"img":""},{"i":"MC1-0423","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 YAGI 代表：","a":"A","A":"八木天线","B":"定向天线","C":"偶极天线","D":"垂直天线","n":1,"img":""},{"i":"MC1-0424","p":"2.4.2","q":"在业余无线电通联中探讨天线时，缩写 BEAM 代表：","a":"A","A":"定向天线","B":"八木天线","C":"偶极天线","D":"垂直天线","n":1,"img":""},{"i":"MC1-0425","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示 CW 报的发射类别是：","a":"A","A":"A1A","B":"J3E","C":"F2B","D":"G2B","n":1,"img":""},{"i":"MC1-0426","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示单边带话的发射类别是：","a":"A","A":"J3E","B":"A1A","C":"F2B","D":"G2B","n":1,"img":""},{"i":"MC1-0427","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用单边带话传输的SSTV 信号的发射类别是：","a":"A","A":"F3F","B":"J3E","C":"F2B","D":"F3E","n":1,"img":""},{"i":"MC1-0428","p":"2.5.1","q":"发射类别（class of emission）是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示调频话的发射类别是：","a":"A","A":"F3E","B":"F3F","C":"J3E","D":"F2B","n":1,"img":""},{"i":"MC1-0429","p":"2.5.1","q":"发射类别是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示用调频话传输的 SSTV 信号的发射类别是：","a":"A","A":"F3F","B":"F2B","C":"J3E","D":"F3E","n":1,"img":""},{"i":"MC1-0430","p":"2.5.1","q":"发射类别是指用标准符号标示的某发射的一组特性，例如主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性。表示调频 ATV 信号的发射类别是：","a":"A","A":"F3F","B":"F2B","C":"F3E","D":"J3E","n":1,"img":""},{"i":"MC1-0431","p":"2.5.1","q":"带外发射是指：","a":"A","A":"由于调制过程而产生的、刚超出必要带宽的一个或多个频率的发射，但杂散发射除外","B":"由于调制过程而产生的、刚超出占用带宽的一个或多个频率的发射，但杂散发射除外","C":"由于调制过程而产生的、刚超出参考带宽的一个或多个频率的发射，但杂散发射除外","D":"由于调制过程而产生的、刚超出固定带宽的一个或多个频率的发射，但杂散发射除外","n":1,"img":""},{"i":"MC1-0432","p":"2.5.1","q":"业余无线电通信中三种最基本调制的缩写是 AM、FM 和 PM。它们的中文名称是：","a":"A","A":"幅度调制（调幅）、频率调制（调频）、相位调制（调相）","B":"幅度调制（调幅）、频率调制（调频）、脉宽调制（调脉宽）","C":"频率调制（调频）、脉码调制（调脉码）、幅度调制（调幅）","D":"幅度调制（调幅）、频率调制（调频）、电码调制（莫尔斯）","n":1,"img":""},{"i":"MC1-0433","p":"2.5.1","q":"以下哪种调制方式被广泛应用于 VHF 或 UHF 本地通联？","a":"A","A":"FM","B":"SSB","C":"PSK","D":"AM","n":1,"img":""},{"i":"MC1-0434","p":"2.5.1","q":"以下哪种调制方式被广泛应用于长距离和弱信号情况下的 VHF 或 UHF 话音通联？","a":"A","A":"SSB","B":"AM","C":"FM","D":"PM","n":1,"img":""},{"i":"MC1-0435","p":"2.5.1","q":"以下哪种调制方式被广泛应用于 HF 话音通联？","a":"A","A":"SSB","B":"AM","C":"FM","D":"PM","n":1,"img":""},{"i":"MC1-0436","p":"2.5.1","q":"与 FM 相比，SSB 方式的优点是什么？","a":"A","A":"发射带宽较 FM 方式窄","B":"同频电台彼此互不干扰","C":"对天电干扰免疫","D":"对主载波的频率误差不敏感","n":1,"img":""},{"i":"MC1-0437","p":"2.5.1","q":"相比 SSB 方式，FM 的主要缺点是什么？","a":"A","A":"无法同时守听多个信号","B":"抵抗脉冲干扰的能力差","C":"对主载波的频率误差很敏感","D":"含有恒定不变的载波分量，发射功率利用不充分","n":1,"img":""},{"i":"MC1-0438","p":"2.5.1","q":"在 VHF 和 UHF 频段进行 SSB 通联通常选用哪个边带？","a":"A","A":"上边带","B":"下边带","C":"抑制边带","D":"残留边带","n":1,"img":""},{"i":"MC1-0439","p":"2.5.1","q":"在 14MHz 及以上 HF 频段进行语音通信通常选用哪个边带？","a":"A","A":"上边带","B":"下边带","C":"抑制边带","D":"残留边带","n":1,"img":""},{"i":"MC1-0440","p":"2.5.1","q":"在 7MHz 及以下频段进行语音通信通常选用哪个边带？","a":"A","A":"下边带","B":"上边带","C":"抑制边带","D":"残留边带","n":1,"img":""},{"i":"MC1-0441","p":"2.5.1","q":"为什么业余电台在 10.1MHz 以下频段使用下边带进行话音通联，而在 10.1MHz 以上频段却使用上边带？","a":"A","A":"这是各国业余无线电爱好者普遍接受并沿用至今的一种通联习惯","B":"10.1MHz 以下频段更利于下边带的传播","C":"10.1MHz 以上频段更利于上边带的传播","D":"因为在接收机中设置一个 10.1MHz 的 BFO 可以同时收听上边带和下边带","n":1,"img":""},{"i":"MC1-0442","p":"2.5.1","q":"发起 SSB 呼叫时，你与周边电台的频率间隔应至少为：","a":"A","A":"2-3kHz","B":"150-500Hz","C":"15-50Hz","D":"大约 6kHz","n":1,"img":""},{"i":"MC1-0443","p":"2.5.1","q":"下列哪种调制方式可以纳入调幅（AM）的范畴？","a":"A","A":"单边带调制（SSB）","B":"线性调频（Chirp）","C":"直序扩频（DSSS）","D":"相移键控（PSK）","n":1,"img":""},{"i":"MC1-0444","p":"2.5.1","q":"在业余无线电业务中，有种通信方式的缩写是 CW。其含义为：","a":"A","A":"等幅电报","B":"莫尔斯编码","C":"幅度键控","D":"频移键控","n":1,"img":""},{"i":"MC1-0445","p":"2.5.1","q":"以下哪种调制方式拥有最窄的发射带宽？","a":"A","A":"CW","B":"单边带话","C":"调频话","D":"ATV","n":1,"img":""},{"i":"MC1-0446","p":"2.5.1","q":"业余电台一般不用调频话方式进行莫尔斯电码通联。这是因为：","a":"A","A":"调频话信道带宽超过传输莫尔斯电码的必要带宽，不符合我国《无线电频率划分规定》“电台的技术特性”一章关于 “把带宽保持在技术状态和该项业务的性质所允许的最低值上”的要求","B":"调频话方式不能传输莫尔斯电码","C":"调频话方式传输莫尔斯电码可靠性差","D":"调频话方式传输莫尔斯电码时速度受限制","n":1,"img":""},{"i":"MC1-0447","p":"2.5.1","q":"无论是 FM 还是 SSB 调制，向发射机的话筒输入端施加 10 倍于规定输入电压的音频信号，最可能的结果是：","a":"A","A":"信号失真。大量的谐波和互调产物还可能促使发射带宽增加，通信质量下降","B":"通信距离有效延长了，信号听起来也更加饱满","C":"通信距离有效延长了，只是信号听上去失真了","D":"发射功率超过额定值，发射机的末级射频功率器件会因此烧毁","n":1,"img":""},{"i":"MC3-0512","p":"2.6.3","q":"Yaesu System Fusion 简称 YSF，是数字语音和数据传输相互融合的一种通信方式，特点是：","a":"ABC","A":"该方式为业余无线电通信广为采用","B":"具备通过中继台转发进行通信的能力","C":"调制方式为 C4FM","D":"使用时分多址技术增加带宽的利用率","n":3,"img":""},{"i":"MC4-0513","p":"2.6.3","q":"Icom D-STAR System 提供了一种数据通信方式，特点是：","a":"ABCD","A":"是业余无线电通信广为采用的一种数字语音和数据传输方式","B":"可以通过中继台扩展 D-STAR 用户的通信范围","C":"该方式允许用户通过互联网和 D-STAR 热点与其他用户通信","D":"D-STAR 支持全球卫星定位和位置报告功能","n":4,"img":""},{"i":"MC3-0514","p":"2.6.3","q":"FreeDV 是一种数字语音方式。其特点是：","a":"ABC","A":"为爱好者提供一种传输带宽较窄，完全适合 HF 的数字语音方式","B":"为爱好者提供探索数字通信原理和语音处理技术的可能性","C":"在遵循开源许可协议的前提下可用来研发自己的业余无线电装备","D":"使用 FM 手持或车载电台进行 FreeDV 通信时音色尤为优美","n":3,"img":""},{"i":"MC4-0515","p":"2.6.4","q":"数字业余电视（DATV）是将数字音视频压缩编码实验用于实时图像通信的一种方式。通过卫星转发器进行 DATV 联络时，爱好者们普遍选用 DVB-S2 协议，调制方式可以是：","a":"ABCD","A":"QPSK","B":"8PSK","C":"16APSK","D":"32APSK","n":4,"img":""},{"i":"MC1-0516","p":"2.6.4","q":"使用 DRM 协议进行数字慢扫描电视（DSSTV）通信时，爱好者总是倾向于通过单边带而非调频话方式来传输在音频范围内生成的 DSSTV 基带。主要原因是：","a":"A","A":"单边带方式完整保留 DSSTV 的基带特性，利于衰落信道中的差错控制","B":"使用调频话传输 DSSTV 增添门限效应，因此也增加了信号的发射带宽","C":"使用调频话传输 DSSTV 虽然可以改善画质，但是无法提高伴音的音质","D":"使用调频话传输 DSSTV 虽然可以改善伴音的音质，但是无法提高画质","n":1,"img":""},{"i":"MC1-0565","p":"3.1.1","q":"什么是收发信机？","a":"A","A":"一种组合了接收机和发射机的无线电通信设备","B":"一种将收到的信号再行转发的设备","C":"一种将收到的信息解码，纠错并转发的设备","D":"一种将数字话音转换为模拟话音并转发的设备","n":1,"img":""},{"i":"MC2-0566","p":"3.1.1","q":"一个可以工作的无线电接收系统至少包含哪些部件？","a":"AB","A":"接收天线","B":"解调器","C":"电位器","D":"电源","n":2,"img":""},{"i":"MC3-0567","p":"3.1.1","q":"一个可以工作的无线电发射系统至少包含哪些部件？","a":"ABC","A":"射频振荡器","B":"调制器","C":"发射天线","D":"防雷器","n":3,"img":""},{"i":"MC1-0568","p":"3.1.1","q":"为什么业余无线电收发信机所用的直流电源线要尽量短，尽量粗？","a":"A","A":"减小发信时电源线上的压降","B":"分流机箱外表面的射频电流","C":"防止收发信机意外滑落摔坏","D":"厂商销售电源线的一种策略","n":1,"img":""},{"i":"MC1-0569","p":"3.1.1","q":"单工操作（simplex operation）是指：在一条电信通路的两个方向上交替进行传输的一种工作方式。下列通信采用单工操作方式：","a":"A","A":"两台由 PTT 键转换收发状态的业余对讲机之间的通信","B":"两台有线电话座机之间的通信","C":"两台公众移动电话终端（手机）之间的通信","D":"一台业余中继台与一台由 PTT 键转换收发状态的业余对讲机之间的通信","n":1,"img":""},{"i":"MC1-0570","p":"3.1.1","q":"双工操作（duplex operation）是指：一条电信通路的两个方向能同时进行传输的工作方式。下列通信采用双工操作方式：","a":"A","A":"由一台连续工作的 430MHz 接收机和一台 144MHz 发信机组成的地面业余电台与业余卫星之间的通信","B":"两台具有 QSK 功能的业余 CW 收发信之间的通信","C":"一台业余中继台与一台由 PTT 键转换收发状态的业余对讲机之间的通信","D":"两台由 PTT 键转换收发状态的业余对讲机之间的通信","n":1,"img":""},{"i":"MC1-0571","p":"3.1.1","q":"半双工操作（semi-duplex operation）是指：电路的一端用单工操作，另一端用双工操作的一种工作方式。下列通信采用半双工操作方式：","a":"A","A":"一台业余中继台与一台由 PTT 键转换收发状态的业余对讲机之间的通信","B":"两台具有 QSK 功能的业余 CW 收发信之间的通信","C":"两台由 PTT 键转换收发状态的业余对讲机之间的通信","D":"两台公众移动电话终端（手机）之间的通信","n":1,"img":""},{"i":"MC1-0572","p":"3.1.1","q":"收发信机中的 PTT 是指什么信号？","a":"A","A":"按键发射，有信号（一般为对地接通）时发射机由等待转为发射","B":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","C":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","D":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","n":1,"img":""},{"i":"MC1-0573","p":"3.1.1","q":"收发信机面板上或设置菜单中的符号 SQL 代表什么功能？","a":"A","A":"静噪控制，用来调整静噪阈值的大小","B":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","C":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","D":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","n":1,"img":""},{"i":"MC1-0574","p":"3.1.1","q":"收发信机设置静噪功能的目的是什么？","a":"A","A":"在没有信号的情况下关闭音频输出，避免播放刺耳的噪声","B":"滤除所收信号中的噪声，使对方的话音变得清晰","C":"滤除发信方的环境噪声，使发出的话音更为清晰","D":"自动控制收信机的增益，避免信号过强时发生阻塞或失真","n":1,"img":""},{"i":"MC1-0575","p":"3.1.1","q":"需要聆听非常微弱的 FM 信号时应如何设置收发信机的静噪？","a":"A","A":"关闭静噪或将阈值设为 0，使接收机的音频输出不受限制","B":"尽可能调高接收机的音量","C":"关闭 VOX 功能","D":"调节 VOX，使之处于最灵敏的状态","n":1,"img":""},{"i":"MC1-0576","p":"3.1.1","q":"用带有静噪功能的 FM 收发信机接收 FM 话音，我们有时会在发射方松开 PTT 的时候听到一种比较短促的“嘶”或“喀拉”的噪声拖尾。这是因为：","a":"A","A":"此类电路根据接收机鉴频输出的高音频噪声的大小来判断信号消失与否，并据此控制音频输出。这种检测需要一定的时间才能完成，这导致短暂泄漏刺耳的噪声","B":"该噪声是发射台话筒的 PTT 键接点跳动所致，发射到接收端时还可能带有“叮”的声音","C":"该噪声是发射台的一种有目的所为，例如是用作结束发射的标志，有时是“嘟”的声音","D":"这是由接收机的自动增益电路的时间常数造成","n":1,"img":""},{"i":"MC1-0577","p":"3.1.1","q":"收发信机面板上或设置菜单中的符号 VOL 代表什么功能？","a":"A","A":"音量控制，用来调整接收机放出的声音大小","B":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","C":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","D":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","n":1,"img":""},{"i":"MC1-0578","p":"3.1.1","q":"收发信机面板上或设置菜单中的符号 VOX 代表什么功能？","a":"A","A":"发信机声控，接入后将根据对话筒有无语音输入的判别自动控制收发转换","B":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","n":1,"img":""},{"i":"MC1-0579","p":"3.1.1","q":"既然收发信机已经具备 PTT 功能，那为什么有些机型还要提供 VOX？","a":"A","A":"双手忙于其他工作时，VOX 的“免提”特点有助于通联","B":"VOX 用于连接蓝牙耳机，提供操作的便捷性","C":"VOX 对话音提供更多加工处理，可有效降低发射带宽","D":"VOX 对话音提供更多加工处理，可使声音更易于辩识","n":1,"img":""},{"i":"MC1-0580","p":"3.1.1","q":"某些对讲机具有发送 CTCSS 码的功能。缩写 CTCSS 指的是：","a":"A","A":"亚音调静噪，即从 67-250.3Hz 的 38 个亚音调频率中选取一个作为选通信号，代表 38种状态之一，接收机没有收到特定的选通信号时自动关闭音频输出","B":"双音多频编码，由 8 个音调频率中的两个频率组合成的控制信号，代表 16 种状态之一，用于遥控和传输数字等简单字符","C":"数字设备识别码，即在松开 PTT 按键时自动发送一串代表设备代号的二进制数据","D":"自动静噪，即在接收机没有收到信号时自动关闭音频输出","n":1,"img":""},{"i":"MC1-0581","p":"3.1.1","q":"某些对讲机具有发送 DTMF 码的功能。缩写 DTMF 指的是：","a":"A","A":"双音多频编码，由 8 个音调频率中的两个频率组合成的控制信号，代表 16 种状态之一，用于遥控和传输数字等简单字符","B":"亚音调静噪，即从 67-250.3Hz 的 38 个亚音调频率中选取一个作为选通信号，代表 38种状态之一，接收机没有收到特定的选通信号时自动关闭音频输出","C":"数字设备识别码，即在松开 PTT 按键时自动发送一串代表设备代号的二进制数据","D":"自动静噪，即在接收机没有收到信号时自动关闭音频输出","n":1,"img":""},{"i":"MC2-0582","p":"3.1.1","q":"亚音和数字亚音静噪技术都是在调频发射机所发射的语音信号上附加一个人耳不易察觉的低频信号并用来选通接收机的静噪。它们所对应的收发信机设置菜单项有：","a":"AB","A":"CTCSS","B":"DCS","C":"DTMF","D":"SQL","n":2,"img":""},{"i":"MC1-0583","p":"3.1.1","q":"有些调频接收机的参数设置菜单有 NFM 和 WFM 两种选择。它们的含义是：","a":"A","A":"NFM 为窄带调频方式，适用于信道带宽 25kHz/12.5kHz 的通信信号；WFM 为宽带调频方式，适用于接收信道带宽 180kHz 左右的广播信号","B":"NFM 代表数字化语音方式，WFM 代表模拟语音方式","C":"NFM 为调频通信本地方式（较低灵敏度），WFM 为调频通信远程方式（最高灵敏度）","D":"NFM 为单频率守候方式，WFM 为双频率守候方式","n":1,"img":""},{"i":"MC1-0584","p":"3.1.1","q":"在一些 VHF/UHF 业余无线电调频手持对讲机或车载电台的设置菜单中有“全频偏”和“半频偏”的选项。其意义是：","a":"A","A":"代表与 25kHz 或者 12.5kHz 标称发射带宽相对应的 5kHz 或 2.5kHz 调制频偏","B":"同一频段内，全频偏方式下发射机的频率漂移显然是比半频偏的大一倍","C":"全频偏方式适用于收发异频的中继台通信；半频偏方式适用于同频直接联络","D":"全频偏方式压缩 5kHz 范围内的话音；半频偏方式只压缩低于 2.5kHz 的声音","n":1,"img":""},{"i":"MC3-0585","p":"3.1.1","q":"如果对方报告你的调频电台发射的信号听起来失真严重，可辨度差，原因可能包括：","a":"ABC","A":"电台的电源电压不足，可以检查供电电压或更换电池模块再试","B":"电台所处的位置多径衰落严重，可以挪动几步或变更频率再试","C":"电台的发射频率不准。如确认这种情况，需修好设备之后再试","D":"电台天线承载射频功率的能力不足，需更换高级天线之后再试","n":3,"img":""},{"i":"MC1-0586","p":"3.1.1","q":"如需快速切换至你常用的某个频率，应当如何设置你的电台？","a":"A","A":"将该频率作为一个频道存储到电台中","B":"打开哑音静噪功能","C":"关闭哑音静噪功能","D":"使用快速扫描功能来切换到那个频率","n":1,"img":""},{"i":"MC1-0587","p":"3.1.1","q":"车载电台的直流电源负极应当接在哪里？","a":"A","A":"接到电池的负极或发动机的接地带上","B":"接在天线座上","C":"可以连在汽车的任意金属部件上","D":"连在固定住电台的挂置架上","n":1,"img":""},{"i":"MC1-0588","p":"3.1.1","q":"有时，装在汽车上的移动电台可能放出随引擎转速而变的尖利啸声，其来源于：","a":"A","A":"发电机","B":"火花塞","C":"电动油泵","D":"ABS 控制器","n":1,"img":""},{"i":"MC1-0589","p":"3.1.1","q":"如果别的业余电台报告说你的手持电台发射的 FM 信号的频偏过大，你应当怎么做？","a":"A","A":"尝试切换至 NFM 档位进行通联。如已使用 NFM，则试着讲话时离话筒远一点儿","B":"更换一块新电池再试","C":"调至发射功率更大的档位","D":"使用更大的声音对着话筒讲话以触发系统中隐藏的但是非常好用的语音限幅功能","n":1,"img":""},{"i":"MC1-0590","p":"3.1.1","q":"如果其他电台报告说你的发射干扰了相邻频率的通信。你应当做的是：","a":"A","A":"检查发射机的频率指示是否准确、发射机的杂散发射指标是否合格","B":"换用另一种调制模式试试看","C":"将这种情况通知你的设备制造商","D":"立即增加发射功率","n":1,"img":""},{"i":"MC1-0591","p":"3.1.1","q":"如果其他电台报告说你在 2 米波段的信号本来很强，但是突然就变弱甚至难以辨别了，你应当怎么做？","a":"A","A":"稍稍移动一下自己的位置。电波传播的多径效应会时而引起信号衰落或解调失真","B":"打开发射机的亚音静噪功能","C":"请对方电台检查一下静噪设置","D":"将你电台中的锂电池换成镍氢的","n":1,"img":""},{"i":"MC1-0598","p":"3.1.3","q":"如果进行 SSB 或 CW 通联时周边环境嘈杂，哪种设备可以替代电台上的扬声器，改善话音抄收？","a":"A","A":"耳机","B":"低通滤波器","C":"视频显示器","D":"吊杆胖话筒","n":1,"img":""},{"i":"MC1-0599","p":"3.1.3","q":"全功能小型收发信机的面板上常有缩写为“NB”和“SQL”的功能，它们有什么不同？","a":"A","A":"NB 为“抑噪”，切除高于平均信号的大幅度突发脉冲噪声；SQL 为“静噪”，信噪比达不到一定水平时自动关闭音频输出","B":"NB 和 SQL 都是指“抑噪”，收不到有用信号时自动关断背景噪声","C":"NB 和 SQL 都是指“静噪”，切除高于平均信号的大幅度突发脉冲噪声","D":"NB 和 SQL 都是指“静噪”，收不到带有预期的特定控制信号时自动关断音频输出","n":1,"img":""},{"i":"MC1-0600","p":"3.1.3","q":"某些车辆的火花塞辐射脉冲干扰。这可能导致收信机的 AGC 过早起控，使正在接收的SSB 或 CW 信号受到压制，进而影响听抄。遇到这种情况，你应当如何设置你的电台？","a":"A","A":"打开电台的抑噪（NB）功能","B":"降低静噪（SQL）阀值","C":"将频率稍稍调偏一点儿","D":"反复调节电台的 RIT 旋钮","n":1,"img":""},{"i":"MC1-0601","p":"3.1.3","q":"全功能小型收发信机面板上的“MODE”代表什么功能：","a":"A","A":"用来切换工作方式，比如 FM、LSB、USB 和 CW 等","B":"用来切换静噪方式，比如 CTCSS 和 DCS 等","C":"用来切换接收机的工作方式，比如射频直采和低中频超外差等","D":"用来切换监听方式，比如单耳音频、双耳音频和 CW 立体声等","n":1,"img":""},{"i":"MC1-0602","p":"3.1.3","q":"收发信机面板上的符号 ATT 代表什么功能？","a":"A","A":"收信机输入衰减器，在接收大信号时接入，使信号不致过大而使前级电路过载","B":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","n":1,"img":""},{"i":"MC1-0603","p":"3.1.3","q":"收发信机面板上的符号 AGC 代表什么功能？","a":"A","A":"收信机自动增益控制，对中频级信号电平进行检测并反馈控制，防止电路过载","B":"收信自动音量控制，对音频输出电平进行检测并反馈控制，以维持其在适当限度之内","C":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","D":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","n":1,"img":""},{"i":"MC1-0604","p":"3.1.3","q":"既然全功能收信机具有 AGC 功能，那为什么好多机型还要装设衰减（ATT）开关？","a":"A","A":"特强带外信号可以阻塞接收机的前级电路，致使器件非线性工作，产生失真和互调。此时需在接收机的前端电路之前加入衰减器，并用开关控制其切入与否","B":"通常，增益控制旋钮的控制范围不够宽，加入 ATT 开关可以拓展增益控制范围","C":"如果遭遇特强带内干扰，那么打开 ATT 就可防止过大的音量损坏扬声器或耳机了","D":"这可以防止本台发射机的强信号损坏本台的接收机电路","n":1,"img":""},{"i":"MC2-0605","p":"3.1.3","q":"关于接收机的“过载”现象，以下描述正确的是：","a":"AB","A":"输入信号过于强大以至机内电路饱和阻塞，严重时会损坏接收机前端电路的元器件","B":"启用接收机的 ATT 功能可消除或缓解过载","C":"接收机消耗的电流过大，致使电源出现过载现象。情况严重时供电装置会烧毁","D":"减小接收机的喇叭音量，可缓解过载现象","n":2,"img":""},{"i":"MC1-0606","p":"3.1.3","q":"应关闭接收机 AGC 功能的情况是：","a":"A","A":"有用微弱信号和强干扰同时出现时","B":"接收微弱信号时","C":"接收特强信号时","D":"有用强信号中夹杂着微弱干扰","n":1,"img":""},{"i":"MC1-0607","p":"3.1.3","q":"应选择较短的 AGC 时间常数的情况是：","a":"A","A":"接收 FM/FSK/PSK 等包络幅度恒定的信号","B":"接收 SSB 和 AM 等正常信号的包络幅度不断变化的信号","C":"将接收机应用于“比幅度法规”测向时","D":"有用微弱信号和强干扰同时出现时","n":1,"img":""},{"i":"MC1-0608","p":"3.1.3","q":"应选择较长的 AGC 时间常数的情况是：","a":"A","A":"接收 SSB 和 AM 等正常信号的包络幅度不断变化的信号","B":"接收 FM/FSK/PSK 等包络幅度恒定的信号遇到变化很快的传播衰落时","C":"将接收机应用于“比幅度法规”测向时","D":"有用微弱信号和强干扰同时出现时","n":1,"img":""},{"i":"MC1-0609","p":"3.1.3","q":"多数小型全功能收发信机的面板上都可以看到符号 PRE，其代表什么功能？","a":"A","A":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","B":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"发信语音压缩，对音频输入电平进行检测并反馈控制，以提升语音包络幅度较小的部分","n":1,"img":""},{"i":"MC1-0610","p":"3.1.3","q":"收发信机面板上的符号 ALC 代表什么功能？","a":"A","A":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","B":"发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","C":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","D":"自动频率控制，对发射频率的漂移进行检测并反馈控制，以维持准确的工作频率","n":1,"img":""},{"i":"MC1-0611","p":"3.1.3","q":"在单边带发信机中，发信自动电平控制（ALC）的主要作用是：","a":"A","A":"防止过驱动导致调制失真或引发电路故障","B":"改善发信机的频率稳定度","C":"自动实现天线电路的阻抗匹配","D":"防止话筒过于灵敏带来背景噪声","n":1,"img":""},{"i":"MC1-0612","p":"3.1.3","q":"业余电台进行单边带话音通信时，如果对方反映虽然己方的讲话基本可辨，但是在话音的间隙中夹杂嘈杂的背景噪声。这时应当：","a":"A","A":"调低发射机的话筒增益。如果发射机带有语音压缩处理功能，则应尝试调低控制深度","B":"调低发射机的射频输出功率","C":"调整发射机的天线匹配电路","D":"调整发射机的 ALC 控制深度","n":1,"img":""},{"i":"MC1-0613","p":"3.1.3","q":"即使打开了发射机的 ALC，将话筒的增益调得过高仍可能导致：","a":"A","A":"发出的信号失真","B":"发射机的功率提升","C":"发射机的频率漂移变大","D":"天线的驻波比增加","n":1,"img":""},{"i":"MC1-0614","p":"3.1.3","q":"为什么使用单边带收发信机发送 AFSK 信号时需要关闭 ALC？","a":"A","A":"ALC 增加 AFSK 信号的失真，抬升误码率","B":"ALC 使发射功率失控，导致发射机故障","C":"ALC 使信号的极性反转，致使无法解码","D":"ALC 影响 AFSK 信号的频响，使音色变差","n":1,"img":""},{"i":"MC1-0615","p":"3.1.3","q":"单边带发信机的语音压缩功能有什么作用？","a":"A","A":"压低较强语音信号的幅度、提升较弱信号的幅度，改善较弱的语音在接收端的信噪比","B":"压低较弱语音信号的幅度、提升较强信号的幅度，增加语音的动态范围和抑扬顿挫感","C":"压低语音信号的低频分量，提升高频分量，增加信号的带宽，使高音更加细腻","D":"压缩信号所占用的频谱宽度，提高无线电频谱的利用率","n":1,"img":""},{"i":"MC1-0616","p":"3.1.3","q":"收发信机面板上的符号 PROC 代表什么功能？","a":"A","A":"发信语音压缩，对音频输入电平进行检测并反馈控制，以使包络幅度较小语音获得提升","B":"收信机前置放大器，在接收微弱信号时接入（此时某些技术指标可能低于额定值）","C":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","D":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","n":1,"img":""},{"i":"MC1-0617","p":"3.1.3","q":"发信时，若话音压缩调整不当可能带来什么问题?","a":"A","A":"可能产生很多互调成分，影响对方收信时的辨识度","B":"可能使话音严重失真，但是不影响对方电台的收信","C":"可能发射很大的交流声","D":"可能使话筒过载损坏","n":1,"img":""},{"i":"MC1-0618","p":"3.1.3","q":"为什么用单边带收发信机发送 AFSK 信号时应关闭语音压缩功能？","a":"A","A":"语音压缩可能导致信号的包络畸变，破坏基带特征，抬升误码率","B":"经语音压缩处理的信号，其相位变化已不存在，本质上无法解码","C":"经语音压缩处理的信号，其幅度变化已不存在，本质上无法解码","D":"语音压缩提升信号的峰均比，易导致发射机功率放大器过热损坏","n":1,"img":""},{"i":"MC1-0619","p":"3.1.3","q":"业余电台以发射的方法测量发射功率和天线驻波比时必须留意并做到的是：","a":"A","A":"先将频率设置到无人使用的空闲频率、偏离常用的热点频率","B":"先将天线的发射方向指向正北","C":"先将收发信机的语音压缩功能打开","D":"话筒离嘴距离在 2 公分以上，电键按键时间不短于 5 秒钟","n":1,"img":""},{"i":"MC1-0620","p":"3.1.3","q":"单边带业余电台测试检查天线驻波比需要发射平稳的连续信号。文明的作法是：","a":"A","A":"将电台设为 CW 方式并按下电键。或者，将电台设为 AM 或 FM 方式并按下 PTT 键（不对话筒说话）以产生连续载波。测试结束后设回 SSB 方式","B":"将电台设为 SSB 方式，用平稳的气流对话筒吹口哨","C":"将电台设为 SSB 方式，深呼吸后用平稳的气流对话筒发长音“啊”","D":"将电台设为 SSB 方式，深呼吸后用平稳的气流对话筒发长音“嘻”","n":1,"img":""},{"i":"MC1-0621","p":"3.1.3","q":"收发信机面板上的符号 AT 或者 TUNE 代表什么功能？","a":"A","A":"自动天线调谐，对天线电路的电压驻波比进行检测并进行自动补偿，以维持最小驻波比","B":"发信自动音量控制，对音频输入电平进行检测并反馈控制，以维持其在适当限度之内","C":"发信自动电平控制，对射频输出电平进行检测并反馈控制，以维持其在适当限度之内","D":"自动频率控制，对发射频率的漂移进行检测并反馈控制，以维持准确的工作频率","n":1,"img":""},{"i":"MC1-0622","p":"3.1.3","q":"使用射频/中频增益和音频增益分开控制的通信接收机进行收听时，可以这样设置：","a":"A","A":"信号特弱时尽量把射频/中频增益开到最大，信号特强时尽量把音频增益开到最大，然后从低到高调整另一个增益以得到适当的音量","B":"信号特弱时尽量把音频增益开到最大，信号特强时尽量把射频/中频增益开到最大，然后从低到高调整另一个增益以得到适当的音量","C":"任何情况下都应将射频/中频增益放在中间位置，然后从低到高调整音频增益以得到适当的音量","D":"任何情况下都应将音频增益放在中间位置，然后从低到高调整射频/中频增益以得到适当的音量","n":1,"img":""},{"i":"MC1-0623","p":"3.1.3","q":"HF 通信与 VHF 或 UHF 通信相比，最大的不同是什么？","a":"A","A":"HF 通信依靠电离层的反射","B":"HF 传播更为稳定，衰落小","C":"HF 天线体积小","D":"HF 更适合远距离宽带通信","n":1,"img":""},{"i":"MC1-0624","p":"3.1.3","q":"下面哪种方法可以减小话筒或耳机用音频电缆可能感生的射频电流？","a":"A","A":"在电缆外面穿套铁氧体磁环","B":"在电缆芯线中串联低通滤波器","C":"在电缆前端添置话筒放大器","D":"在电缆芯线中串联带通滤波器","n":1,"img":""},{"i":"MC1-0649","p":"3.3.1","q":"发射天线的作用是：","a":"A","A":"把发射机输出的射频信号转化为无线电波","B":"利用天线的增益放大发射机的输出功率","C":"将发射机输出的射频信号转化为音频信号","D":"将发射机输出的射频信号转化为红外线","n":1,"img":""},{"i":"MC1-0650","p":"3.3.1","q":"接收天线的作用是：","a":"A","A":"把空间的无线电波转化为接收机中的射频电信号","B":"利用天线的增益放大空间的无线电波并将之传向接收机","C":"将空间的无线电波转化为接收机中的音频信号","D":"将空间的无线电波转化为红外线","n":1,"img":""},{"i":"MC2-0651","p":"3.3.1","q":"关于天线的增益，以下说法正确的是：","a":"AB","A":"待测天线最大辐射方向上的辐射功率密度与基准天线对应值的比值","B":"与参考天线相比，被测天线在某个方向上使信号增强的程度","C":"天线辐射的电波功率与输入到天线的射频功率之比","D":"天线发热耗散的功率与输入到天线的射频功率之比","n":2,"img":""},{"i":"MC1-0652","p":"3.3.1","q":"以 dBi 为单位的天线增益是指：","a":"A","A":"待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的 dB 值","B":"待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的 dB 值","C":"待测天线最大辐射方向上的辐射功率密度与 1/4 波长地网天线对应值之比的 dB 值","D":"待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的 dB 值","n":1,"img":""},{"i":"MC1-0653","p":"3.3.1","q":"什么是“理想点源天线”？对业余无线电又有什么意义？","a":"A","A":"存在于理论中的一种小到一个点，可将发射机输出的全部射频能量都转化为各向同性且均匀辐射的电磁波的假想天线；用作比较实际天线辐射性能的一种全向基准天线","B":"一种用于专业通信的增益极高的专用天线，在业余无线电中没有应用价值","C":"仅用于无线电测试的一种标准接收天线，发射效果不佳，对业余无线电无用","D":"一种带宽近乎无限的高级天线的专利名称，业余无线电业务不需要宽带天线","n":1,"img":""},{"i":"MC1-0654","p":"3.3.1","q":"以 dBd 为单位的天线增益是指：","a":"A","A":"待测天线最大辐射方向上的辐射功率密度与半波长偶极天线对应值之比的 dB 值","B":"待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的 dB 值","C":"待测天线最大辐射方向上的辐射功率密度与 1/4 波长垂直天线对应值之比的 dB 值","D":"待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的 dB 值","n":1,"img":""},{"i":"MC1-0655","p":"3.3.1","q":"半波振子是能够辐射电波的一种实用天线。为了获得最低输入阻抗，人们通常从中点为这种振子馈电。这就构成了具有两个 1/4 波长不同电极性区域的谐振偶极天线，亦称半波长偶极天线。这种天线的增益规定为 0dBd。那么相比理想点源天线，其增益为：","a":"A","A":"2.15dBi","B":"6dBi","C":"3dBi","D":"1.64dBi","n":1,"img":""},{"i":"MC1-0656","p":"3.3.1","q":"某商品天线说明书给出的天线增益指标以 dB 为单位。其意义为：","a":"A","A":"该指标未指明计算方法和所用基准，缺乏参考价值","B":"待测天线最大辐射方向上的辐射功率密度与理想点源天线对应值之比的 dB 值","C":"待测天线最大辐射方向上的辐射功率密度与 1/4 波长垂直天线对应值之比的 dB 值","D":"待测天线最大辐射方向及其（180°）反方向的辐射功率密度测量值之比的 dB 值","n":1,"img":""},{"i":"MC1-0657","p":"3.3.1","q":"我们之所以称垂直接地天线为“全向天线”，是因为：","a":"A","A":"这种天线在水平方向上没有指向性","B":"这种天线在垂直方向上没有指向性","C":"这种天线的 E 面和 H 面方向图均为正圆","D":"这种天线辐射各向同性的球面波","n":1,"img":""},{"i":"MC1-0658","p":"3.3.1","q":"如需垂直接地天线在大体为零仰角的水平发射方向上具有主辐射瓣并可以与同轴电缆直接耦合，则振子长度应选为：","a":"A","A":"1/4 波长","B":"1/2 波长","C":"1/8 波长","D":"3/2 波长","n":1,"img":""},{"i":"MC2-0659","p":"3.3.1","q":"关于振子长度为 1/4 波长的垂直接地天线的最大辐射方向，以下描述正确的是：","a":"AB","A":"在水平方向上是全向的","B":"在垂直方向上有指向性，且辐射仰角稍大于 0°","C":"其 E 面方向图为“8”字形","D":"其 H 面方向图为“8”字形","n":2,"img":""},{"i":"MC2-0660","p":"3.3.1","q":"关于大多数手持电台随附的“橡胶天线”，以下说法正确的是：","a":"AB","A":"就电台的一般持握方式而言，电波的垂直极化分量要强一些","B":"相对于全尺寸天线，“橡胶天线”的发射与接收增益都低一些","C":"如果橡胶护套内的天线是螺旋加感的，则电波是旋转极化的","D":"如果橡胶护套某处开裂，则振子会迅速解体，天线随即报废","n":2,"img":""},{"i":"MC1-0661","p":"3.3.1","q":"在车内使用手持电台和俗称“橡胶天线”的柔性天线进行通信可能遇到什么问题？","a":"A","A":"车体的屏蔽作用影响信号强度","B":"大量电波反射回天线，抬升 SWR","C":"影响电台散热","D":"行车噪声影响通话质量","n":1,"img":""},{"i":"MC1-0662","p":"3.3.1","q":"如果架设天线时发现场地附近有电线等市电供电装置，你该怎么办？","a":"A","A":"应确保在风雨中意外掉落的天线部件不落入供电装置的安全距离内。例如，35 千伏及以下电压时至少 1 米","B":"应确保供电装置带来的电源噪声不会影响电台接收弱信号的能力。通常，这个距离应至少 10 倍于工作波长","C":"必须防止通信和供电两套系统之间发生打火拉弧事故。经验上讲，按照每千伏 1 毫米算出的间距是足够的","D":"应确保天线转动到平行于供电系统的电线时，电线不会成为反射单元，即，应至少保持1/4 波长以上距离","n":1,"img":""},{"i":"MC1-0663","p":"3.3.1","q":"垂直接地天线（GP）由电气长度为 1/4 波长的垂直振子加上一个“镜像地平面”构成，因十分简洁而被大量应用于手持和车载业余通信。但是，这种天线的工作有效性往往不如理论预计的那么完美，特别是在波长较长的波段。造成这种情况的原因及改善方法是：","a":"A","A":"缺乏有效接地镜像；GP 天线必须有足够大的导电平面以形成振子镜像，否则谐振频率和阻抗都与理论值有出入。为此，应尽量用大面积金属导体与天线/馈线的接地端相连","B":"1/4 波长垂直振子显然是太短了。改成 1/2 波长即可解决问题","C":"1/4 波长垂直振子显然是太短了。在振子当中串联加感线圈即可解决问题","D":"天线与电缆直接相连，匹配不佳。在天线和电缆之间加接“巴伦”即可解决问题","n":1,"img":""},{"i":"MC1-0664","p":"3.3.1","q":"关于天线的加载，以下描述正确的是","a":"A","A":"为天线振子串联电感线圈，延长振子的电气长度","B":"为车载天线增添弹簧减震器","C":"为柔性不足的天线基座增加螺旋式延长器","D":"为八木天线的拉纤加接弹性张力器","n":1,"img":""},{"i":"MC1-0665","p":"3.3.1","q":"谐振的垂直接地天线的振子长度最短也要 1/4 波长。如果架设天线时因条件受限而不得不将振子缩短，那么在振子之中串入电感可以补偿失去的感抗，使天线谐振在所需频率上。为了提高发射效率，应在振子的什么位置串入电感需根据架设条件择优确定。下图给出三种加感方案。假设振子（灰色部分）均等长，则 A、B、C 三种方案按发射效率可排列为：","a":"A","A":"C-顶部加感，B-中部加感，A-底部加感","B":"A-底部加感，B-中部加感，C-顶部加感","C":"A-底部加感，C-顶部加感，B-中部加感","D":"B-中部加感，A-底部加感，C-顶部加感","n":1,"img":"LK0944.jpg"},{"i":"MC1-0666","p":"3.3.1","q":"甲天线增益 6.15dBi，乙天线增益 1dBd。若两副天线按同样条件架设并用同样功率来驱动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：","a":"A","A":"甲天线的信号功率为乙天线的两倍","B":"甲天线的信号功率为乙天线的 1/2","C":"甲天线的信号功率为乙天线的 5.15 倍","D":"甲天线的信号功率为乙天线的 6.15 倍","n":1,"img":""},{"i":"MC1-0667","p":"3.3.1","q":"甲天线增益 0dBd，乙天线增益 2dBi。若两副天线按同样条件架设用用同样功率来驱动，则在它们最大发射方向的同一远方地点接收时，两天线给出的信号功率关系为：","a":"A","A":"甲天线的效果与半波长偶极天线相当，乙天线比甲天线略差","B":"甲天线效果为零，不能工作，乙天线效果比甲天线好 2 倍","C":"甲天线的效果与半波长偶极天线相当，乙天线发射的信号强度比甲天线好 2dB","D":"甲、乙天线的效果实际相同","n":1,"img":""},{"i":"MC1-0668","p":"3.3.1","q":"有两款 VHF 垂直全向天线作发射之用。甲天线增益为 4.5dBd，而乙天线的是 5.85dBi。它们在远处某接收天线中产生的信号功率有什么不同？","a":"A","A":"来自甲天线的信号比乙天线的强 0.8dB","B":"来自乙天线的信号比甲天线的强 1.35dB","C":"来自甲天线的信号比乙天线的强 1.35dB","D":"来自乙天线的信号比甲天线的强 3.5dB","n":1,"img":""},{"i":"MC1-0669","p":"3.3.1","q":"有两款 VHF 垂直全向天线作发射之用。甲天线增益为 2.9dBd，而乙天线的是 5.85dBi。它们在远处某接收天线中产生的信号功率有什么不同？","a":"A","A":"来自乙天线的信号比甲天线的强 0.8dB","B":"来自乙天线的信号比甲天线的强 2.95dB","C":"来自甲天线的信号比乙天线的强 2.95dB","D":"来自乙天线的信号比甲天线的强 7.1dB","n":1,"img":""},{"i":"MC3-0670","p":"3.3.2","q":"业余无线电爱好者讨论天线系统时常会提及术语 “驻波比（SWR）”。其含义为：","a":"ABC","A":"连接到传输线终端的负载阻抗与传输线自身的特性阻抗相匹配的程度","B":"负载与传输线完美匹配时，传输线之中没有驻波，因此驻波比为 1:1","C":"如果负载与传输线不匹配，传向负载的部分能量会沿传输线返回始端","D":"如果传输线中出现驻波，则调整传输线始端的信源阻抗可使驻波归零","n":3,"img":""},{"i":"MC1-0671","p":"3.3.2","q":"通联时，如果收发信机的 SWR 表显示读数 4:1，则意味着：","a":"A","A":"从发射机的输出端口来看，天线系统的整体匹配情况不佳","B":"从发射机的输出端口来看，天线系统的整体阻抗为 200 欧或 12.5 欧","C":"天线系统的辐射效率仅为 25%","D":"天线系统的整体增益仅为 4dB","n":1,"img":""},{"i":"MC2-0672","p":"3.3.2","q":"小强用长度不短于 1/4 波长的 50 欧馈线连接收发信机和天线。发信时，他发现 SWR 表的指示为 3:1。该值意味着：","a":"AB","A":"馈线中任意位置上的最大峰值电压与最小峰值电压之比为 3:1","B":"馈线中任意位置上的最大峰值电流与最小峰值电流之比为 3:1","C":"馈线中的驻波致使平均射频电压高于常值，这降低了导体损耗","D":"馈线中的驻波致使平均射频电流高于常值，这降低了介质损耗","n":2,"img":""},{"i":"MC1-0673","p":"3.3.2","q":"多数发射机都在 SWR 超过一定值时降低输出功率。这是为了：","a":"A","A":"保护发射机中的功率半导体器件","B":"防止烧断供电线路中的保险丝","C":"防止传输线上的驻波超过限值","D":"防止发射出去的无线电波带有过大的驻波","n":1,"img":""},{"i":"MC1-0674","p":"3.3.2","q":"用同轴电缆连接天线时，为什么驻波比趋于 1:1 为好？","a":"A","A":"降低电缆的损耗，使射频能量更有效地传输","B":"防止屏蔽层的外层辐射能量，导致射频干扰（RFI）","C":"延长天线的使用寿命","D":"延长发信机的使用寿命","n":1,"img":""},{"i":"MC1-0675","p":"3.3.2","q":"以下哪种情况可能导致业余发信机显示的驻波比不稳定？","a":"A","A":"发信机、馈线或天线某处接触不良","B":"发信机采用相位调制","C":"发信机过调制","D":"馈线温度过高","n":1,"img":""},{"i":"MC1-0676","p":"3.3.2","q":"SSB 通联时，即使天馈系统没有故障，有时候 SWR 显示也不稳定。这是因为：","a":"A","A":"SSB 话音的幅度变化本质上影响测量的稳定性。改用 CW 方式进行测量效果更好","B":"SSB 话音包含幅度与相位两种信息，并非所有天线均能同时给出稳定的响应","C":"出现这种情况是因为发信机过调制，应调整话筒增益以解决","D":"出现这种情况说明发信机出了故障，应停机检修","n":1,"img":""},{"i":"MC1-0677","p":"3.3.2","q":"我们都知道发射机与天线间的馈线应当与天线阻抗匹配。否则，馈线中的驻波会使沿线各处的电压和电流周期性起伏。然而，业余电台所用的发射机与电网中的发电机同属交流电源，我们却从未在连到电网的电线中观察到驻波现象。这是为什么？","a":"A","A":"电网供电的频率很低，导线长度与波长相比微不足道，驻波现象不明显而已","B":"业余电台所用的馈线和电网中的电线工作原理不同，所以现象不尽相同","C":"适用于供电技术和业余无线电的电学理论本质不同，所以现象自然不同","D":"电网的供电能力远超发射机所能提供的电功率，这就迫使线路各处电压趋同","n":1,"img":""},{"i":"MC1-0678","p":"3.3.3","q":"对于业余无线电通信，最适合的同轴电缆特性阻抗为：","a":"A","A":"50 欧姆","B":"75 欧姆","C":"93 欧姆","D":"300 欧姆","n":1,"img":""},{"i":"MC1-0679","p":"3.3.3","q":"传输线具有多种类型，但是为什么架设业余电台通常选用同轴电缆？","a":"A","A":"因为它易于使用，与架设环境之中其他物体间的互耦也很低","B":"因为它的损耗比其他任何种类的馈线都低","C":"因为相比其他馈线，它可以传输更大的功率","D":"因为很明显，它比其他任何馈线都便宜","n":1,"img":""},{"i":"MC2-0680","p":"3.3.3","q":"在为业余电台选购用作天线馈线的同轴电缆时应关注什么电气参数？","a":"AB","A":"特性阻抗","B":"指定频率下每百米的传输损耗","C":"芯线的截面积和最大额定电流","D":"电介质的耐压和最高允许温升","n":2,"img":""},{"i":"MC2-0681","p":"3.3.3","q":"我们都知道要为业余电台选配损耗较低的馈线。但是，馈线的损耗会导致什么问题？","a":"AB","A":"发信功率降低","B":"收信信噪比下降","C":"驻波比的测量值永远高于 1:1","D":"发出的信号失真","n":2,"img":""},{"i":"MC2-0682","p":"3.3.3","q":"受潮是同轴电缆失效损坏的主要原因。湿气渗透会导致：","a":"AB","A":"介质损耗变大","B":"屏蔽层或芯线氧化、锈蚀，甚至断路","C":"速度因子逐渐大于 1","D":"驻波比越来越小于 1","n":2,"img":""},{"i":"MC1-0683","p":"3.3.3","q":"将同轴电缆装于室外时，为什么要求电缆外皮（护套）能够耐受紫外线？","a":"A","A":"如果电缆护套被紫外线破坏，电缆就会受潮损坏","B":"紫外线会激励非线性导行模式，导致互调和谐波发射","C":"紫外线会与射频信号相互混频，导致相当复杂的宽带干扰","D":"紫外线会促使电缆升温，并因此增加电缆的功率损耗","n":1,"img":""},{"i":"MC1-0684","p":"3.3.3","q":"相比填充有机介质的同轴电缆，空气介质同轴电缆的劣势是什么？","a":"A","A":"空气介质同轴电缆需要特别措施来防止湿气渗透","B":"空气介质同轴电缆只能用于 30MHz 以下业余频段","C":"空气介质同轴电缆的每百米损耗太大","D":"空气介质同轴电缆不能在冰点以下工作","n":1,"img":""},{"i":"MC1-0685","p":"3.3.3","q":"如果通过同轴电缆的信号频率升高，则同轴电缆的","a":"A","A":"传输损耗增加","B":"反射功率升高","C":"特性阻抗变高","D":"输入驻波比变大","n":1,"img":""},{"i":"MC1-0686","p":"3.3.3","q":"以下给出了一些同等外径的馈线。其中哪一种在 VHF/UHF 频段损耗更低？","a":"A","A":"空气介质同轴硬电缆","B":"独立屏蔽分组双绞线","C":"50 欧姆同轴软电缆","D":"75 欧姆同轴软电缆","n":1,"img":""},{"i":"MC1-0687","p":"3.3.3","q":"对于 400MHz 或更高频率的信号，应当优先选用的同轴电缆连接器是：","a":"A","A":"N 型连接器","B":"M 型连接器","C":"RS-213 型连接器","D":"DB-23 型连接器","n":1,"img":""},{"i":"MC1-0688","p":"3.3.3","q":"关于 M 型同轴电缆连接器，以下说法正确的是：","a":"A","A":"这种连接器广泛应用于 HF 和 VHF 通信系统","B":"这种连接器使用了先进的螺纹式锁紧技术，防水防盗","C":"这种连接器使用了卡式锁紧技术，便于快拔快插","D":"这种连接器制造成本很高，通常用于微波通信系统","n":1,"img":""},{"i":"MC2-0689","p":"3.3.4","q":"关于垂直天线，以下说法正确的是：","a":"AB","A":"该天线发射垂直极化波，电场与地面垂直","B":"垂直天线是全向天线，其 H 面方向图是全向的","C":"该天线发射垂直极化波，磁场与地面垂直","D":"垂直天线是全向天线，其 E 面方向图是全向的","n":2,"img":""},{"i":"MC2-0690","p":"3.3.4","q":"关于水平极化偶极天线，以下描述正确的是：","a":"AB","A":"通过该天线发射的电磁波，电场平行于地面","B":"该天线水平面上的（E 面）方向图呈“8”字展开","C":"通过该天线发射的电磁波，电场垂直于地面","D":"该天线垂直面上的（H 面）方向图呈“8”字展开","n":2,"img":""},{"i":"MC1-0691","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，均使用 1/2 波长水平偶极天线进行 UHF 通联。现其中一方改用 1/2 波长垂直偶极天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变差","B":"通信效果不变","C":"通信效果变好","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0692","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用 1/2 波长水平和垂直偶极天线进行 UHF 通联。现双方都改用 1/2 波长垂直偶极天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0693","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用 1/2 波长水平和垂直偶极天线进行 UHF 通联。现双方都改用 1/2 波长水平偶极天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0694","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行 UHF通联。现双方都改用左旋圆极化天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0695","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行 UHF通联。现双方都改用右旋圆极化天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0696","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF 通联。现乙台改用半波长垂直极化天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果不变","B":"通信效果变差","C":"通信效果变好","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0697","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF 通联。现甲台改用右旋圆极化天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果不变","B":"通信效果变差","C":"通信效果变好","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0698","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF 通联。现乙台改用右旋圆极化天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变差","B":"通信效果变好","C":"通信效果不变","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0699","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和半波长水平偶极天线彼此对指进行UHF 通联。现乙台改用左旋圆极化天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变好","B":"通信效果变差","C":"通信效果不变","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0700","p":"3.3.4","q":"甲、乙业余电台相距 10 千米，分别使用左旋圆极化和右旋圆极化天线彼此对指进行 UHF通联。现双方均改用半波长水平偶极天线，则改变前后的通信效果有什么不同？","a":"A","A":"通信效果变好","B":"通信效果不变","C":"通信效果变差","D":"通信效果的变化不确定","n":1,"img":""},{"i":"MC1-0701","p":"3.3.4","q":"假设接收和发射天线均使用半波长偶极天线，则在地面台站间的近距离通联中，接收和发射天线的最佳极化方式应当安排为：","a":"A","A":"接收和发射天线均位于垂直于两台站连线的平面内，极化保持一致","B":"接收和发射天线均位于垂直于两台站连线的平面内，极化彼此正交","C":"接收和发射天线的极化应当平行于两台站之间的连线","D":"发射天线垂直极化，接收天线的极化应当平行于两台站之间的连线","n":1,"img":""},{"i":"MC1-0702","p":"3.3.4","q":"右旋极化波是指在垂直于传播方向的任意平面上，沿传播方向观察时，电场矢量为随时间向右（顺时针）旋转的椭圆或圆极化波。如果地面上某业余电台在观测业余卫星时发现从卫星到达该台的无线电波的电场是顺时针旋转的，则该信号的极化方式为：","a":"A","A":"左旋椭圆极化或圆极化","B":"右旋椭圆极化或圆极化","C":"垂直极化","D":"水平极化","n":1,"img":""},{"i":"MC1-0703","p":"3.3.4","q":"在视距通联中，已知发射天线为指向接收点的左旋圆极化天线，接收天线的最佳极化方式为：","a":"A","A":"指向发射点的左旋圆极化","B":"指向发射点的右旋圆极化","C":"垂直极化","D":"水平极化","n":1,"img":""},{"i":"MC1-0704","p":"3.3.4","q":"某卫星下行链路采用右旋圆极化天线，从北向南飞行，天线始终指向地球的南极。如果地面上某业余电台采用圆极化天线自动跟踪该卫星，则该台所用天线的最佳极化方式应当为：","a":"A","A":"卫星过顶前为右旋圆极化，过顶后为左旋圆极化","B":"卫星过顶后为右旋圆极化，过顶前为左旋圆极化","C":"最佳方向始终为右旋圆极化","D":"最佳方向始终为左旋圆极化","n":1,"img":""},{"i":"MC1-0705","p":"3.3.4","q":"已知某卫星下行信号的发射天线是指向地面的偶极天线。由于卫星不断旋转，地面台站所收电波的极化方向就会不断变化。为了不至极化问题致使接收中断，接收天线可以是：","a":"A","A":"指向卫星的右旋或左旋圆极化天线","B":"垂直极化天线","C":"水平极化天线","D":"极化方向平行于卫星与地面电台之间连线的天线","n":1,"img":""},{"i":"MC1-0706","p":"3.3.4","q":"某业余电台使用半波垂直偶极天线通联时，对方所收信号的强度为 S4。现发射功率不变，发信方改用增益为 8.15dBi 的八木天线（最大辐射方向和极化均不变），则对方所收信号的强度变为：【提示：收信机信号强度指示从 S1 至 S9 每档增加 6dB】","a":"A","A":"S5","B":"S6","C":"S7","D":"S8","n":1,"img":""},{"i":"MC1-0707","p":"3.3.4","q":"某业余电台使用半波长垂直偶极天线发射时，对方所收信号的强度为 S4。现发射功率不变，发信方改用增益为 12dBd 的八木天线（最大辐射方向和极化均不变）   ，则对方所收信号的强度变为：【提示：收信机信号强度指示从 S1 至 S9 每档增加 6dB】","a":"A","A":"S6","B":"S5","C":"S7","D":"S8","n":1,"img":""},{"i":"MC1-0708","p":"3.3.4","q":"两位业余爱好者使用半波长垂直偶极天线相互通联，双方所收信号的强度均为 S4。现双方发射功率不变，都改用增益为 8.15dBi 的八木天线（最大辐射方向和极化均不变）再次联络，则双方信号的强度变为：【提示：收信机信号强度指示 S1 至 S9 每档增加 6dB】","a":"A","A":"S6","B":"S4","C":"S5","D":"S7","n":1,"img":""},{"i":"MC1-0709","p":"3.3.5","q":"即便是在辽阔的平原或广袤的戈壁，我们所收本地 VHF/UHF 信号的强度也会伴随设备的移动而发生周期性的变化。主要原因是：","a":"A","A":"来自直射和地面反射等多个路径的无线电波相互干涉，相消或相长（多径效应）","B":"发信和收信地点间的气流导致电波传播路径弯曲，发生频率漂移（多普勒效应）","C":"无论收信发信，地面各处的电导率不尽相同会导致设备移动时的接地电阻变化","D":"发信过程中，设备与大地间分布电容的改变导致天线失谐，发射功率随之改变","n":1,"img":""},{"i":"MC1-0710","p":"3.3.5","q":"在 VHF/UHF 频段通联时的一个现象，如果远方电台给出的信号报告很差，则仅需移动几步或将工作频率改变数十千赫就可能显著改善通信效果。这是因为：","a":"A","A":"多径传播。经不同路径达到天线的电波存在相位和幅度差异，相互干涉，相消或相长","B":"发射机与接收机之间的距离，以及工作频率的变化都会显著改变路径损耗","C":"大气扰动影响","D":"地磁活动影响","n":1,"img":""},{"i":"MC1-0711","p":"3.3.5","q":"多径传播对 UHF 或 VHF 波段数据通信的影响是：","a":"A","A":"可能使误码率上升","B":"如果是 FM 通联，则影响微不足道，不可察觉","C":"随着传播路径的增加，数据通信速率线性减小","D":"随着传播路径的增加，数据通信速率线性增加","n":1,"img":""},{"i":"MC2-0712","p":"3.3.5","q":"使用 VSB 方式进行 ATV 通信时，即使信号相对较强，有时所收图像的边缘也有重影。这是因为：","a":"AB","A":"多径传播。来自不同路径的信号到达接收天线的时延不同，造成重影","B":"发射天线的 VSWR 过高。如果信号在馈线中多次往返于发射机和天线，会造成重影","C":"天线的极化配置出错。极化不同的信号同时到达天线，导致重影","D":"遭遇了重放干扰。或许是某中继台也转发了这个信号，其到达接收天线，导致重影","n":2,"img":""},{"i":"MC1-0713","p":"3.3.6","q":"决定超短波视距传播距离极限的主要因素是：","a":"A","A":"发射天线和接收天线距地面的相对高度","B":"发射天线和接收天线距海平面的绝对高度","C":"发射天线和接收天线的挂高波长比，即，离地高度除以波长","D":"发射天线和接收天线的增益","n":1,"img":""},{"i":"MC1-0714","p":"3.3.6","q":"有时，相隔数百千米的业余电台可以实现 VHF/UHF 超视距直接联络。可能的原因是：","a":"A","A":"信号的传播路径中出现了大气波导现象","B":"有飞行器在空中反射了电波","C":"降雨增加了大地电导率，增强了电波传播","D":"每当冬季，植被的减少都有利于电波传播","n":1,"img":""},{"i":"MC1-0715","p":"3.3.6","q":"有时，我们可以在 6 米或 2 米业余波段中收到上千千米外的“超视距传播”信号。这与下列哪种现象密切相关？","a":"A","A":"突发 E 层的传播","B":"流星余迹反向散射","C":"D 层的吸收所致","D":"灰线传播","n":1,"img":""},{"i":"MC1-0716","p":"3.3.6","q":"是什么导致了对流层的大气波导现象？","a":"A","A":"大气高空逆温","B":"太阳黑子和/或太阳耀斑","C":"飓风或龙卷风所致的上升气流","D":"雷暴时大量闪电所产生的等离子体","n":1,"img":""},{"i":"MC1-0717","p":"3.3.6","q":"如果你收到了一个上千千米外的 VHF 信号，最可能的原因是：","a":"A","A":"信号经电离层的突发 E 层反射而来","B":"信号由微波接力电台合力 QSP 过来","C":"信号被附近的雷雨区反射而来","D":"信号经宇宙射线的电离路径传导过来","n":1,"img":""},{"i":"MC1-0718","p":"3.3.6","q":"有时，VHF/UHF 业余波段中可能出现远达 500 千米的“超视距传播”信号。这与下列哪种现象密切相关？","a":"A","A":"对流层散射","B":"D 层折射","C":"F2 层折射","D":"法拉第旋转","n":1,"img":""},{"i":"MC1-0819","p":"3.6.1","q":"自制业余无线电发射设备，在经无线电检测机构检验合格并取得电台执照之前，应在调测时在设备的天线端口连接（或在串联必要的仪表之后连接）：","a":"A","A":"假负载","B":"VSWR 严格等于 1:1 的驻波天线","C":"VSWR 严格等于 1:1 的行波天线","D":"专门用于测试的标准环形天线","n":1,"img":""},{"i":"MC1-0820","p":"3.6.1","q":"在无线电发射机中，调制器的作用是：","a":"A","A":"以原始调制信号控制射频载波的幅度、频率和相位参数","B":"以电能转换效率最高的方式控制线性射频放大器的工作点","C":"调整天馈系统的参数，实现阻抗匹配","D":"自动控制发射信号的频谱，将其保持在核准的必要带宽内","n":1,"img":""},{"i":"MC4-0821","p":"3.6.1","q":"保证业余无线电通信接收机优良接收能力的主要因素是：","a":"ABCD","A":"良好的抗干扰能力","B":"足够高的整机增益","C":"尽量低的本机噪声","D":"尽量小的信号失真","n":4,"img":""},{"i":"MC1-0822","p":"3.6.1","q":"接收机解调器的作用是：","a":"A","A":"从接收到的已调射频信号中分离出原始调制信号","B":"对接收到的射频信号进行宽带线性放大","C":"对接收到的射频信号进行与必要带宽相匹配的选频放大","D":"从接收到的已调制射频信号中提取出载波分量","n":1,"img":""},{"i":"MC1-0823","p":"3.6.1","q":"选用解调器的主要应考因素是：","a":"A","A":"尽量忠实地还原原始调制信号","B":"尽量对已调射频信号加以放大","C":"尽量提升已调射频信号中的载频分量","D":"尽量补偿接所收射频信号的频率偏移","n":1,"img":""},{"i":"MC1-0824","p":"3.6.1","q":"亚音频静噪系统（CTCSS）所用的声调大体位于音频中的什么范围？","a":"A","A":"67-250.3Hz","B":"16Hz-20kHz","C":"16kHz-20kHz","D":"220Hz-2503Hz","n":1,"img":""},{"i":"MC1-0825","p":"3.6.1","q":"对于比较考究的接收机，其说明书中常常列出一项“通带矩形系数”或“通带形状系数”指标，是用来描述：","a":"A","A":"带通滤波器频率特性曲线两侧斜坡的陡峭程度","B":"矩形波信号通过滤波器后波形两侧的陡峭程度","C":"矩形波信号通过滤波器后谐波成分的损失程度","D":"带通晶体滤波器中石英晶体的切割方向和形状","n":1,"img":""},{"i":"MC1-0826","p":"3.6.1","q":"根据说明书给出的技术指标，两台业余无线电接收机在 USB 方式下选择带宽为 2.7kHz的滤波器时具有不同的“通带矩形系数”。接收机 A 的“60dB 带宽对 6dB 带宽的矩形系数”为 3.8，接收机 B 的为 5。由此可得出结论：","a":"A","A":"A 机对邻近频道干扰的抑制能力比 B 机强","B":"A 机对邻近频道干扰的抑制能力比 B 机差","C":"A 机对镜像频率干扰的抑制能力比 B 机强","D":"A 机对偏离工作频率±10kHz 以外的干扰信号的抑制能力比 B 机强","n":1,"img":""},{"i":"MC1-0827","p":"3.6.1","q":"接收机前置放大器的主要作用是：","a":"A","A":"降低接收机内部噪声的影响","B":"提高接收机最终的音频输出功率电平","C":"提高接收机音频输出的保真度","D":"提高接收机的动态范围","n":1,"img":""},{"i":"MC1-0828","p":"3.6.1","q":"进行 FM 话音通联时，我们能否单凭接收机中传出的对方的声音大小来准确判断对方的信号有多强？","a":"A","A":"不能。鉴频器所解调的声音，其大小仅取决于中频信号的频偏，与中频信号的幅度无关。况且，中频信号在进入鉴频器之前早已被限幅电路切齐，已无法鉴别强弱","B":"不能。信号越强，自动增益控制的起控程度就越深。增益的急剧下降反而会压低音量","C":"能。最终的信号就是经过放大处理的原始射频信号，当然是信号越强声音越大","D":"能。调频信号的特点是信号越强频偏越大，解调之后的声音当然也越大","n":1,"img":""},{"i":"MC1-0829","p":"3.6.1","q":"用设置在 NFM 方式的对讲机接收 WFM 信号，效果为：","a":"A","A":"可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真","B":"听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失","C":"可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音","D":"可以正常听到信号，只是声音比较小","n":1,"img":""},{"i":"MC1-0830","p":"3.6.1","q":"用设置在 WFM 方式的对讲机接收 NFM 信号，效果为：","a":"A","A":"可以正常听到信号，只是声音比较小","B":"可以听到信号。如果调制信号幅度较大或音调较高，会听到明显的非线性失真","C":"听不到信号。但是一旦接收到了信号，调频方式所特有的强烈噪声仍然会消失","D":"可以正常听到信号。但是声音的高音频部分衰减较大，缺乏高音","n":1,"img":""},{"i":"MC1-0831","p":"3.6.1","q":"没有信号时，调频接收机会输出一种强烈的沙沙声。关于这种噪声，以下描述正确的是：","a":"A","A":"天线收到的 QRN 与机内电路的固有噪声共同构成一种随机信号。该信号的随机相位变化经鉴频形成强烈的沙沙声。只是，该信号的随机幅度变化与沙沙声没有关系","B":"由天线收到的 QRN 的随机幅度变化经放大形成，其大小与 QRN 的电压成正比","C":"由天线收到的 QRN 的随机幅度变化经放大形成，其大小与 QRN 的电压的平方成正比","D":"由天线收到的 QRN 的随机幅度变化经放大形成，其大小与 QRN 的电压的平方根成正比","n":1,"img":""},{"i":"MC1-0832","p":"3.6.1","q":"下列哪种电路可以解调 FM 信号？","a":"A","A":"鉴频器","B":"限幅器","C":"乘积检波器","D":"混频器","n":1,"img":""},{"i":"MC1-0833","p":"3.6.1","q":"什么是“鉴频”？","a":"A","A":"对调频信号进行解调的过程称为鉴频","B":"判断信号的频率是否超过允许的频率范围的过程称为鉴频","C":"判断信号的频率是否发生了不应有的偏离或者漂移的过程称为鉴频","D":"对调幅信号进行解调的过程称为鉴频","n":1,"img":""},{"i":"MC1-0834","p":"3.6.1","q":"下列哪一项可以解调 AM 信号？","a":"A","A":"检波器","B":"限幅器","C":"鉴频器","D":"反相器","n":1,"img":""},{"i":"MC1-0835","p":"3.6.1","q":"什么是“检波”？","a":"A","A":"对调幅信号进行解调的过程称为检波","B":"检查信号的波形是否超过了允许的幅度范围的过程称为检波","C":"检查信号的频率是否发生了不应有的偏离或者漂移的过程称为检波","D":"对调频信号进行解调的过程称为检波","n":1,"img":""},{"i":"MC2-0836","p":"3.6.1","q":"关于收发信机的 AGC 功能，以下说法正确的有：","a":"AB","A":"AGC 实现收信机自动增益控制，对中频信号进行检测并反馈控制，防止电路过载","B":"进行基于 FSK 或 PSK 的数据通信时，关闭 AGC 功能有可能提高弱信号的解码效果","C":"进行太阳噪声测试的时候，需要关闭 AGC 功能","D":"AGC 实现收信机自动音量控制，对音频电平进行检测并反馈控制，防止扬声器损坏","n":2,"img":""},{"i":"MC1-0837","p":"3.6.1","q":"学习现代通信技术或制作业余无线电作品时，我们经常遇到一种工作原理不同于超外差式收信机的“DC 式收信机”。其中，缩写 DC 是指：","a":"A","A":"直接变换（Direct-Conversion），即接收到的射频信号在解调之前不做频率变换","B":"直流（Direct Current），指直流电源供电的收信机","C":"介质电容（Dielectric Capacitor），指收信机中用于调谐的电容器所用的特定介质","D":"数字变频（Digital-Conversion），指接收到的射频信号经过了数字化的变频处理","n":1,"img":""},{"i":"MC1-0838","p":"3.6.1","q":"接收机和发射机中常见的混频器有什么作用？","a":"A","A":"频率变换。将信号的原始频率变换成另一个频率","B":"混合式调音。将两个信号相互叠加，送往扬声器","C":"变频调速。把直流电变成变频交流电以驱动天调","D":"多频放大器。同时放大具有不同频率的多个信号","n":1,"img":""},{"i":"MC1-0839","p":"3.6.1","q":"在超外差式收发信机中，混频器的工作方式可分为“上变频”和“下变频”两种，具体指：","a":"A","A":"中频频率高于输入频率的 式","B":"接收机输入端无信号时，输出端的噪声功率电平的对数形式","C":"接收机输出端噪声功率电平与输入端噪声功率电平的比值的对数形式","D":"接收机输入端噪声功率电平与输出端噪声功率电平的比值的对数形式","n":1,"img":""},{"i":"MC1-0883","p":"3.6.3","q":"对于需要接收微弱信号的业余通信，例如 EME 通联，接收机的噪声指数 NF（以对数表示）是一项重要技术指标。关于 NF 的一些基本常识是：","a":"A","A":"NF 一定大于 0；在同样的灵敏度下，NF 越接近 0 越好","B":"NF 一定小于 0；在同样的灵敏度下，NF 越接近 0 越好","C":"NF 一定大于 1；在同样的灵敏度下，NF 越大越好","D":"NF 一定处于 0 和 1 之间；在同样的灵敏度下，NF 越接近 1 越好","n":1,"img":""},{"i":"MC1-0884","p":"3.6.3","q":"在无线电通信领域中，描述信号源、放大器或接收机等设备或系统组件的内部噪声大小时常用“噪声温度”指标。以接收机为例，等效噪声温度 Te 的意义是：","a":"A","A":"接收机的内部噪声功率等于一个接在天线输入端的优质匹配电阻在产生相同的热噪声功率时该电阻所具有的绝对温度","B":"接收机内部噪声在输出端的功率可以使一个接在输出端上的匹配电阻发热的相对温度","C":"接收机内部噪声在输出端的功率可以使一个接在输出端上的匹配电阻升温的绝对温度","D":"接收机信噪比符合技术指标时所要求的设备工作环境的温度","n":1,"img":""},{"i":"MC1-0885","p":"3.6.3","q":"不产生任何内部噪声的理想放大器或接收机的噪声系数 Fn、噪声指数 NF 和噪声温度 Te分别为：","a":"A","A":"1，0dB，0°K","B":"0，0dB，-273°K","C":"0，1dB，17°K","D":"0，0dB，-275°K","n":1,"img":""},{"i":"MC1-0886","p":"3.6.3","q":"假设一个用于卫星业余业务的天线放大器工作在标准温度（17℃）下，其输入端已连接良好匹配的天线。如果放大器所产生的内部噪声与输入的热噪声等效，则该放大器的噪声系数 Fn、噪声指数 NF 和噪声温度 Te 分别为：","a":"A","A":"2，3dB，290°K","B":"1，1dB，0°K","C":"2，0dB，17°K","D":"1，0dB，-273°K","n":1,"img":""},{"i":"MC1-0908","p":"3.8.1","q":"在业余无线电领域中，缩写 AMSAT 是指：","a":"A","A":"美国的业余无线电卫星公司，是一个专注于实验卫星的设计、制造、运行和推进空间教育的非营利性志愿者组织","B":"所有业余无线电卫星的总称","C":"某一系列业余无线电卫星的总称","D":"某一颗业余无线电卫星的名称","n":1,"img":""},{"i":"MC1-0909","p":"3.8.1","q":"在描述业余无线电卫星时经常用到缩写 OSCAR（奥斯卡），这个名称的由来是：","a":"A","A":"“搭载有业余无线电装置的地球轨道卫星”的英文缩写","B":"按照发明者奥斯卡的方案设计制造的业余卫星","C":"纪念业余无线电技术先驱者奥斯卡","D":"电影奥斯卡金奖的基金所赞助的业余卫星活动","n":1,"img":""},{"i":"MC1-0910","p":"3.8.1","q":"我国发射的第一颗业余卫星的发射年份、名称、国际 OSCAR 系列号和转发器模式分别为：","a":"A","A":"2009 年，希望一号（XW-1），HO68，V/U（J）","B":"2008 年，希望一号（XW-1），HO68，V/U（J）","C":"2010 年，希望一号（XW-1），HO68，V/U（J）","D":"2008 年，希望一号（XW-1），无 OSCAR 编号，B","n":1,"img":""},{"i":"MC1-0911","p":"3.8.1","q":"开展 EME 通信试验的最佳时机是：","a":"A","A":"月亮处于近地点","B":"满月","C":"通信两端天气都好","D":"太阳黑子数高","n":1,"img":""},{"i":"MC1-0912","p":"3.8.1","q":"在 EME 通信等需要接收极微弱信号的场合，安装前置放大器时应做到：","a":"A","A":"尽量安装在靠近天线的地方，信号特别微弱时对放大器进行冷却以降低热噪声","B":"尽量安装在靠近接收机的地方，放大器最好加热以防止元器件温度过低","C":"尽量安装在靠近接收机的地方，放大器尽量采用较高的电源电压以求更高的增益","D":"尽量安装在远离天线的地方，放大器采用射频正反馈电路以提高增益","n":1,"img":""},{"i":"MC1-0913","p":"3.8.1","q":"对于需要接收 VHF/UHF 微弱信号的通信场景，比如月面反射实验，爱好者们时常需要在所用八木天线的馈电端处就近加装低噪声前置放大器。相比之下，HF 通信爱好者却很少将他们所用的前置放大器装在八木天线或其他收信天线的馈电点处。这是因为：","a":"A","A":"VHF/UHF 频段的背景噪声较 HF 频段为低。将放大器置于接收天线处可降低传输线固有噪声的影响，提高收信信噪比。而对于 HF 频段，是否这样做，差别并不明显","B":"电缆的固有噪声在 VHF/UHF 频段更高","C":"HF 频段的放大器体积太大，不适合安装于天线端","D":"HF 频段的八木天线体积较大，把放大器装得太近容易引发自激","n":1,"img":""},{"i":"MC1-0914","p":"3.8.1","q":"下列哪个业余波段最适合流星余迹散射通信？","a":"A","A":"6 米","B":"10 米","C":"2 米","D":"70 厘米","n":1,"img":""},{"i":"MC1-0915","p":"3.8.1","q":"下列哪些通信方式可用于流星余迹和对流层散射通信实验？","a":"A","A":"FT4","B":"APRS","C":"QPSK31","D":"MT63","n":1,"img":""},{"i":"MC2-0916","p":"4.1.1","q":"导体是易于传导电流的物质或材料。以下关于导体的正确描述是：","a":"AB","A":"导体中存在大量的可自由移动的电子或离子，施加电压可产生电流","B":"多数金属都是导电性能优良的导体，比如银、铜和铝","C":"有些金属在高温下呈现零电阻特性，成为超导体","D":"某些金属具有压电效应，可用来制作电声元件","n":2,"img":""},{"i":"MC3-0917","p":"4.1.1","q":"关于导体，以下说法正确的是：","a":"ABC","A":"霓虹灯中电离发光的气体是导体","B":"酸、碱、盐的水溶液是导体","C":"石墨是导体","D":"云母是导体","n":3,"img":""},{"i":"MC4-0918","p":"4.1.1","q":"绝缘体是不易传导电流的物质或材料。以下关于绝缘体的正确描述是：","a":"ABCD","A":"分子中正负电荷紧密束缚，可自由移动的带电粒子极少，呈现很大的电阻","B":"绝缘体也称电介质。有些电介质可用来制作电容器，比如陶瓷和聚苯乙烯","C":"随着所加电场的增强，绝缘体会突然导电而成为导体。这种现象称为击穿","D":"随着温度的升高，绝缘体的绝缘程度下降。使用绝缘体应当关注工作温度","n":4,"img":""},{"i":"MC3-0919","p":"4.1.1","q":"以下哪些可以用作绝缘材料？","a":"ABC","A":"工程塑料","B":"酚醛树脂","C":"二氧化硅","D":"二氧化锡","n":3,"img":""},{"i":"MC3-0920","p":"4.1.1","q":"“击穿”是指施加于绝缘介质上的电压高于一定值时，部分介质突然变成导体，导致介质的电阻陡然下降的一种现象。以下哪些是对击穿现象的描述？","a":"ABC","A":"电路中的电容在工作电压显著超过标称耐压后变成导体，造成电路短路","B":"天线调谐器工作时，可变电容的极板间出现电弧，导致发射机告警保护","C":"验电笔中的氖灯发光","D":"台灯里的卤钨灯发光","n":3,"img":""},{"i":"MC1-0921","p":"4.1.1","q":"业余无线电设备中的射频部件积灰或受潮后，即使没有击穿或漏电，也可能因绝缘体的物理性质发生改变而意外产生：","a":"A","A":"介质损耗","B":"涡流损耗","C":"磁滞损耗","D":"磁阻损耗","n":1,"img":""},{"i":"MC4-0922","p":"4.1.1","q":"半导体是导电能力介于导体与绝缘体之间的一类物质或材料。对半导体的正确描述是：","a":"ABCD","A":"导电特性易于控制。例如，温度、光照或电场的少许变化可显著改变材料的导电性","B":"半导体可分为本征半导体和杂质半导体。后者又有 P 型和 N 型之分","C":"P 型和 N 型半导体的交界面称为 PN 结，具有内建电动势和单向导电性","D":"硅、锗等半导体材料可用来制作晶体管或集成电路","n":4,"img":""},{"i":"MC3-0923","p":"4.1.1","q":"下列哪些器件由半导体材料制成？","a":"ABC","A":"双极型三极管","B":"氮化镓三极管","C":"LDMOS 三极管","D":"电真空三极管","n":3,"img":""},{"i":"MC3-0924","p":"4.1.2","q":"静电放电是一种常见电磁现象，时刻伴随日常生活。但是，较强的静电放电却足以损坏电子设备甚至危及人身，需要预防。以下所述与静电有关的是：","a":"ABC","A":"刮风时，斜拉天线上出现的直流高压","B":"雷雨时，云层中积蓄的巨大能量","C":"收信时，接收机收到的各种 QRN","D":"发话时，电台馈送到天线的射频能量","n":3,"img":""},{"i":"MC2-0925","p":"4.1.2","q":"如果将导体置于静电场中，导体将呈现如下特点：","a":"AB","A":"静电平衡后，导体是等势体，内部场强为零，外表面出现电荷","B":"外表面曲率很小时，导体表面的电荷会高度聚集。这可能形成尖端放电","C":"静电平衡后，导体是等势体，内部电荷与外表面电荷极性相反","D":"外表面曲率很大时，导体表面的电荷会高度聚集。这可能形成尖端放电","n":2,"img":""},{"i":"MC2-0926","p":"4.1.2","q":"直流电（DC）是以电荷的运动方向始终不变来定义的。关于直流电，以下描述正确的是：","a":"AB","A":"直流电源的输出端有正负极之分","B":"电池提供的是直流电","C":"直流电压通常为 13.8 伏。这样的低压即使短路也没什么危害","D":"脉动直流电不含交流成分，因为电荷的运动方向始终不变","n":2,"img":""},{"i":"MC1-0927","p":"4.1.2","q":"交流电（AC）是以电荷的运动方向随时间交替变化来定义的。关于交流电，以下描述正确的是：","a":"A","A":"交流电源的输出端没有正负极之分，因为极性总在交替变化","B":"220V 市电是一种交流电。由于不需区分正负极，所以火线和零线可以混用","C":"交流电均为纯正弦波，仅包含单一频率成分","D":"业余电台所接收的信号不是交流电。那是复杂波形信号，也就是“复信号”","n":1,"img":""},{"i":"MC1-0928","p":"4.1.2","q":"以下哪一个术语可以用来描述交流电每秒改变极性的次数？","a":"A","A":"频率","B":"速率","C":"波长","D":"脉率","n":1,"img":""},{"i":"MC1-0929","p":"4.1.2","q":"业余无线电爱好者经常提及的“波长”与无线电波的频率有什么关系？","a":"A","A":"波长为光速与频率之比；频率越高，波长越短","B":"波长与真空有些关联，但是在现实生活中无用","C":"很明显，波长为频率的 1/4。这个常数应当牢记","D":"很明显，波长为频率的 4 倍。这个常数应当牢记","n":1,"img":""},{"i":"MC1-0930","p":"4.1.2","q":"物理量“电动势”描述的是：","a":"A","A":"电子器件或装置将某种形式的能量转化为电能的能力","B":"加在电路两端的电源驱动电子流动的力量大小","C":"单位时间内流过电路的电子数量","D":"电源所能供应的电子数量最大值","n":1,"img":""},{"i":"MC1-0931","p":"4.1.2","q":"物理量“电压”描述的是：","a":"A","A":"加在电路两端的电源驱动电子流动的力量大小","B":"电子器件或装置将其它形式的能量转化为电能的能力","C":"单位时间内流过电路的电子数量","D":"电源所能供应的电子数量最大值","n":1,"img":""},{"i":"MC1-0932","p":"4.1.2","q":"正弦交流电压或电流的峰值（peak value）是指：（“x＾m”表示“x 的 m 次方”）","a":"A","A":"从零点算起的最大值","B":"一个周期内瞬时值的平均值乘以 2＾(1/2)","C":"负半周最大幅度与正半周最大幅度的平均值","D":"负半周最大幅度与正半周最大幅度的差值的二次方","n":1,"img":""},{"i":"MC1-0933","p":"4.1.2","q":"正弦交流电压或电流的峰-峰值（peak-to-peak value）是指：","a":"A","A":"从负半周峰值到正半周峰值之间的差值","B":"从零点算起的最大值","C":"负半周最大幅度与正半周最大幅度的差值的二次方","D":"负半周最大幅度与正半周最大幅度的差值的平方根","n":1,"img":""},{"i":"MC1-0934","p":"4.1.2","q":"任意交流电压的有效值（RMS voltage）是指：（“x＾m”表示“x 的 m 次方”）","a":"A","A":"在同一电阻上可以转换出与该交流电压效果相同的热量的直流电压","B":"最终转换成在应用场景中真正发挥作用的有效能量的那部分电压值","C":"电压的平均值乘以 2＾(1/2)","D":"电压的峰值除以 2＾(1/2)","n":1,"img":""},{"i":"MC1-0935","p":"4.1.2","q":"物理量“电流”描述的是：","a":"A","A":"单位时间内流过电路的电子数量","B":"电源所能供应的电子数量最大值","C":"通电后流过电路的电子数量","D":"电子在导体中的运动速度","n":1,"img":""},{"i":"MC1-0936","p":"4.1.2","q":"物理量“电阻”描述的是：","a":"A","A":"电路从一点到另一点阻碍电流通过的能力大小","B":"电子克服电路阻力所需的能量大小","C":"电路阻碍电流通过所消耗的能量大小","D":"电路阻断电流所需的过渡时间","n":1,"img":""},{"i":"MC1-0937","p":"4.1.2","q":"物理量“功率”描述的是：","a":"A","A":"电流在单位时间内所做的功","B":"电子通过电路所获得的能量大小","C":"负载总共消耗的能量","D":"电源所能供应的电子数量最大值","n":1,"img":""},{"i":"MC2-0938","p":"4.1.2","q":"直流电路欧姆定律是说：","a":"AB","A":"流过电阻的电流 I 与电阻两端的电压 U 成正比，与阻值 R 成反比","B":"电阻两端的电压 U 与流过电阻的电流 I 成正比，与阻值 R 成正比","C":"流过电阻的电流 I 与电阻两端的电压 U 成正比，与阻值 R 成正比","D":"电阻两端的电压 U 与流过电阻的电流 I 成正比，与阻值 R 成反比","n":2,"img":""},{"i":"MC1-0939","p":"4.1.2","q":"在电路中不受电阻阻碍的电流，种类如下：","a":"A","A":"不存在","B":"射频电流","C":"音频电流","D":"直流电流","n":1,"img":""},{"i":"MC1-0940","p":"4.1.2","q":"术语“阻抗”描述的是：","a":"A","A":"电路从一点到另一点对交流电流阻碍作用的统称","B":"电路从一点到另一点阻断直流电流，通过交流电流的能力大小","C":"电路从一点到另一点阻断交流电流，通过直流电流的能力大小","D":"电路从一点到另一点阻断特定频率交流电流的能力大小","n":1,"img":""},{"i":"MC1-0941","p":"4.1.3","q":"电动势的单位是：","a":"A","A":"伏（特）","B":"安（培）","C":"瓦（特）","D":"欧（姆）","n":1,"img":""},{"i":"MC1-0942","p":"4.1.3","q":"电压的单位是：","a":"A","A":"伏（特）","B":"安（培）","C":"瓦（特）","D":"欧（姆）","n":1,"img":""},{"i":"MC1-0943","p":"4.1.3","q":"电流的单位是：","a":"A","A":"安（培）","B":"伏（特）","C":"瓦（特）","D":"欧（姆）","n":1,"img":""},{"i":"MC1-0944","p":"4.1.3","q":"电阻的单位是：","a":"A","A":"欧（姆）","B":"安（培）","C":"伏（特）","D":"瓦（特）","n":1,"img":""},{"i":"MC1-0945","p":"4.1.3","q":"阻抗的单位是：","a":"A","A":"欧（姆）","B":"安（培）","C":"伏（特）","D":"瓦（特）","n":1,"img":""},{
