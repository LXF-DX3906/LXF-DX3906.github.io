<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<title>业余无线电 A 类 · 学习与练习</title>
<style>
/* ============== Theme variables ============== */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-3: #e2e8f0;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-soft: #475569;
  --text-muted: #64748b;
  --primary: #0ea5e9;
  --primary-dark: #0284c7;
  --primary-soft: #e0f2fe;
  --accent: #6366f1;
  --success: #10b981;
  --success-soft: #d1fae5;
  --success-dark: #065f46;
  --error: #ef4444;
  --error-soft: #fee2e2;
  --error-dark: #991b1b;
  --warning: #f59e0b;
  --warning-soft: #fef3c7;
  --warning-dark: #92400e;
  --star: #f59e0b;
  --speed-bg-1: #fef9e7;
  --speed-bg-2: #fef3c7;
  --speed-text: #78350f;
  --code-bg: #f1f5f9;
  --code-text: #0284c7;
  --shadow-sm: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
  --shadow: 0 4px 12px rgba(15,23,42,0.08);
  --shadow-lg: 0 12px 32px rgba(15,23,42,0.16);
  --topbar-h: 56px;
  --sidebar-w: 280px;
  --radius: 12px;
  --radius-sm: 8px;
}

:root[data-theme="dark"] {
  --bg: #0b1220;
  --surface: #111827;
  --surface-2: #1f2937;
  --surface-3: #374151;
  --border: #1f2937;
  --border-strong: #374151;
  --text: #f1f5f9;
  --text-soft: #cbd5e1;
  --text-muted: #94a3b8;
  --primary: #38bdf8;
  --primary-dark: #0ea5e9;
  --primary-soft: rgba(56,189,248,0.16);
  --accent: #818cf8;
  --success: #34d399;
  --success-soft: rgba(52,211,153,0.18);
  --success-dark: #6ee7b7;
  --error: #f87171;
  --error-soft: rgba(248,113,113,0.18);
  --error-dark: #fca5a5;
  --warning: #fbbf24;
  --warning-soft: rgba(251,191,36,0.16);
  --warning-dark: #fcd34d;
  --star: #fbbf24;
  --speed-bg-1: rgba(251,191,36,0.10);
  --speed-bg-2: rgba(251,191,36,0.18);
  --speed-text: #fcd34d;
  --code-bg: #1f2937;
  --code-text: #7dd3fc;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.25s ease, color 0.25s ease;
}

button {
  font-family: inherit;
  cursor: pointer;
}

a { color: var(--primary-dark); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ============== Topbar ============== */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px; gap: 8px;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.brand {
  font-weight: 700; font-size: 1rem; flex: 1;
  min-width: 0;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand .subtitle {
  font-size: 0.75rem; color: var(--text-muted); font-weight: 400;
  display: none;
  -webkit-text-fill-color: var(--text-muted);
}
@media (min-width: 600px) {
  .brand .subtitle { display: inline; margin-left: 8px; }
}

.icon-btn {
  background: none; border: none;
  width: 40px; height: 40px;
  border-radius: 8px;
  font-size: 1.15rem;
  color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
  position: relative;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.has-count::after {
  content: attr(data-count);
  position: absolute;
  top: 2px; right: 2px;
  background: var(--primary);
  color: #fff;
  font-size: 0.6rem;
  min-width: 16px;
  height: 16px;
  border-radius: 10px;
  padding: 0 4px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700;
  line-height: 1;
}
.icon-btn[data-count="0"]::after, .icon-btn:not([data-count])::after { display: none; }

.action-btn {
  padding: 7px 12px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 500;
  transition: all 0.15s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.action-btn:hover {
  border-color: var(--primary);
  color: var(--primary-dark);
  background: var(--primary-soft);
}
.action-btn.primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 4px rgba(14,165,233,0.3);
}
.action-btn.primary:hover {
  filter: brightness(1.05);
  box-shadow: 0 4px 8px rgba(14,165,233,0.4);
  color: #fff;
}
.action-btn .count-badge {
  font-size: 0.7rem;
  background: rgba(255,255,255,0.4);
  color: inherit;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 700;
  line-height: 1.4;
}
.action-btn:not(.primary) .count-badge {
  background: var(--surface-2);
  color: var(--text-muted);
}

.topbar-actions { display: flex; gap: 6px; align-items: center; }
.menu-btn { display: none; }
@media (max-width: 980px) {
  .menu-btn { display: inline-flex; }
}
.desktop-only { display: none; }
@media (min-width: 760px) {
  .desktop-only { display: inline-flex; }
}
.mobile-only { display: none; }
@media (max-width: 759px) {
  .mobile-only { display: inline-flex; }
}

/* ============== App layout ============== */
.app {
  padding-top: var(--topbar-h);
  display: flex;
  min-height: 100vh;
}

/* ============== Sidebar ============== */
.sidebar {
  width: var(--sidebar-w);
  height: calc(100vh - var(--topbar-h));
  position: fixed;
  top: var(--topbar-h); left: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  z-index: 90;
  transition: transform 0.25s ease;
}
.sidebar-inner { padding: 16px 12px 80px; }
.sidebar .part-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 16px 12px 6px;
  margin-top: 8px;
  border-top: 1px solid var(--border);
}
.sidebar .part-label:first-child { border-top: none; margin-top: 0; padding-top: 4px; }
.sidebar button.nav-link {
  display: flex; align-items: center;
  width: 100%;
  padding: 8px 12px;
  margin: 1px 0;
  border-radius: 6px;
  color: var(--text-soft);
  font-size: 0.9rem;
  background: none; border: none;
  text-align: left;
  transition: all 0.12s;
  cursor: pointer;
  line-height: 1.35;
}
.sidebar button.nav-link:hover {
  background: var(--surface-2);
  color: var(--text);
}
.sidebar button.nav-link.active {
  background: var(--primary-soft);
  color: var(--primary-dark);
  font-weight: 600;
}
.sidebar .sec-num {
  display: inline-block;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  font-size: 0.78rem;
  margin-right: 8px;
  min-width: 22px;
  flex-shrink: 0;
}
.sidebar button.nav-link.active .sec-num { color: var(--primary-dark); }
.sidebar .nav-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sidebar .q-badge {
  margin-left: 6px;
  font-size: 0.68rem;
  background: var(--surface-2);
  color: var(--text-muted);
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 600;
  flex-shrink: 0;
}
.sidebar button.nav-link.active .q-badge { background: var(--primary); color: #fff; }

.sidebar-backdrop {
  position: fixed;
  inset: var(--topbar-h) 0 0 0;
  background: rgba(15,23,42,0.5);
  z-index: 89;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
@media (max-width: 980px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }
}

/* ============== Main ============== */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 24px;
  max-width: 100%;
}
.main-inner { max-width: 920px; margin: 0 auto; }
@media (max-width: 980px) {
  .main { margin-left: 0; padding: 16px; }
}

/* ============== Section card ============== */
.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  scroll-margin-top: 72px;
}
@media (max-width: 600px) {
  .section { padding: 20px 18px; border-radius: var(--radius-sm); }
}
.section h2 {
  margin: 0 0 18px;
  font-size: 1.55rem;
  font-weight: 700;
  display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
  line-height: 1.4;
}
.section h2 .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  color: #fff;
  border-radius: 10px;
  font-size: 1.05rem;
  font-weight: 800;
  flex-shrink: 0;
}
.chapter-tags {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;
}
.chapter-tag {
  font-size: 0.7rem;
  background: var(--surface-2);
  color: var(--text-muted);
  padding: 3px 9px;
  border-radius: 4px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.section .content { font-size: 1rem; }
.section .content > :first-child { margin-top: 0; }

/* ============== Markdown elements ============== */
.content h2 { font-size: 1.25rem; margin: 24px 0 12px; font-weight: 700; }
.content h3 { font-size: 1.1rem; margin: 22px 0 10px; font-weight: 600; color: var(--text-soft); }
.content h4 { font-size: 1rem; margin: 18px 0 8px; font-weight: 600; }
.content p { margin: 10px 0; }
.content strong { color: var(--text); font-weight: 700; }
.content em { font-style: italic; color: var(--text-soft); }
.content code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: ui-monospace, "SF Mono", Menlo, Monaco, "Courier New", monospace;
  font-size: 0.9em;
  color: var(--code-text);
}
.content ul, .content ol { padding-left: 1.5em; margin: 10px 0; }
.content ul ul, .content ol ol, .content ul ol, .content ol ul { margin: 4px 0; }
.content li { margin: 4px 0; }
.content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

.content table {
  border-collapse: collapse;
  width: 100%;
  margin: 14px 0;
  font-size: 0.9em;
  background: var(--surface);
  display: block;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.content table thead { background: var(--surface-2); }
.content table th, .content table td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
  vertical-align: top;
}
.content table th { font-weight: 600; color: var(--text); }

/* Speed-recall card (rendered from blockquote) */
.content blockquote {
  background: linear-gradient(135deg, var(--speed-bg-1) 0%, var(--speed-bg-2) 100%);
  border-left: 4px solid var(--warning);
  border-radius: 8px;
  padding: 14px 18px;
  margin: 16px 0;
  color: var(--speed-text);
}
.content blockquote > :first-child { margin-top: 0; }
.content blockquote > :last-child { margin-bottom: 0; }
.content blockquote strong { color: var(--speed-text); }
.content blockquote ul, .content blockquote ol { padding-left: 1.4em; }
.content blockquote li { margin: 3px 0; }
.content blockquote table { background: rgba(255,255,255,0.5); }
:root[data-theme="dark"] .content blockquote table { background: rgba(0,0,0,0.25); }
:root[data-theme="dark"] .content blockquote code { background: rgba(255,255,255,0.08); color: var(--warning); }

/* Search highlight */
mark.search-hit {
  background: var(--warning-soft);
  color: var(--text);
  padding: 0 2px;
  border-radius: 3px;
  border-bottom: 1px solid var(--warning);
}

/* ============== Practice button ============== */
.practice-zone {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.practice-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  border: none;
  padding: 12px 22px;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  box-shadow: 0 2px 4px rgba(14,165,233,0.3);
  transition: all 0.15s;
}
.practice-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(14,165,233,0.4);
  filter: brightness(1.05);
}
.practice-btn:active { transform: translateY(0); }
.practice-btn:disabled {
  background: var(--surface-2);
  color: var(--text-muted);
  cursor: not-allowed;
  box-shadow: none;
}
.practice-progress {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.practice-progress .correct-count { color: var(--success); font-weight: 600; }
.practice-progress .wrong-count { color: var(--error); font-weight: 600; }

/* ============== Practice modal ============== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.6);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.18s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-backdrop[hidden] { display: none; }

.practice-modal {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 720px;
  width: 100%;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.22s;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

@media (max-width: 600px) {
  .modal-backdrop { padding: 0; align-items: stretch; }
  .practice-modal { max-height: 100vh; height: 100vh; border-radius: 0; }
}

.practice-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.practice-header .info-block { flex: 1; min-width: 0; }
.practice-header .title-line {
  font-size: 0.95rem; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.practice-header .sub-line {
  font-size: 0.8rem; color: var(--text-muted);
  margin-top: 2px;
}
.practice-header .star-btn,
.practice-header .close-btn {
  flex-shrink: 0;
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--surface-2);
  border: none;
  font-size: 1.15rem;
  color: var(--text-soft);
  transition: all 0.15s;
}
.practice-header .star-btn:hover { background: var(--warning-soft); color: var(--star); }
.practice-header .star-btn.fav { color: var(--star); background: var(--warning-soft); }
.practice-header .star-btn.fav { animation: starPop 0.3s; }
@keyframes starPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.practice-header .close-btn { font-size: 1.4rem; }
.practice-header .close-btn:hover { background: var(--error-soft); color: var(--error); }

.progress-bar {
  height: 4px;
  background: var(--border);
  position: relative;
  flex-shrink: 0;
}
.progress-bar .fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  transition: width 0.3s ease;
}

.practice-body {
  padding: 22px 24px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}
@media (max-width: 600px) { .practice-body { padding: 18px 16px; } }

.q-meta {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 12px;
  align-items: center;
}
.q-meta .tag {
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 500;
  background: var(--surface-2);
  color: var(--text-muted);
}
.q-meta .tag.mc {
  background: var(--primary-soft);
  color: var(--primary-dark);
}
.q-meta .tag.mc.multi {
  background: rgba(168, 85, 247, 0.15);
  color: #a855f7;
}

.q-body {
  font-size: 1.05rem;
  font-weight: 500;
  line-height: 1.65;
  margin: 8px 0 18px;
  color: var(--text);
  white-space: pre-wrap;
  word-wrap: break-word;
}
.q-img-notice {
  font-size: 0.85rem;
  color: var(--warning-dark);
  background: var(--warning-soft);
  border: 1px solid var(--warning);
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 12px;
}

.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
  -webkit-user-select: none;
}
.option:hover { border-color: var(--primary); background: var(--primary-soft); }
.option.selected {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.option-letter {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--text-soft);
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 0.9rem;
}
.option.selected .option-letter {
  background: var(--primary);
  color: #fff;
}
.option-text {
  flex: 1;
  word-wrap: break-word;
  font-size: 0.95rem;
  line-height: 1.6;
}

.option.correct {
  border-color: var(--success);
  background: var(--success-soft);
}
.option.correct .option-letter { background: var(--success); color: #fff; }
.option.incorrect-selected {
  border-color: var(--error);
  background: var(--error-soft);
}
.option.incorrect-selected .option-letter { background: var(--error); color: #fff; }
.option.submitted { cursor: default; }

.feedback {
  margin-top: 18px;
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 0.92rem;
  display: flex; align-items: flex-start; gap: 12px;
  line-height: 1.6;
}
.feedback.correct { background: var(--success-soft); color: var(--success-dark); }
.feedback.wrong { background: var(--error-soft); color: var(--error-dark); }
.feedback .ic { font-size: 1.2rem; flex-shrink: 0; line-height: 1.4; }
.feedback strong { font-weight: 700; }
.feedback .jump-link {
  display: inline-block;
  margin-top: 6px;
  font-size: 0.85rem;
  text-decoration: underline;
  cursor: pointer;
  color: inherit;
}

.practice-footer {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center;
  flex-shrink: 0;
  background: var(--surface);
}
@media (max-width: 600px) { .practice-footer { padding: 12px 14px; } }
.practice-footer .spacer { flex: 1; }
.practice-footer button {
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  transition: all 0.15s;
}
.practice-footer button:hover:not(:disabled) {
  border-color: var(--primary);
  color: var(--primary-dark);
}
.practice-footer button.primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);

const SECTIONS = [{"id":1,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"顶层法规架构","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：四份法规对应四个机构 / 文件层次。</li><li><strong>必背</strong>：①《条例》= 国务院+中央军委；②《管理办法》= 工信部，2024-3-1 起施行；③业余术语定义 = 《频率划分规定》；④频谱国家所有 = 《民法典》第 252 条。</li><li><strong>易错</strong>：业余术语定义<strong>不在</strong>《条例》里！频谱权属<strong>不在</strong>《宪法》《刑法》！</li></ul></blockquote>\n<p>[Qs: 1, 2, 3, 4, 5, 21, 22, 146, 147, 168]</p>\n<table><thead><tr><th>文件 / 机构</th><th>一句话定位</th></tr></thead><tbody><tr><td><strong>《中华人民共和国无线电管理条例》</strong></td><td>我国<strong>专门针对无线电管理</strong>的<strong>行政法规</strong>，由<strong>国务院和中央军委</strong>共同制定</td></tr><tr><td><strong>《业余无线电台管理办法》</strong></td><td>专门针对<strong>业余电台</strong>的部门规章，由<strong>工业和信息化部</strong>制定，<strong>新版自 2024-3-1 起施行</strong>，2012 年版（22 号令）同时废止</td></tr><tr><td><strong>《中华人民共和国无线电频率划分规定》</strong></td><td>业余业务、卫星业余业务、业余电台等术语在此被<strong>具体定义</strong></td></tr><tr><td><strong>国家无线电管理机构 + 省/自治区/直辖市无线电管理机构</strong></td><td>依法对业余电台实施<strong>监督管理</strong></td></tr><tr><td><strong>国际电信联盟 ITU</strong></td><td>协调<strong>国际</strong>无线电管理；发布《无线电规则》</td></tr><tr><td><strong>国际业余无线电联盟 IARU</strong></td><td>将业余无线电视为一种\"<strong>国家资源</strong>\"</td></tr><tr><td><strong>《刑法》</strong></td><td>擅自设台、擅用频率、干扰严重的，处 3 年以下；特别严重 3–7 年</td></tr><tr><td><strong>《民法典》第 252 条</strong></td><td>\"无线电频谱资源属于国家所有\"</td></tr><tr><td><strong>《治安管理处罚法》</strong></td><td>干扰拒不消除：5–10 日拘留；情节严重 10–15 日</td></tr><tr><td><strong>《网络安全法》</strong></td><td>个人/组织使用网络应遵守宪法法律、公共秩序、社会公德；<strong>不得</strong>危害网络安全、危害国家安全/荣誉/利益、编造传播虚假信息、侵害他人合法权益</td></tr><tr><td><strong>《国家安全法》</strong></td><td>国家安全工作\"四大支柱\"：<strong>以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事/文化/社会安全为保障</strong>，以促进国际安全为依托</td></tr></tbody></table>\n<p><strong>公民/组织应履行的国家安全义务</strong>（《国家安全法》明文规定）：</p>\n<ul><li>遵守宪法、法律法规关于国家安全的有关规定；</li><li>及时报告危害国家安全活动的线索；</li><li>如实提供所知悉的涉及危害国家安全活动的证据；</li><li>为国家安全工作提供便利条件或者其他协助。</li></ul>\n<p><strong>例题</strong>（MC1-0003）：我国依法负责对业余电台实施监督管理的机构是： <strong>答案 A — 国家无线电管理机构和省、自治区、直辖市无线电管理机构</strong>。</p>\n<p><strong>例题</strong>（MC1-0172）：《国家安全法》中提到，国家安全工作应当坚持总体国家安全观，以人民安全为(),以政治安全为(),以经济安全为(),以军事、文化、社会安全为()： <strong>答案 A — 宗旨、根本、基础、保障</strong>。</p>\n<hr>","chapters":["1.1.1","1.6.3"],"qIds":["MC2-0001","MC2-0002","MC1-0003","MC1-0004","MC1-0005","MC4-0171","MC1-0172","MC4-0173"],"qCount":8},{"id":2,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"关键术语（近义词区分）","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：很多术语听着像，定义完全不同。</li><li><strong>必背</strong>：①<strong>划分给业务、分配给部门、指配给电台</strong>；②<strong>辐射含闪电、发射只指无线电发信机</strong>；③<strong>单边带是调幅特例（不是调频！）</strong>；④<strong>电信不含邮政</strong>；⑤<strong>地面通信不含天波</strong>；⑥<strong>无线电波 = 3000 GHz 以下</strong>。</li><li><strong>易错</strong>：选项常把三个动词打乱顺序——<strong>看题干主语</strong>：业务→划分，部门→分配，电台→指配。</li></ul></blockquote>\n<p>[Qs: 6–11, 16–20, 23–26]</p>\n<table><thead><tr><th>术语</th><th>一句话区分</th></tr></thead><tbody><tr><td><strong>划分</strong>（Allocation）</td><td>把<strong>频段</strong>列入划分表，给<strong>业务</strong>用</td></tr><tr><td><strong>分配</strong>（Allotment）</td><td>把频率/频道给<strong>部门</strong>在<strong>指定区域</strong>内用</td></tr><tr><td><strong>指配</strong>（Assignment）</td><td>把频率批准给<strong>电台</strong>使用</td></tr><tr><td><strong>辐射</strong>（Radiation）</td><td>任何源的能量以电波形式向外发出（<strong>闪电</strong>也是）</td></tr><tr><td><strong>发射</strong>（Emission）</td><td>由<strong>无线电发信电台</strong>产生的辐射或辐射产物（闪电<strong>不是</strong>）</td></tr><tr><td><strong>干扰</strong></td><td>无用能量使接收性能下降，且若无该能量后果可避免</td></tr><tr><td><strong>有害干扰</strong></td><td>危害<strong>导航/安全</strong>业务，或严重损害正常无线电通信</td></tr><tr><td><strong>业余业务</strong></td><td>爱好者自我训练、相互通信、技术研究</td></tr><tr><td><strong>卫星业余业务</strong></td><td>利用地球卫星上的空间电台开展与业余业务相同目的的业务</td></tr><tr><td><strong>业余电台</strong></td><td>一个或多个发信机/收信机或其组合，<strong>可有多台设备</strong></td></tr><tr><td><strong>单边带发射</strong></td><td>只传一个边带的<strong>调幅</strong>发射（不传载波）</td></tr><tr><td><strong>次要业务台站</strong></td><td>①不得干扰主要业务；②不能要求主要业务的保护</td></tr><tr><td><strong>无线电波</strong></td><td>频率 <strong>3,000 GHz 以下</strong>在空间传播的电磁波</td></tr><tr><td><strong>电信</strong></td><td>含有线、无线电、光通信；<strong>邮政不属于</strong></td></tr><tr><td><strong>地面无线电通信</strong></td><td>含航空、水上；<strong>天波通信不属于</strong></td></tr><tr><td><strong>无线电测定/导航/定位/测向</strong></td><td>测定=用电波特性定位测速；导航=用于导航的测定；定位=除导航外的测定；测向=确定方向</td></tr></tbody></table>\n<p><strong>例题</strong>（MC1-0007）：将无线电频率或频道规定由一个或多个部门，在指定的区域内供业务在指定条件下使用，称为：<strong>答案 A — 分配</strong>。</p>\n<hr>","chapters":["1.1.2"],"qIds":["MC1-0006","MC1-0007","MC1-0008","MC1-0009","MC1-0010","MC1-0011","MC4-0012","MC1-0013","MC1-0014","MC2-0015","MC1-0016","MC1-0017","MC3-0018","MC2-0019","MC3-0020","MC1-0021","MC1-0022","MC1-0023","MC1-0024","MC1-0025","MC1-0026"],"qCount":21},{"id":3,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"设台条件、申请与执照","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：申请材料、有效期、续期、注销时限。</li><li><strong>必背</strong>：①执照有效期 <strong>≤ 5 年</strong>；②续期 <strong>届满前 30 个工作日</strong>；③注销后 <strong>60 个工作日</strong>内拆天线；④紧急临时设台 <strong>48 小时</strong>内报告；⑤<strong>15 W 以上短波</strong> = 国家无管局许可；⑥多台设备 = 一个电台一个呼号但<strong>全部设备</strong>载入执照；⑦技术检测<strong>不收费</strong>、验证<strong>不收费</strong>。</li><li><strong>易错</strong>：①续期是 30 <strong>工作日</strong>不是月；②拆天线是 60 <strong>工作日</strong>不是 6 个月；③有固定台址 → 所在地省级；无固定台址 → 住所地省级。</li></ul></blockquote>\n<p>[Qs: 27–44, 105, 107, 111]</p>\n<p><strong>个人申请须提交</strong>：①申请表；②身份证明复印件（未成年人需监护人证明 + 关系说明）；③设备相关说明材料。</p>\n<p><strong>单位申请须提交</strong>：①申请表；②设备说明材料；③营业执照等复印件 + 技术负责人为本单位员工的说明。</p>\n<p><strong>设备合规</strong>：商品须<strong>型号核准</strong>且核准证含业余频段；自制改装拼装须符合国家标准 + 频率<strong>仅限</strong>业余频段；15 W 以上短波由<strong>国家无管局</strong>许可，可委托省级现场核查。</p>\n<p><strong>执照载明</strong>：设置人 + 操作类别 + 编号；呼号、台址、频率、功率；执照编号、颁发日期、有效期、发证机关；中继/信标台还要载明工作模式。<strong>纸质、电子同等效力</strong>；样式由<strong>国家无管局</strong>统一规定。</p>\n<p><strong>年龄</strong>：①持证操作<strong>不受年龄限制</strong>；②<strong>未成年人也可申请</strong>设置具有发信功能的电台。</p>\n<p><strong>例题</strong>（MC1-0033）：业余电台执照的有效期不超过：<strong>答案 A — 5 年</strong>。</p>\n<hr>","chapters":["1.2.1","1.2.2","1.5.1"],"qIds":["MC3-0027","MC3-0028","MC4-0029","MC1-0030","MC2-0031","MC4-0032","MC1-0033","MC3-0034","MC2-0035","MC1-0036","MC1-0037","MC1-0038","MC1-0039","MC3-0040","MC1-0041","MC1-0042","MC1-0043","MC2-0044","MC1-0107","MC2-0111"],"qCount":20},{"id":4,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"操作技术能力 A / B / C 类（背熟此表！）","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：A 类只 V/UHF；B/C 类都可全频段，差别在 HF 功率。</li><li><strong>必背</strong>：<strong>A=25/无 HF；B=25/&lt;15；C=25/≤1000</strong>。门槛 <strong>B 需 6 个月，C 需 18 个月</strong>。</li><li><strong>易错</strong>：①<strong>A 类没有 HF！</strong>；②B 类 HF 是 <strong>\"小于\" 15 W</strong>（不是\"≤\"）；③C 类 HF 是 1000 W 不是 100 W；④A 类不能临时超限操作（B/C 才可经批准超限）。</li></ul></blockquote>\n<p>[Qs: 52–71, 142]</p>\n<table><thead><tr><th>类别</th><th>允许频段</th><th>最大功率 (HF / 30 MHz 以上)</th><th>申请门槛</th></tr></thead><tbody><tr><td><strong>A 类</strong></td><td><strong>30–3000 MHz</strong>（V/UHF）</td><td><strong>≤25 W</strong></td><td>熟悉法规 + 一定操作能力</td></tr><tr><td><strong>B 类</strong></td><td>30 MHz 以下 + 以上均可</td><td><strong>&lt;15 W (HF) / ≤25 W (V/UHF)</strong></td><td>取得执照 ≥ <strong>6 个月</strong> + 实操</td></tr><tr><td><strong>C 类</strong></td><td>30 MHz 以下 + 以上均可</td><td><strong>≤1000 W (HF) / ≤25 W (V/UHF)</strong></td><td>持 30 MHz 以下频段执照 ≥ <strong>18 个月</strong> + 实操</td></tr></tbody></table>\n<p><strong>B 类还可</strong>：&lt; 1 W (<strong>e.i.r.p.</strong> = <strong>e</strong>ffective <strong>i</strong>sotropic <strong>r</strong>adiated <strong>p</strong>ower 等效全向辐射功率) LF 频段。<strong>旧 B 类证书过渡</strong>：HF ≤ 100 W、V/UHF ≤ 25 W。</p>\n<p><strong>例题</strong>（MC1-0061）：取得 C 类验证证书：<strong>答案 A — 30 MHz 以下 ≤ 1000 W，或 30 MHz 以上 ≤ 25 W</strong>。</p>\n<hr>","chapters":["1.3.1","1.3.2"],"qIds":["MC1-0052","MC1-0053","MC1-0054","MC1-0055","MC3-0056","MC3-0057","MC2-0058","MC1-0059","MC1-0060","MC1-0061","MC2-0062","MC2-0063","MC2-0064","MC2-0065","MC4-0066","MC4-0067","MC2-0068","MC2-0069","MC4-0070","MC2-0071"],"qCount":20},{"id":5,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"呼号系统","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：<strong>前缀 B / 种类字母 / 分区号 / 后缀</strong>。</li><li><strong>必背</strong>：种类字母顺序 \"<strong>G H I D A B C E F K L</strong>\"；<strong>J=空间</strong>；<strong>R=中继/信标</strong>；分区号见下表。</li><li><strong>易错</strong>：①\"H1XYZ\" \"1XYZ\" <strong>都不是合法呼号</strong>；②每次建立、结束必报呼号，<strong>通信中≤10 分钟一次</strong>；③呼号注销 <strong>1 年后</strong>才可重分配；④对自己呼号<strong>不满意不能换</strong>。</li></ul></blockquote>\n<p>[Qs: 72–100]</p>\n<p><strong>结构</strong>（四部分）：</p>\n<ol><li><strong>前缀</strong>（1 位字母）= ITU 分配给中国的 <strong>B</strong>；</li><li><strong>电台种类</strong>（1 位字母）：<strong>GHIDABCEFKL</strong> = 一般；<strong>J</strong> = 空间；<strong>R</strong> = 中继/信标；<strong>STYZ 等</strong> = 国家保留；</li><li><strong>分区号</strong>（1 位数字，空间台 = 1）；</li><li><strong>后缀</strong>（1–4 位字母或字母数字）— 1 位、4 位以及带数字后缀由国家保留；<strong>QOA–QUZ、SOS、XXX、TTT</strong> 不可用。</li></ol>\n<p><strong>分区表</strong>（必背！）：</p>\n<table><thead><tr><th>分区</th><th>省/自治区/直辖市</th></tr></thead><tbody><tr><td><strong>1</strong></td><td><strong>北京</strong></td></tr><tr><td>2</td><td>黑龙江、吉林、辽宁</td></tr><tr><td>3</td><td>天津、内蒙古、河北、山西</td></tr><tr><td>4</td><td>上海、山东、江苏</td></tr><tr><td>5</td><td>浙江、江西、福建</td></tr><tr><td>6</td><td>安徽、河南、湖北</td></tr><tr><td>7</td><td>湖南、广东、广西、海南</td></tr><tr><td>8</td><td>四川、重庆、贵州、云南</td></tr><tr><td>9</td><td>陕西、甘肃、宁夏、青海</td></tr><tr><td><strong>0</strong></td><td><strong>新疆、西藏</strong></td></tr></tbody></table>\n<p><strong>使用规则</strong>：</p>\n<ul><li>建立 + 结束<strong>必须报完整呼号</strong>；通信中<strong>≤10 分钟</strong>一次；</li><li><strong>不能</strong>用姓名、自编代号、地区码+后缀替代完整呼号；</li><li>在他人电台操作：用所操作电台呼号 <strong>或</strong> 操作员本人呼号；</li><li>临时使用其他呼号：仅限比赛/重大活动，<strong>经国家无管局批准</strong>；</li><li>已有呼号 → 再设新台 → <strong>不再核发新呼号</strong>；</li><li>呼号注销 1 年后才可重分配（中继/信标除外）；</li><li>各地呼号资源由<strong>国家无管局</strong>统一编制分配；省级按 <strong>G→L</strong> 顺序、双字母→三字母编制；<strong>前缀都相同（B）</strong>，<strong>分区号各不相同</strong>。</li></ul>\n<hr>","chapters":["1.4.1","1.4.2"],"qIds":["MC3-0072","MC1-0073","MC1-0074","MC2-0075","MC1-0076","MC2-0077","MC3-0078","MC4-0079","MC2-0080","MC4-0081","MC3-0082","MC3-0083","MC3-0084","MC1-0085","MC1-0086","MC3-0087","MC4-0088","MC1-0089","MC1-0090","MC1-0091","MC3-0092","MC4-0093","MC3-0094","MC3-0095","MC3-0096","MC4-0097","MC4-0098","MC4-0099","MC2-0100"],"qCount":29},{"id":6,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"业余电台用途与禁令","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：<strong>法定用途 = 相互通信、技术研究、自我训练</strong>。其他都是违法。</li><li><strong>必背</strong>：①只能与<strong>业余电台</strong>通信，唯一例外是<strong>突发重大灾害</strong>应急；②不能转发广播/电话/互联网/录音；③不能转达他人信息；④不能<strong>接收</strong>非业余信号（民航/铁路/海事都不行，<strong>ISS 业余台可以听</strong>）；⑤不能商业谋利；⑥<strong>未成年人 / 未持证人</strong>可在持证人监督下实习。</li><li><strong>易错</strong>：①出租车业余电台传客户信息=违法（谋利）；②日常应急训练<strong>不能</strong>与非业余电台通信；③紧急情况临时设台 48 小时内必须报告。</li></ul></blockquote>\n<p>[Qs: 106, 113–138, 174, 175]</p>\n<p><strong>法定用途</strong>：<strong>相互通信、技术研究、自我训练</strong>。</p>\n<p><strong>禁止行为</strong>：转发广播/电话/互联网/录音、为他人转达信息、未经批准广播或通播、自创暗语、接收/传播非业余信号、商业谋利、压制他台、向境外提供电波资料、擅编呼号、涂改倒卖出借执照、自行刷固件改频…… 详见原 [Qs: 131–137]。</p>\n<p><strong>通信语言</strong>：明语 + 业余公认缩略语 + 公开协议。</p>\n<p><strong>与非业余通信唯一合法</strong>：<strong>突发重大自然灾害</strong>等紧急情况，内容限于抢险救灾或应急救援部门交办的任务。</p>\n<p><strong>实习规则</strong>（<strong>未取得执照或操作能力</strong>的人在他人电台上发射操作）：</p>\n<ol><li>必须由<strong>设置/使用人或技术负责人</strong>现场监督指导；</li><li>频率/功率应当在 <strong>B 类操作技术能力验证证书确定的范围内</strong>（即 HF&lt;15 W、V/UHF≤25 W）；</li><li>频率/功率<strong>不得超过现场监督指导人员</strong>取得的能力验证证书范围；</li><li>两条限制<strong>同时生效</strong>——实际使用以<strong>较低者</strong>为准。</li></ol>\n<p><strong>紧急临时设台</strong>：<strong>48 小时内</strong>报告 + 紧急消除后<strong>及时关闭</strong>。</p>\n<p><strong>例题</strong>（MC1-0129）：业余电台可用于的用途：<strong>答案 A — 相互通信、技术研究和自我训练</strong>。</p>\n<hr>","chapters":["1.5.1","1.5.2","1.5.3"],"qIds":["MC1-0105","MC1-0106","MC1-0112","MC1-0113","MC1-0114","MC1-0115","MC1-0116","MC1-0117","MC1-0118","MC3-0119","MC1-0120","MC1-0121","MC1-0122","MC1-0123","MC1-0124","MC1-0125","MC1-0126","MC1-0127","MC1-0128","MC1-0129","MC1-0130","MC4-0131","MC4-0132","MC3-0133","MC3-0134","MC4-0135","MC4-0136","MC4-0137","MC3-0138","MC1-0139","MC1-0140","MC1-0141","MC4-0142"],"qCount":33},{"id":7,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"监督管理与处罚","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：罚款金额跟\"危害等级\"挂钩。</li><li><strong>必背</strong>：①擅设擅用 = ≤5 万，拒改 5–20 万；②<strong>干扰人身安全频率（船舶/航空/铁路）= 20–50 万（顶格）</strong>；③干扰一般业务 = ≤3 万 / 严重 3–10 万 / 干扰 + 拒改 = 5–20 万 + <strong>吊销执照</strong>；④诈骗等违法 = 20–50 万；⑤刑法干扰严重 = 3 年以下，特别严重 3–7 年。</li><li><strong>易错</strong>：①违反治安管理 = 公安处罚（<strong>不是</strong>无管局）；②无线电管制全国/跨省 = <strong>国务院+中央军委</strong>；省内 = 省政府+军区。</li></ul></blockquote>\n<p>[Qs: 143–170, 213]</p>\n<p>详细罚款表参见原版 § 7（保留），重点记 <strong>20–50 万</strong> = 涉及人身安全频率。</p>\n<hr>","chapters":["1.6.1","1.6.2"],"qIds":["MC1-0143","MC4-0144","MC4-0145","MC1-0146","MC1-0147","MC1-0148","MC1-0149","MC1-0150","MC2-0151","MC2-0152","MC3-0153","MC2-0154","MC2-0155","MC1-0156","MC2-0157","MC2-0158","MC2-0159","MC1-0160","MC1-0161","MC2-0162","MC2-0163","MC2-0164","MC2-0165","MC2-0166","MC2-0167","MC1-0168","MC2-0169","MC1-0170"],"qCount":28},{"id":8,"part":1,"partName":"法规与管理体系","partOrd":"一","title":"频率划分（**A 类核心高频考点**）","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：俗称波段 ↔ 频率范围 ↔ 业务状态。</li><li><strong>必背</strong>：①<strong>HF 专用：7、14、21、28 MHz + 47 GHz</strong>；②<strong>VHF/UHF 主要业务：50、144</strong>；③<strong>70 cm（430–440）业余为次要</strong>，主要业务=<strong>无线电定位 + 航空导航</strong>；④2 m 唯一主要 = <strong>144–146</strong>；⑤最低 LF = <strong>135.7–137.8 kHz</strong>；⑥最高 = <strong>241–250 GHz</strong>（EHF）；⑦<strong>业余频率免许可、免费、平等使用</strong>。</li><li><strong>易错</strong>：①<strong>40 m USB? NO! 40 m 用 LSB</strong>（7 MHz &lt; 10.1 MHz）；②V/UHF SSB 都用 USB；③次要业务\"可要求保护不受同/其他次要业务干扰\"——主语注意！</li></ul></blockquote>\n<p>[Qs: 174–230]</p>\n<h3>8.1 频段分类速查</h3>\n<table><thead><tr><th>类别</th><th>频段</th></tr></thead><tbody><tr><td><strong>专用</strong></td><td>7 / 14 / 21 / 28 MHz + 47 GHz</td></tr><tr><td><strong>30 MHz 以下共用，主要业务</strong></td><td>1.8 / 3.5 / 14.25 / 18.068 / 24.89 MHz</td></tr><tr><td><strong>1200 MHz 以下共用，次要业务</strong></td><td>135.7 kHz / 5351.5 kHz / 10.1 MHz / 430 MHz</td></tr><tr><td><strong>V/UHF 共用，主要业务</strong></td><td><strong>50、144 MHz</strong></td></tr><tr><td><strong>2 m 唯一主要业务</strong></td><td>144–146 MHz</td></tr><tr><td><strong>WARC-76 新增</strong></td><td>10.1–10.15 / 18.068–18.168 / 24.89–24.99 MHz</td></tr><tr><td><strong>IARU 信标</strong>（避免 ±500 Hz 内发射）</td><td>14.100 / 18.110 / 21.150 / 24.930 / 28.200 MHz</td></tr></tbody></table>\n<h3>8.2 俗称波段对照</h3>\n<table><thead><tr><th>俗称</th><th>频率范围</th><th>业务状态</th></tr></thead><tbody><tr><td>160 m</td><td><strong>1800–2000 kHz</strong></td><td>主要</td></tr><tr><td>80 m</td><td><strong>3.5–3.9 MHz</strong></td><td>主要</td></tr><tr><td>40 m（ITU3 区）</td><td><strong>7.0–7.2 MHz</strong></td><td>专用</td></tr><tr><td>30 m</td><td>10.1–10.15 MHz</td><td>次要</td></tr><tr><td>20 m</td><td>14–14.25 专用 / 14.25–14.35 主要</td><td>共用</td></tr><tr><td>17 m</td><td>18.068–18.168 MHz</td><td>—</td></tr><tr><td>15 m</td><td><strong>21–21.45 MHz</strong></td><td>专用</td></tr><tr><td>12 m</td><td>24.89–24.99 MHz</td><td>—</td></tr><tr><td>10 m</td><td><strong>28–29.7 MHz</strong></td><td>专用</td></tr><tr><td>6 m</td><td><strong>50–54 MHz</strong></td><td>主要</td></tr><tr><td>2 m</td><td><strong>144–148 MHz</strong>（144–146 唯一主要 / 146–148 共主要）</td><td>—</td></tr><tr><td>70 cm</td><td><strong>430–440 MHz</strong></td><td><strong>次要</strong>（主：无线电定位+航空导航）</td></tr></tbody></table>\n<h3>8.3 实际工作子频段（HF 供 B/C 类参考）</h3>\n<table><thead><tr><th>频段</th><th>实际可用</th></tr></thead><tbody><tr><td>7 MHz <strong>LSB</strong></td><td>7.030–7.200 MHz</td></tr><tr><td>14 MHz USB</td><td>14.100–14.350 MHz</td></tr><tr><td>18 MHz USB</td><td>18.1105–18.168 MHz</td></tr><tr><td>21 MHz USB</td><td>21.125–21.45（除 21.1495–21.1505）MHz</td></tr><tr><td>24 MHz USB</td><td>24.9305–24.99 MHz</td></tr><tr><td>29 MHz USB</td><td>28.3–29.3 MHz</td></tr><tr><td>29 MHz FM</td><td>29.51–29.7 MHz</td></tr><tr><td><strong>144 MHz 本地应避免</strong></td><td>144–144.035 + 145.8–146 MHz</td></tr><tr><td><strong>430 MHz 本地应避免</strong></td><td>431.9–432.240 + 435–438 MHz</td></tr></tbody></table>\n<h3>8.4 卫星专用段（不可话音占用）</h3>\n<ul><li>10 m: <strong>29.3–29.51 MHz</strong></li><li>2 m: <strong>145.8–146 MHz</strong></li><li>70 cm: <strong>435–438 MHz</strong></li></ul>\n<h3>8.5 边界与频谱规则</h3>\n<ul><li>实际发信频率必须 <strong>≥ F1 + 下边带宽度</strong>；<strong>≤ F2 − 上边带宽度</strong>；</li><li><strong>10.1 MHz 以下 LSB；以上 USB</strong>；<strong>V/UHF SSB = USB</strong>；</li><li><strong>业余频率免许可、免费</strong>；</li><li><strong>平等使用权</strong>——俱乐部\"专用频率\"无法律意义；</li><li><strong>次要业务</strong>：不得对主要业务产生有害干扰，也不能要求来自主要业务的保护；</li><li><strong>ITU 禁止阻尼波</strong>；</li><li><strong>频率单位识别</strong>：135.7 kHz=LF/长波；1.8 MHz=MF/中波；28 MHz=HF/短波；50 MHz=VHF/米波；2.3 GHz=UHF/分米波；5.65 GHz、10 GHz=SHF/厘米波；241 GHz=EHF/毫米波。</li></ul>\n<p><strong>例题</strong>（MC1-0193）：2 米业余波段：<strong>答案 A — 144–148 MHz；其中 144–146 MHz 为唯一主要业务</strong>。</p>\n<hr>","chapters":["1.7.1","1.7.2"],"qIds":["MC1-0174","MC1-0175","MC1-0176","MC1-0177","MC1-0178","MC1-0179","MC1-0180","MC1-0181","MC1-0182","MC1-0183","MC1-0184","MC1-0185","MC1-0186","MC1-0187","MC1-0188","MC1-0189","MC1-0190","MC1-0191","MC1-0192","MC1-0193","MC1-0194","MC1-0195","MC1-0196","MC1-0197","MC1-0198","MC1-0199","MC1-0200","MC1-0201","MC1-0202","MC1-0203","MC1-0204","MC1-0205","MC1-0206","MC1-0207","MC1-0208","MC1-0209","MC1-0210","MC1-0211","MC1-0212","MC4-0213","MC2-0214","MC1-0215","MC1-0216","MC1-0217","MC1-0218","MC1-0219","MC1-0220","MC1-0221","MC1-0222","MC1-0223","MC1-0224","MC1-0225","MC1-0226","MC1-0227","MC1-0228","MC1-0229","MC1-0230","MC1-0231"],"qCount":58},{"id":9,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"ITU 三区","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：全球 3 区，中国在 3 区，由 ITU《无线电规则》制定。</li><li><strong>必背</strong>：①一区=欧洲+俄罗斯亚洲部分+蒙古；二区=南北美洲；三区=亚洲+大洋洲；②3 区 40 m = 7.0–7.2 MHz。</li><li><strong>易错</strong>：制定者是 <strong>ITU</strong> 不是 IARU 也不是 ARRL。</li></ul></blockquote>\n<p>[Qs: 232–242]</p>\n<hr>","chapters":["2.1.1","2.1.2"],"qIds":["MC1-0232","MC1-0233","MC1-0234","MC1-0235","MC1-0236","MC1-0237","MC1-0238","MC1-0239","MC1-0240","MC1-0241","MC1-0242"],"qCount":11},{"id":10,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"ITU 语音字母表","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：呼号必须用 ITU 字母表拼读。</li><li><strong>必背</strong>：A=Alfa B=Bravo C=Charlie D=Delta E=Echo F=Foxtrot G=Golf H=Hotel I=India J=<strong>Juliett</strong> K=Kilo L=Lima M=Mike N=November O=Oscar P=Papa Q=Quebec R=Romeo S=Sierra T=Tango U=Uniform V=Victor W=Whiskey X=Xray Y=Yankee Z=Zulu。<code>/</code> = <strong>Portable</strong>。</li><li><strong>易错</strong>：J 是 <strong>Juliett</strong>（双 t）；X 是 <strong>Xray</strong> 没有连字符。</li></ul></blockquote>\n<p>[Qs: 246–254]</p>\n<p><strong>例题</strong>（MC1-0247）：BH1XYZ 拼读为 <strong>Bravo Hotel One Xray Yankee Zulu</strong>。</p>\n<hr>","chapters":["2.1.5"],"qIds":["MC1-0246","MC1-0247","MC1-0248","MC1-0249","MC1-0250","MC1-0251","MC1-0252","MC1-0253","MC1-0254"],"qCount":9},{"id":11,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"CQ 呼叫与对话流程","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：先守听 → 再问\"是否占用\" → 再呼。</li><li><strong>必背</strong>：①<strong>回答 CQ：先呼对方再呼自己</strong>；②建立通信后首先交换<strong>信号报告</strong>；③结束当天 = <strong>QRT</strong>；④告别 = <strong>73</strong>；⑤听到<strong>遇险</strong>电台 → 先确认险情、联系应急（<strong>不要变频、不要停发</strong>）。</li><li><strong>易错</strong>：①顺序错=丢分（先报自己呼号是错的）；②与几十千米外大量交流 → 用电话/互联网，不要占用业余频率；③CQ = 普遍呼叫<strong>任何</strong>国内外业余电台。</li></ul></blockquote>\n<p>[Qs: 259–273, 306–315]</p>\n<p>标准模板：</p>\n<ul><li>发起：<code>CQ CQ CQ, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu, BH1ZZZ calling CQ and standing by</code></li><li>应答：<code>BH1ZZZ, this is BH8YYY, Bravo Hotel Eight Yankee Yankee Yankee, BH8YYY calling you and standing by</code></li><li>信号报告：<code>BH1ZZZ, you are 57, QSL?</code></li><li>地点：<code>My QTH is Chengdu</code></li><li>插入：先 break → 得回应后说\"请求插入\"</li></ul>\n<p><strong>例题</strong>（MC1-0263）：建立通信后首先交换：<strong>答案 A — 信号报告</strong>。</p>\n<hr>","chapters":["2.2.1","2.2.2","2.3.1"],"qIds":["MC1-0259","MC1-0260","MC1-0261","MC1-0262","MC1-0267","MC1-0268","MC1-0269","MC1-0270","MC1-0271","MC1-0272","MC1-0273","MC1-0306","MC1-0307","MC1-0308","MC1-0309","MC1-0310","MC1-0311","MC1-0312","MC1-0313","MC1-0314","MC1-0315"],"qCount":21},{"id":12,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"RST 信号报告","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：<strong>R</strong>eadability（1–5）+ <strong>S</strong>trength（1–9）+ <strong>T</strong>one（1–9，仅 CW）。</li><li><strong>必背</strong>：①<strong>S 表每档 6 dB</strong>；②V/UHF S1 = –141 dBm；HF S1 = –121 dBm（HF 背景噪声更高，相差 20 dB）；③<strong>73</strong> = 友谊告别（<strong>不是 73's</strong>）。</li><li><strong>易错</strong>：不要盲填 599/59 — S 强度应取自实际 S 表读数。</li></ul></blockquote>\n<p>[Qs: 265, 266, 374]</p>\n<p><strong>例</strong>：CW 易辨 + S5 + 通报顺畅 → <strong>559</strong>；FM 易辨 + S5 → <strong>55</strong>。</p>\n<hr>","chapters":["2.2.1"],"qIds":["MC1-0263","MC1-0264","MC1-0265","MC1-0266"],"qCount":4},{"id":13,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"Q 简语 & 业余缩语（**A 类高频考点**）","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：QR开头≈关于\"我方\"操作；QS开头≈关于\"通信\"。</li><li><strong>必背</strong>：</li><li><strong>QRO 增功率 / QRP 减功率（≤5 W） / QRQ 加速 / QRS 减速 / QRT 关机 / QRU 无消息 / QRV 准备好 / QRZ 谁在叫我？</strong></li><li><strong>QSB 衰落 / QSL 收妥确认 / QSO 联络 / QSP 转信 / QSX 守听 / QSY 改频 / QTH 位置 / QTR 时间</strong></li><li><strong>缩语</strong>：CQ 普遍呼叫 / DE 来自 / DX 远距离 / FB 太棒了 / ES 和 / TNX 谢 / TU 谢你 / OM 老朋友 / YL 女士 / XYL 妻子 / SRI 抱歉 / PSE 请 / NW 现在 / AGN 再来 / R Roger 收到 / 73 告别 / GA 下午好 / GE 晚上好 / GM 早晨好 / GN 晚安 / GL 祝好运 / <strong>K 任意电台讲 / KN 仅对方讲</strong></li><li><strong>天线缩写</strong>：DP=偶极 / GP=垂直接地 / VER=垂直 / LW=长线 / YAGI=八木 / BEAM=定向</li><li><strong>易错</strong>：①QRP 是 ≤ 5 W 小功率操作（不是减速）；②QRZ 是\"谁在叫我\"（不是\"再见\"）；③K 是邀请任意电台 / KN 是仅对方电台。</li></ul></blockquote>\n<p>[Qs: 343–423]</p>\n<blockquote><p>💡 <strong>Q 简语来源</strong>：1909 年由英国发明，是 ITU 标准化的<strong>三字母程序信号</strong>。每个码可作陈述句（\"我…\"）或疑问句（加 \"?\"）。\"Q\" 是固定首字母，后两位字母无实际单词起源——靠<strong>含义记忆</strong>。</p></blockquote>\n<h3>Q 简语完整表</h3>\n<table><thead><tr><th>Q 码</th><th>中文含义</th><th>助记</th></tr></thead><tbody><tr><td><strong>QRA</strong></td><td>我电台的名称是… / 你电台的名称是？</td><td>Address</td></tr><tr><td><strong>QRB</strong></td><td>你我之间距离</td><td>distance Between</td></tr><tr><td><strong>QRD</strong></td><td>你目的地是… / 你去哪里？</td><td>Destination</td></tr><tr><td><strong>QRH</strong></td><td>你的频率正在变化</td><td>varies</td></tr><tr><td><strong>QRK</strong></td><td>信号可辨度（RST 中的 R）</td><td>readability</td></tr><tr><td><strong>QRL</strong></td><td>我在忙 / 频率被占用</td><td>busy</td></tr><tr><td><strong>QRM</strong></td><td>人为干扰（其他电台）</td><td><strong>M</strong>an-made</td></tr><tr><td><strong>QRN</strong></td><td>天电/自然噪声</td><td><strong>N</strong>atural/Noise</td></tr><tr><td><strong>QRO</strong></td><td>增大发射功率</td><td><strong>O</strong>utput up</td></tr><tr><td><strong>QRP</strong></td><td>减小功率（≤5 W 操作）</td><td><strong>P</strong>ower down</td></tr><tr><td><strong>QRQ</strong></td><td>加快发报速度</td><td><strong>Q</strong>uickly</td></tr><tr><td><strong>QRS</strong></td><td>放慢发报速度</td><td><strong>S</strong>lowly</td></tr><tr><td><strong>QRT</strong></td><td>停止发射，关机</td><td><strong>T</strong>erminate</td></tr><tr><td><strong>QRU</strong></td><td>没有消息要发送</td><td>nothing for <strong>U</strong></td></tr><tr><td><strong>QRV</strong></td><td>我准备好收信</td><td>ready (服<strong>V</strong>ice)</td></tr><tr><td><strong>QRZ</strong></td><td>谁在呼叫我？</td><td>who's call<strong>Z</strong>?</td></tr><tr><td><strong>QSA</strong></td><td>信号强度（5 等级旧法）</td><td><strong>S</strong>trength</td></tr><tr><td><strong>QSB</strong></td><td>信号衰落</td><td>fa<strong>B</strong>ing</td></tr><tr><td><strong>QSD</strong></td><td>键控缺陷</td><td><strong>D</strong>efective keying</td></tr><tr><td><strong>QSK</strong></td><td>发报间隙可听到插入</td><td>brea<strong>K</strong>-in</td></tr><tr><td><strong>QSL</strong></td><td>确认收妥消息 / QSL 卡</td><td><strong>L</strong>ogged</td></tr><tr><td><strong>QSO</strong></td><td>双方联络</td><td>c<strong>O</strong>nversation</td></tr><tr><td><strong>QSP</strong></td><td>我可帮你转信</td><td><strong>P</strong>ass on / relay</td></tr><tr><td><strong>QSX</strong></td><td>我正在守听…</td><td>listening</td></tr><tr><td><strong>QSY</strong></td><td>我要改变发射频率</td><td>s<strong>Y</strong>witch</td></tr><tr><td><strong>QTH</strong></td><td>我的位置是…</td><td><strong>H</strong>ome</td></tr><tr><td><strong>QTR</strong></td><td>时间是…</td><td><strong>T</strong>ime</td></tr></tbody></table>\n<h3>业余通信缩语完整表（<strong>英文原文助记</strong>）</h3>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文含义</th></tr></thead><tbody><tr><td><strong>73</strong></td><td>\"best regards\"（电报码源自 1859 年 Western Union 数字代码）</td><td>告别问候</td></tr><tr><td><strong>88</strong></td><td>\"love and kisses\"</td><td>爱意问候</td></tr><tr><td><strong>AGN</strong></td><td><strong>AG</strong>ai<strong>N</strong></td><td>再来一次</td></tr><tr><td><strong>AHR</strong></td><td>a<strong>N</strong>ot<strong>HER</strong></td><td>另一个</td></tr><tr><td><strong>ANT</strong></td><td><strong>ANT</strong>enna</td><td>天线</td></tr><tr><td><strong>ARDF</strong></td><td><strong>A</strong>mateur <strong>R</strong>adio <strong>D</strong>irection <strong>F</strong>inding</td><td>业余无线电测向</td></tr><tr><td><strong>ATU</strong></td><td><strong>A</strong>ntenna <strong>T</strong>uning <strong>U</strong>nit</td><td>天线调谐器</td></tr><tr><td><strong>BOX</strong></td><td>post office <strong>BOX</strong></td><td>邮政信箱</td></tr><tr><td><strong>BURO</strong></td><td>QSL <strong>Bur</strong>eau</td><td>QSL 卡片管理局</td></tr><tr><td><strong>CK</strong></td><td><strong>C</strong>hec<strong>K</strong></td><td>检查</td></tr><tr><td><strong>CQ</strong></td><td>\"<strong>S</strong>ee<strong>K</strong> you\"（谐音）</td><td>普遍呼叫任何电台</td></tr><tr><td><strong>CU AGN</strong></td><td><strong>C</strong>ee <strong>U</strong> <strong>AG</strong>ai<strong>N</strong></td><td>再会</td></tr><tr><td><strong>DE</strong></td><td>法语 \"de\" = \"from\"</td><td>来自（…呼叫…）</td></tr><tr><td><strong>DR</strong></td><td><strong>D</strong>ea<strong>R</strong></td><td>亲爱的</td></tr><tr><td><strong>DSW</strong></td><td>俄语 \"<strong>D</strong>o <strong>S</strong>vidaniya\"</td><td>(俄语) 再见</td></tr><tr><td><strong>DX</strong></td><td><strong>D</strong>istance / <strong>D</strong>istant station</td><td>远距离 / DX 电台</td></tr><tr><td><strong>ES</strong></td><td>摩斯电码 ·-··· 在英语口语中读 \"ES\"，表示 \"and\"</td><td>和</td></tr><tr><td><strong>FB</strong></td><td><strong>F</strong>ine <strong>B</strong>usiness</td><td>太棒了 / 业务精湛</td></tr><tr><td><strong>FER</strong></td><td><strong>FOR</strong>（音变拼写）</td><td>为了 / 对于</td></tr><tr><td><strong>FREQ</strong></td><td><strong>FREQ</strong>uency</td><td>频率</td></tr><tr><td><strong>GA</strong></td><td><strong>G</strong>ood <strong>A</strong>fternoon</td><td>下午好</td></tr><tr><td><strong>GE</strong></td><td><strong>G</strong>ood <strong>E</strong>vening</td><td>晚上好</td></tr><tr><td><strong>GM</strong></td><td><strong>G</strong>ood <strong>M</strong>orning</td><td>早晨好</td></tr><tr><td><strong>GN</strong></td><td><strong>G</strong>ood <strong>N</strong>ight</td><td>晚安</td></tr><tr><td><strong>GB</strong></td><td><strong>G</strong>ood<strong>B</strong>ye / <strong>G</strong>od <strong>B</strong>less</td><td>再见</td></tr><tr><td><strong>GL</strong></td><td><strong>G</strong>ood <strong>L</strong>uck</td><td>祝好运</td></tr><tr><td><strong>GLD</strong></td><td><strong>GL</strong>a<strong>D</strong></td><td>高兴</td></tr><tr><td><strong>GND</strong></td><td><strong>G</strong>rou<strong>ND</strong></td><td>地、接地</td></tr><tr><td><strong>GMT</stron ng>a<strong>N</strong>y / <strong>M</strong>a<strong>NI</strong> + <strong>T</strong>ha<strong>NK</strong>s）。</p>\n<hr>","chapters":["2.4.1","2.4.2"],"qIds":["MC1-0343","MC1-0344","MC1-0345","MC1-0346","MC1-0347","MC1-0348","MC1-0349","MC1-0350","MC1-0351","MC1-0352","MC1-0353","MC1-0354","MC1-0355","MC1-0356","MC1-0357","MC1-0358","MC1-0359","MC1-0360","MC1-0361","MC1-0362","MC1-0363","MC1-0364","MC1-0365","MC1-0366","MC1-0367","MC1-0368","MC1-0369","MC1-0370","MC1-0371","MC1-0372","MC1-0373","MC1-0374","MC1-0375","MC1-0376","MC1-0377","MC1-0378","MC1-0379","MC1-0380","MC1-0381","MC1-0382","MC1-0383","MC1-0384","MC1-0385","MC1-0386","MC1-0387","MC1-0388","MC1-0389","MC1-0390","MC1-0391","MC1-0392","MC1-0393","MC1-0394","MC1-0395","MC1-0396","MC1-0397","MC1-0398","MC1-0399","MC1-0400","MC1-0401","MC1-0402","MC1-0403","MC1-0404","MC1-0405","MC1-0406","MC1-0407","MC1-0408","MC1-0409","MC1-0410","MC1-0411","MC1-0412","MC1-0413","MC1-0414","MC1-0415","MC1-0416","MC1-0417","MC1-0418","MC1-0419","MC1-0420","MC1-0421","MC1-0422","MC1-0423","MC1-0424"],"qCount":82},{"id":14,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"QSL 卡片","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：日志必含 <strong>DATE/TIME/FREQ/MODE/CALL/RST</strong>。</li><li><strong>必背</strong>：①卡片至少含双方呼号 + 信号报告 + 时间 + 模式 + 频率 + 签章 + 地址；②直接寄希望对方回卡 → 附 <strong>SASE</strong>；③收到 IRC → 确认真实后<strong>直接</strong>回寄（不走 BURO）；④SWL 收听卡也应回；⑤填错应<strong>重新填写</strong>，不要涂改。</li><li><strong>易错</strong>：现场见面交流的卡应注 \"Eyeball QSO\" — <strong>不能赠空白卡</strong>。</li></ul></blockquote>\n<p>[Qs: 274–281]</p>\n<hr>","chapters":["2.2.3"],"qIds":["MC1-0274","MC1-0275","MC4-0276","MC4-0277","MC1-0278","MC1-0279","MC1-0280","MC1-0281"],"qCount":8},{"id":15,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"中继台与信标台（设置 + 使用）","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：中继台 = 接收+<strong>放大转发</strong>；信标台 = <strong>单发</strong>信标信号验证传播。两者都是公共资源。</li><li><strong>必背</strong>：①<strong>2 m 频差 600 kHz / 70 cm 频差 5 MHz</strong>（业余标准频差）；②必备技术措施 = <strong>专人监控 + 遥控停发</strong>；③向覆盖区<strong>全体</strong>业余电台提供<strong>平等</strong>服务，<strong>技术参数公开</strong>；④台址布局应<strong>资源共享、集约</strong>；⑤跨行政区域应与当地无管局协调；⑥通过中继呼叫：直接报对方呼号+自己呼号。</li><li><strong>易错</strong>：①中继台<strong>不能收费</strong>、不能优先团体成员；②上下行频率应<strong>空闲</strong>以备应急（不应刷\"通知\"塞满）；③信标台是<strong>单发</strong>（\"接收信标\"是错的）；④中继台<strong>不衰减</strong>信号（是放大）。</li></ul></blockquote>\n<p><strong>两类专用电台的定义</strong>：</p>\n<table><thead><tr><th>类型</th><th>定义</th><th>工作模式</th></tr></thead><tbody><tr><td><strong>业余中继台</strong></td><td>通过对业余无线电信号<strong>接收和放大转发</strong>，<strong>扩大</strong>通联范围的业余无线电台</td><td>双工/异频</td></tr><tr><td><strong>业余信标台</strong></td><td>通过<strong>发射信标信号</strong>，辅助验证<strong>电波传播条件</strong>的<strong>单发</strong>业余无线电台</td><td>单发</td></tr></tbody></table>\n<p><strong>设置中继/信标台的关键规定</strong>：</p>\n<ul><li>设置和技术参数应符合<strong>国家以及设台地的省级无管局</strong>规定；</li><li>台址布局应符合<strong>资源共享、集约</strong>要求；</li><li>应当向覆盖区域内<strong>全体</strong>业余电台提供<strong>平等</strong>服务；</li><li>明确设台地点、频率、技术参数、运行维护要求并向社会<strong>公布</strong>；</li><li>服务区域<strong>超出</strong>本行政区域时，需与地方无管局<strong>协调</strong>。</li></ul>\n<p>[Qs: 47–51, 108–110, 282–284]</p>\n<hr>","chapters":["1.2.4","1.5.1","2.2.4"],"qIds":["MC3-0047","MC3-0048","MC2-0049","MC4-0050","MC1-0051","MC1-0108","MC1-0109","MC1-0110","MC1-0282","MC1-0283","MC1-0284"],"qCount":11},{"id":16,"part":9,"partName":"通联礼仪、语言与协议","partOrd":"二","title":"调制方式与发射类别","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：用三位发射类别符号表示信号特征。</li><li><strong>必背</strong>：</li><li><strong>A1A = CW 报</strong> / <strong>J3E = SSB 话</strong> / <strong>F3E = FM 话</strong> / <strong>F2B = FM 副载波数据</strong> / <strong>F3F = FM 电视/SSTV</strong></li><li><strong>HF 话音用 SSB</strong>；<strong>V/UHF 本地用 FM</strong>；<strong>V/UHF 远距/弱信号话音用 SSB</strong>；</li><li><strong>CW 带宽最窄</strong>；<strong>FM 含恒定载波，功率利用不充分</strong>；</li><li><strong>10.1 MHz 以下 LSB / 以上 USB / V·UHF SSB = USB</strong>；</li><li><strong>SSB 呼叫间隔 2–3 kHz</strong>。</li><li><strong>易错</strong>：①过调制 10× → 谐波/互调/带宽增大/失真；②<strong>SSB 是调幅特例</strong>（不是调频）。</li></ul></blockquote>\n<p>[Qs: 425–447, 512–516]</p>\n<p><strong>调制缩写英文对照表</strong>：</p>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文</th></tr></thead><tbody><tr><td><strong>AM</strong></td><td><strong>A</strong>mplitude <strong>M</strong>odulation</td><td>幅度调制（调幅）</td></tr><tr><td><strong>FM</strong></td><td><strong>F</strong>requency <strong>M</strong>odulation</td><td>频率调制（调频）</td></tr><tr><td><strong>PM</strong></td><td><strong>P</strong>hase <strong>M</strong>odulation</td><td>相位调制（调相）</td></tr><tr><td><strong>SSB</strong></td><td><strong>S</strong>ingle <strong>S</strong>ide<strong>B</strong>and</td><td>单边带</td></tr><tr><td><strong>DSB</strong></td><td><strong>D</strong>ouble <strong>S</strong>ide<strong>B</strong>and</td><td>双边带</td></tr><tr><td><strong>LSB</strong></td><td><strong>L</strong>ower <strong>S</strong>ide<strong>B</strong>and</td><td>下边带</td></tr><tr><td><strong>USB</strong></td><td><strong>U</strong>pper <strong>S</strong>ide<strong>B</strong>and</td><td>上边带</td></tr><tr><td><strong>VSB</strong></td><td><strong>V</strong>estigial <strong>S</strong>ide<strong>B</strong>and</td><td>残留边带</td></tr><tr><td><strong>CW</strong></td><td><strong>C</strong>ontinuous <strong>W</strong>ave</td><td>等幅电报（摩尔斯报）</td></tr><tr><td><strong>NFM / WFM</strong></td><td><strong>N</strong>arrow / <strong>W</strong>ide <strong>FM</strong></td><td>窄带 / 宽带调频</td></tr></tbody></table>\n<p><strong>数字模式 &amp; 电视缩写</strong>：</p>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文</th></tr></thead><tbody><tr><td><strong>FSK</strong></td><td><strong>F</strong>requency <strong>S</strong>hift <strong>K</strong>eying</td><td>频移键控</td></tr><tr><td><strong>PSK</strong></td><td><strong>P</strong>hase <strong>S</strong>hift <strong>K</strong>eying</td><td>相移键控</td></tr><tr><td><strong>AFSK</strong></td><td><strong>A</strong>udio <strong>F</strong>SK</td><td>音频频移键控</td></tr><tr><td><strong>QPSK</strong></td><td><strong>Q</strong>uadrature <strong>PSK</strong></td><td>四相相移键控</td></tr><tr><td><strong>8PSK / 16APSK / 32APSK</strong></td><td>8/16/32 状态 (A=Amplitude+PSK)</td><td>振幅相移键控</td></tr><tr><td><strong>OOK</strong></td><td><strong>O</strong>n-<strong>O</strong>ff <strong>K</strong>eying</td><td>开关键控</td></tr><tr><td><strong>DSSS</strong></td><td><strong>D</strong>irect <strong>S</strong>equence <strong>S</strong>pread <strong>S</strong>pectrum</td><td>直序扩频</td></tr><tr><td><strong>ATV</strong></td><td><strong>A</strong>mateur <strong>T</strong>ele<strong>V</strong>ision</td><td>业余电视</td></tr><tr><td><strong>SSTV</strong></td><td><strong>S</strong>low-<strong>S</strong>can <strong>TV</strong></td><td>慢扫描电视</td></tr><tr><td><strong>DATV</strong></td><td><strong>D</strong>igital <strong>ATV</strong></td><td>数字业余电视</td></tr><tr><td><strong>DSSTV</strong></td><td><strong>D</strong>igital <strong>SSTV</strong></td><td>数字慢扫描电视</td></tr><tr><td><strong>DVB-S2</strong></td><td><strong>D</strong>igital <strong>V</strong>ideo <strong>B</strong>roadcasting – <strong>S</strong>atellite 2nd gen</td><td>数字卫星电视广播第二代</td></tr><tr><td><strong>DRM</strong></td><td><strong>D</strong>igital <strong>R</strong>adio <strong>M</strong>ondiale</td><td>数字调幅广播标准</td></tr><tr><td><strong>DV</strong></td><td><strong>D</strong>igital <strong>V</strong>oice</td><td>数字话音</td></tr><tr><td><strong>YSF</strong></td><td><strong>Y</strong>aesu <strong>S</strong>ystem <strong>F</strong>usion（八重洲品牌）</td><td>C4FM 调制数字话音/数据</td></tr><tr><td><strong>D-STAR</strong></td><td><strong>D</strong>igital <strong>S</strong>mart <strong>T</strong>echnologies for <strong>A</strong>mateur <strong>R</strong>adio</td><td>ICOM 数字话音/数据系统</td></tr><tr><td><strong>FreeDV</strong></td><td><strong>Free</strong> open-source <strong>D</strong>igital <strong>V</strong>oice</td><td>开源 HF 数字话音</td></tr><tr><td><strong>FT4 / FT8</strong></td><td><strong>F</strong>ranke-<strong>T</strong>aylor 4/8（作者：K9AN 和 K1JT）</td><td>弱信号数字模式</td></tr><tr><td><strong>APRS</strong></td><td><strong>A</strong>utomatic <strong>P</strong>acket <strong>R</strong>eporting <strong>S</strong>ystem</td><td>自动分组报告系统</td></tr><tr><td><strong>PSK31</strong></td><td><strong>PSK</strong> at <strong>31</strong> baud</td><td>31 波特相移键控</td></tr><tr><td><strong>MT63</strong></td><td><strong>M</strong>ulti-<strong>T</strong>one <strong>63</strong> tones</td><td>63 音多音调模式</td></tr></tbody></table>\n<p><strong>例题</strong>（MC1-0445）：最窄发射带宽：<strong>答案 A — CW</strong>（Continuous Wave，等幅波）。</p>\n<hr>","chapters":["2.5.1","2.6.3","2.6.4"],"qIds":["MC1-0425","MC1-0426","MC1-0427","MC1-0428","MC1-0429","MC1-0430","MC1-0431","MC1-0432","MC1-0433","MC1-0434","MC1-0435","MC1-0436","MC1-0437","MC1-0438","MC1-0439","MC1-0440","MC1-0441","MC1-0442","MC1-0443","MC1-0444","MC1-0445","MC1-0446","MC1-0447","MC3-0512","MC4-0513","MC3-0514","MC4-0515","MC1-0516"],"qCount":28},{"id":17,"part":17,"partName":"收发信机操作","partOrd":"三","title":"收发信机基础与面板操作（**送分题，必拿**）","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：收发信机 = 接收 + 发射的组合设备；先掌握收发系统组成，再记面板缩写。</li><li><strong>必背收发系统</strong>：</li><li><strong>接收系统至少含</strong>：接收天线 + <strong>解调器</strong>（必要时含放大器/选择电路等）</li><li><strong>发射系统至少含</strong>：<strong>射频振荡器 + 调制器 + 发射天线</strong></li><li><strong>单工 simplex</strong>：两端<strong>交替</strong>收发（PTT 对讲）/ <strong>双工 duplex</strong>：<strong>同时</strong>双向（卫星地面台、QSK CW）/ <strong>半双工 semi-duplex</strong>：一端单工一端双工（中继 + 对讲机）</li><li><strong>必背速查表</strong>（含英文原文助记）：</li><li><strong>PTT = Push To Talk</strong> 按键发射 / <strong>VOX = Voice Operated eXchange</strong> 声控免提 / <strong>SQL = SQueLch</strong> 静噪 / <strong>VOL = VOLume</strong> 音量</li><li><strong>ATT = ATTenuator</strong> 衰减器（接收<strong>强信号</strong>）/ <strong>PRE = PREamplifier</strong> 前置放大（接收<strong>弱信号</strong>）</li><li><strong>AGC = Automatic Gain Control</strong> 接收<strong>中频</strong>自动增益 / <strong>ALC = Automatic Level Control</strong> 发射<strong>射频</strong>电平</li><li><strong>PROC = speech PROCessor</strong> 语音压缩 / <strong>NB = Noise Blanker</strong> 抑制脉冲噪声 / <strong>AT / TUNE = Auto Tuner</strong> 自动天调</li><li><strong>CTCSS = Continuous Tone-Coded Squelch System</strong> 连续音调编码静噪（67–250.3 Hz）/ <strong>DCS = Digital Coded Squelch</strong> 数字编码静噪 / <strong>DTMF = Dual-Tone Multi-Frequency</strong> 双音多频遥控（16 状态）</li><li><strong>NFM = Narrow FM</strong> 窄带调频（25/12.5 kHz） / <strong>WFM = Wide FM</strong> 宽带调频（180 kHz，广播）</li><li><strong>MODE</strong> 工作方式（切 FM/LSB/USB/CW） / <strong>RIT = Receiver Incremental Tuning</strong> 收信微调</li><li><strong>易错</strong>：</li></ul>\n<ol><li><strong>ATT vs PRE 容易反</strong>：<strong>A</strong>ttenuator 衰减 / <strong>P</strong>reamp 前放；</li><li><strong>AGC 控接收，ALC 控发射</strong>——别混（<strong>G</strong>ain vs <strong>L</strong>evel）；</li><li><strong>AFSK = Audio Frequency Shift Keying</strong> 数据要关 ALC 和语音压缩；</li><li>关闭 AGC 场景 = <strong>弱信号 + 强干扰同时</strong>；</li><li>FM 接收声音大小<strong>不能</strong>判断信号强度（限幅后中频幅度已切齐）；</li><li>收发信机直流电源线要<strong>尽量短、尽量粗</strong>——<strong>减小发信时电源线压降</strong>。</li></ol></blockquote>\n<p>[Qs: 565–588, 598–622]</p>\n<p><strong>关键经验</strong>：</p>\n<ul><li><strong>聆听微弱 FM</strong> → 把 SQL 关掉或阈值 = 0；</li><li><strong>强带外信号阻塞</strong> → 启用 ATT；</li><li><strong>SSB/AM 用长 AGC 时间常数</strong>；<strong>FM/FSK/PSK 用短</strong>；</li><li><strong>SWR 过高</strong> → 设备自动<strong>降功率保护功放</strong>；</li><li><strong>SSB 背景噪声</strong> → 调低话筒增益 / 语音压缩深度；</li><li><strong>车载电源负极</strong> → 接电池负极或发动机接地带（<strong>不接</strong>天线座/挂置架）；</li><li><strong>车内随引擎啸声</strong> → <strong>发电机</strong>；</li><li><strong>音频电缆感生射频</strong> → 套<strong>铁氧体磁环</strong>；</li><li><strong>DC 收信机</strong> = Direct-Conversion 直接变换；</li><li><strong>上变频</strong> = 本振高于输入；<strong>下变频</strong> = 本振低于输入。</li></ul>\n<p><strong>例题</strong>（MC1-0573）：SQL = <strong>静噪控制</strong>。</p>\n<hr>","chapters":["3.1.1","3.1.3"],"qIds":["MC1-0565","MC2-0566","MC3-0567","MC1-0568","MC1-0569","MC1-0570","MC1-0571","MC
