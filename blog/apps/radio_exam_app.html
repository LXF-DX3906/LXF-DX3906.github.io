trong>Fn=1，NF=0 dB，Te=0 K</strong>；④标温（17℃ = 290 K）：<strong>Fn=2，NF=3 dB，Te=290 K</strong>。</li></ul></blockquote>\n<p>[Qs: 819–886]</p>\n<p><strong>指标英文对照</strong>：</p>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文</th></tr></thead><tbody><tr><td><strong>SNR / S/N</strong></td><td><strong>S</strong>ignal-to-<strong>N</strong>oise <strong>R</strong>atio</td><td>信噪比</td></tr><tr><td><strong>Fn</strong></td><td>Noise <strong>F</strong>actor (ratio form)</td><td>噪声系数（比值，越接近 1 越好）</td></tr><tr><td><strong>NF</strong></td><td><strong>N</strong>oise <strong>F</strong>igure (dB form)</td><td>噪声指数（dB，越接近 0 越好）</td></tr><tr><td><strong>Te</strong></td><td>equivalent noise <strong>T</strong>emperature</td><td>等效噪声温度（K，越接近 0 越好）</td></tr><tr><td><strong>AGC</strong></td><td><strong>A</strong>utomatic <strong>G</strong>ain <strong>C</strong>ontrol</td><td>自动增益控制</td></tr><tr><td><strong>DC 收信机</strong></td><td><strong>D</strong>irect <strong>C</strong>onversion receiver</td><td>直接变换收信机</td></tr><tr><td><strong>DSP</strong></td><td><strong>D</strong>igital <strong>S</strong>ignal <strong>P</strong>rocessing</td><td>数字信号处理</td></tr></tbody></table>\n<p><strong>换算</strong>（50 Ω）：1 μV ↔ –107 dBm ↔ 0 dBμV。</p>\n<p><strong>鉴频</strong> (discrimination) = FM 解调；<strong>检波</strong> (detection) = AM 解调。</p>\n<hr>","chapters":["3.6.1","3.6.3"],"qIds":["MC4-0821","MC1-0822","MC1-0823","MC1-0824","MC1-0825","MC1-0826","MC1-0827","MC1-0828","MC1-0829","MC1-0830","MC1-0831","MC1-0832","MC1-0833","MC1-0834","MC1-0835","MC2-0836","MC1-0837","MC1-0838","MC1-0839","MC1-0859","MC1-0860","MC1-0861","MC1-0862","MC1-0863","MC1-0864","MC1-0865","MC1-0866","MC1-0867","MC1-0868","MC1-0869","MC1-0870","MC1-0871","MC1-0872","MC1-0873","MC1-0874","MC1-0875","MC1-0876","MC1-0877","MC1-0878","MC1-0879","MC1-0880","MC1-0881","MC1-0882","MC1-0883","MC1-0884","MC1-0885","MC1-0886"],"qCount":47},{"id":20,"part":17,"partName":"收发信机操作","partOrd":"三","title":"发射机相关","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：效率 + 功率 + dBm 换算。</li><li><strong>必背</strong>：①<strong>FM &gt; AM &gt; SSB</strong>（无语音输入时实际功率，因为 FM 始终满载波）；②13.8 V + 效率 80% → 电流 ≈ <strong>0.091 × N</strong>（A）；③220 V + 80% → 电流 ≈ <strong>0.0057 × N</strong>（A）。</li><li><strong>易错</strong>：①损耗主要变<strong>热量</strong>（不是杂散）；②<strong>载波功率</strong> = 无调制时一个射频周期的平均功率。</li></ul></blockquote>\n<p>[Qs: 819, 846–852, 962–964]</p>\n<p><strong>dBm / dBμW 换算</strong>（<strong>注意：题库实际用 dBμ = dBμW，相对 1 μW</strong>）：</p>\n<table><thead><tr><th>功率</th><th>dBm（相对 1 mW）</th><th>dBμ（相对 1 μW，dBμW）</th></tr></thead><tbody><tr><td><strong>5 W</strong></td><td><strong>37 dBm</strong></td><td>67 dBμ</td></tr><tr><td><strong>0.25 W</strong></td><td>24 dBm</td><td><strong>54 dBμ</strong> ← 题考此</td></tr><tr><td><strong>0.4 kW (= 400 W)</strong></td><td>56 dBm</td><td><strong>86 dBμ</strong> ← 题考此</td></tr><tr><td>1 W</td><td>30 dBm</td><td>60 dBμ</td></tr><tr><td>1 mW</td><td>0 dBm</td><td>30 dBμ</td></tr><tr><td>1 μW</td><td>–30 dBm</td><td>0 dBμ</td></tr></tbody></table>\n<p><strong>换算规律</strong>：<strong>dBμ = dBm + 30</strong>（因为 1 mW = 1000 μW = +30 dB）；<strong>1 μV (50 Ω) = –107 dBm</strong>。</p>\n<hr>","chapters":["3.6.1"],"qIds":["MC1-0819","MC1-0820","MC1-0846","MC1-0847","MC1-0848","MC1-0849","MC1-0850","MC1-0851","MC1-0852"],"qCount":9},{"id":21,"part":21,"partName":"天线与电波传播","partOrd":"四","title":"天线基础","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：增益单位 dBi（点源参考）/ dBd（半波偶极参考）。</li><li><strong>必背</strong>：<strong>0 dBd = 2.15 dBi</strong>；<strong>dB（无后缀）无意义</strong>。</li><li><strong>加感效率</strong>：<strong>顶部 &gt; 中部 &gt; 底部</strong>。</li><li><strong>GP 全向 = 水平方向无指向性</strong>（H 面全向、E 面 8 字）；最大辐射方向<strong>仰角稍 &gt; 0°</strong>。</li><li><strong>易错</strong>：①GP 实际性能不佳 → 缺乏<strong>有效接地镜像</strong>（用大面积金属导体接地）；②橡胶天线<strong>垂直分量较强</strong>；③天线最近高压线<strong>≥1 m</strong>（35 kV 及以下）。</li></ul></blockquote>\n<p>[Qs: 649–668]</p>\n<hr>","chapters":["3.3.1"],"qIds":["MC1-0649","MC1-0650","MC2-0651","MC1-0652","MC1-0653","MC1-0654","MC1-0655","MC1-0656","MC1-0657","MC1-0658","MC2-0659","MC2-0660","MC1-0661","MC1-0662","MC1-0663","MC1-0664","MC1-0665","MC1-0666","MC1-0667","MC1-0668","MC1-0669"],"qCount":21},{"id":22,"part":21,"partName":"天线与电波传播","partOrd":"四","title":"SWR 驻波比","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：<strong>SWR = S</strong>tanding <strong>W</strong>ave <strong>R</strong>atio 驻波比 = 阻抗匹配程度，<strong>1:1 最理想</strong>。</li><li><strong>必背</strong>：①<strong>SWR 3:1</strong> = 馈线上电压/电流最大最小峰值比 = 3:1；②SWR 不稳 = <strong>接触不良</strong>；③发射机 SWR 高→<strong>自动降功率保护功放</strong>；④<strong>SSB SWR 不稳 = 话音幅度变化</strong>所致；⑤SWR 低的好处：<strong>降损耗 + 防屏蔽层辐射 RFI</strong>。</li><li><strong>易错</strong>：SWR=4:1 <strong>不能</strong>推断\"辐射效率 25%\"或\"增益 4 dB\"——只能说明匹配不佳。</li></ul></blockquote>\n<p><strong>相关缩写</strong>：</p>\n<ul><li><strong>VSWR = V</strong>oltage <strong>SWR</strong>（电压驻波比，与 SWR 同义）</li><li><strong>RFI = R</strong>adio <strong>F</strong>requency <strong>I</strong>nterference 射频干扰</li><li><strong>PEP = P</strong>eak <strong>E</strong>nvelope <strong>P</strong>ower 峰包功率</li></ul>\n<p>[Qs: 670–677]</p>\n<hr>","chapters":["3.3.2"],"qIds":["MC3-0670","MC1-0671","MC2-0672","MC1-0673","MC1-0674","MC1-0675","MC1-0676","MC1-0677"],"qCount":8},{"id":23,"part":21,"partName":"天线与电波传播","partOrd":"四","title":"同轴电缆 & 馈线","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：业余首选 50 Ω 同轴。</li><li><strong>必背</strong>：①电视=75 Ω / 音频=600 Ω / 业余通信=<strong>50 Ω</strong>；②选购看<strong>特性阻抗 + 每百米损耗</strong>；③<strong>400 MHz 以上首选 N 型连接器</strong>；④M 型（PL259/SO239）用于 <strong>HF + VHF</strong>；⑤VHF/UHF 低损耗首选 <strong>空气介质同轴硬电缆</strong>；⑥<strong>信号频率升高 → 传输损耗增加</strong>。</li><li><strong>易错</strong>：①受潮导致<strong>介质损耗变大 + 屏蔽层氧化锈蚀</strong>（<strong>不是</strong>速度因子变化）；②室外耐紫外线 = <strong>防护套破坏致受潮</strong>。</li></ul></blockquote>\n<p>[Qs: 678–688]</p>\n<hr>","chapters":["3.3.3"],"qIds":["MC1-0678","MC1-0679","MC2-0680","MC2-0681","MC2-0682","MC1-0683","MC1-0684","MC1-0685","MC1-0686","MC1-0687","MC1-0688"],"qCount":11},{"id":24,"part":21,"partName":"天线与电波传播","partOrd":"四","title":"极化与方向图","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：收发<strong>同极化</strong>才有效。</li><li><strong>必背</strong>：</li><li><strong>垂直天线 = 垂直极化，电场垂直地面，H 面全向</strong></li><li><strong>水平偶极 = 水平极化，电场平行地面，E 面 8 字</strong></li><li>圆极化对通信：<strong>同旋向 → 好；反旋向 → 严重失配；线极化 vs 圆极化 → 中等（3 dB 损失，效果不变）</strong></li><li><strong>S 表每档 6 dB</strong>：增益增加 6 dB → S 表 +1 档；增 12 dB → +2 档</li><li><strong>易错</strong>：①从卫星到地球的电场顺时针 → <strong>左旋极化</strong>（观察方向反，旋向反！）；②卫星右旋极化自动跟踪 → 地面<strong>始终右旋圆极化</strong>（不变）。</li></ul></blockquote>\n<p>[Qs: 689–708]</p>\n<hr>","chapters":["3.3.4"],"qIds":["MC2-0689","MC2-0690","MC1-0691","MC1-0692","MC1-0693","MC1-0694","MC1-0695","MC1-0696","MC1-0697","MC1-0698","MC1-0699","MC1-0700","MC1-0701","MC1-0702","MC1-0703","MC1-0704","MC1-0705","MC1-0706","MC1-0707","MC1-0708"],"qCount":20},{"id":25,"part":21,"partName":"天线与电波传播","partOrd":"四","title":"电波传播","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：超视距/异常传播都有典型原因。</li><li><strong>必背</strong>：</li><li><strong>多径效应</strong> → 移动几步即改善</li><li><strong>数百 km V/UHF 超视距</strong> → <strong>大气波导</strong>（由<strong>高空逆温</strong>引起）</li><li><strong>6 m / 2 m 上千 km 超视距</strong> → <strong>突发 E 层</strong></li><li><strong>V/UHF 500 km 超视距</strong> → <strong>对流层散射</strong></li><li><strong>流星余迹散射首选 6 m</strong>；模式用 <strong>FT4</strong></li><li><strong>EME 最佳 = 月亮近地点</strong>（不是满月、不是晴天）</li><li>VHF 视距决定因素 = <strong>天线距地面的相对高度</strong></li><li><strong>易错</strong>：①多径对数据通信 → <strong>误码率上升</strong>；②多径 ATV → <strong>图像边缘重影</strong>。</li></ul></blockquote>\n<p>[Qs: 709–718]</p>\n<hr>","chapters":["3.3.5","3.3.6"],"qIds":["MC1-0709","MC1-0710","MC1-0711","MC2-0712","MC1-0713","MC1-0714","MC1-0715","MC1-0716","MC1-0717","MC1-0718"],"qCount":10},{"id":26,"part":21,"partName":"天线与电波传播","partOrd":"四","title":"卫星 & EME","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：AMSAT 美国卫星公司 / OSCAR = 轨道业余卫星缩写。</li><li><strong>必背</strong>：①中国首颗 = <strong>2009 年希望一号 XW-1，HO68，V/U(J)</strong>；②EME 前置放大器 → 装<strong>靠近天线</strong>且<strong>冷却降噪</strong>；③HF 不需在天线端放低噪放，因为 <strong>VHF/UHF 背景噪声较 HF 低</strong>。</li><li><strong>易错</strong>：流星余迹/对流层散射用 <strong>FT4</strong>（不是 APRS/QPSK31/MT63）。</li></ul></blockquote>\n<p><strong>核心缩写英文对照</strong>：</p>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文</th></tr></thead><tbody><tr><td><strong>AMSAT</strong></td><td><strong>AM</strong>ateur <strong>SAT</strong>ellite Corporation</td><td>美国业余卫星公司</td></tr><tr><td><strong>OSCAR</strong></td><td><strong>O</strong>rbiting <strong>S</strong>atellite <strong>C</strong>arrying <strong>A</strong>mateur <strong>R</strong>adio</td><td>搭载业余电台的地球轨道卫星</td></tr><tr><td><strong>EME</strong></td><td><strong>E</strong>arth-<strong>M</strong>oon-<strong>E</strong>arth</td><td>地-月-地（月面反射通信，俗称 \"moonbounce\"）</td></tr><tr><td><strong>IARU</strong></td><td><strong>I</strong>nternational <strong>A</strong>mateur <strong>R</strong>adio <strong>U</strong>nion</td><td>国际业余无线电联盟</td></tr><tr><td><strong>ITU</strong></td><td><strong>I</strong>nternational <strong>T</strong>elecommunication <strong>U</strong>nion</td><td>国际电信联盟</td></tr><tr><td><strong>ARRL</strong></td><td><strong>A</strong>merican <strong>R</strong>adio <strong>R</strong>elay <strong>L</strong>eague</td><td>美国业余无线电中继联盟</td></tr><tr><td><strong>HO68</strong></td><td><strong>H</strong>ope <strong>O</strong>SCAR <strong>68</strong></td><td>希望-1 号（中国 2009 年发射）</td></tr></tbody></table>\n<p>[Qs: 908–915]</p>\n<hr>","chapters":["3.8.1"],"qIds":["MC1-0908","MC1-0909","MC1-0910","MC1-0911","MC1-0912","MC1-0913","MC1-0914","MC1-0915"],"qCount":8},{"id":27,"part":27,"partName":"电学基础、设备与测量","partOrd":"五","title":"导体、绝缘体、半导体","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：导电能力分三级。</li><li><strong>必背</strong>：①导体 = 金属/电离气体/酸碱盐溶液/<strong>石墨</strong>；②绝缘体 = 陶瓷/聚苯乙烯/酚醛/SiO₂/工程塑料/云母；③半导体 = 硅锗 GaN LDMOS 三极管；④<strong>电真空三极管不是半导体</strong>；⑤击穿 = 电压超限突变导体；⑥<strong>台灯卤钨灯</strong>不是击穿。</li><li><strong>易错</strong>：受潮积灰但未击穿 → <strong>介质损耗</strong>变化。</li></ul></blockquote>\n<p>[Qs: 916–923]</p>\n<hr>","chapters":["4.1.1"],"qIds":["MC2-0916","MC3-0917","MC4-0918","MC3-0919","MC3-0920","MC1-0921","MC4-0922","MC3-0923"],"qCount":8},{"id":28,"part":27,"partName":"电学基础、设备与测量","partOrd":"五","title":"静电、直流、交流","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：理解基本电学概念。</li><li><strong>必背</strong>：①导体置静电场 → 内部场强为零，外表面有电荷；<strong>曲率大处聚集</strong>→尖端放电；②交流电<strong>无正负极</strong>之分；③<strong>波长 = 光速 / 频率</strong>；④<strong>电动势</strong> = 转化为电能的能力；<strong>电压</strong> = 驱动电子的力；<strong>电阻</strong> = 阻碍电流；<strong>阻抗</strong> = 对<strong>交流</strong>电流的阻碍；⑤<strong>有效值 = 峰值 / √2</strong>；⑥<strong>所有电流（含射频）都受阻碍</strong>——不存在\"不受电阻阻碍的电流\"。</li><li><strong>易错</strong>：13.8 V 短路也<strong>有危险</strong>；火零线<strong>不可混用</strong>。</li></ul></blockquote>\n<p><strong>电学缩写</strong>：</p>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文</th></tr></thead><tbody><tr><td><strong>DC</strong></td><td><strong>D</strong>irect <strong>C</strong>urrent</td><td>直流电</td></tr><tr><td><strong>AC</strong></td><td><strong>A</strong>lternating <strong>C</strong>urrent</td><td>交流电</td></tr><tr><td><strong>EMF</strong></td><td><strong>E</strong>lectro<strong>M</strong>otive <strong>F</strong>orce</td><td>电动势</td></tr><tr><td><strong>RMS</strong></td><td><strong>R</strong>oot <strong>M</strong>ean <strong>S</strong>quare</td><td>有效值（均方根）</td></tr><tr><td><strong>PN 结</strong></td><td><strong>P</strong>ositive-<strong>N</strong>egative junction</td><td>P 型 N 型半导体结面</td></tr><tr><td><strong>ESD</strong></td><td><strong>E</strong>lectro<strong>S</strong>tatic <strong>D</strong>ischarge</td><td>静电放电</td></tr><tr><td><strong>QRN</strong></td><td>(Q 简语)</td><td>天电干扰、自然噪声</td></tr></tbody></table>\n<p>[Qs: 924–940]</p>\n<hr>","chapters":["4.1.2"],"qIds":["MC3-0924","MC2-0925","MC2-0926","MC1-0927","MC1-0928","MC1-0929","MC1-0930","MC1-0931","MC1-0932","MC1-0933","MC1-0934","MC1-0935","MC1-0936","MC1-0937","MC2-0938","MC1-0939","MC1-0940"],"qCount":17},{"id":29,"part":27,"partName":"电学基础、设备与测量","partOrd":"五","title":"单位与词头","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：背 SI 词头。</li><li><strong>必背</strong>：</li></ul></blockquote>\n<table><thead><tr><th>符号</th><th>大小</th><th>文字</th><th>英文原词 / 起源</th></tr></thead><tbody><tr><td><strong>k</strong></td><td>10³</td><td>千</td><td><strong>kilo</strong>（希腊 χίλιοι \"thousand\"）</td></tr><tr><td><strong>M</strong></td><td>10⁶</td><td>兆</td><td><strong>Mega</strong>（希腊 μέγας \"great\"）</td></tr><tr><td><strong>G</strong></td><td>10⁹</td><td>吉</td><td><strong>Giga</strong>（希腊 γίγας \"giant\"）</td></tr><tr><td><strong>T</strong></td><td>10¹²</td><td>太</td><td><strong>Tera</strong>（希腊 τέρας \"monster\"）</td></tr><tr><td><strong>m</strong></td><td>10⁻³</td><td>毫</td><td><strong>milli</strong>（拉丁 mille \"thousand\"）</td></tr><tr><td><strong>μ</strong></td><td>10⁻⁶</td><td>微</td><td><strong>micro</strong>（希腊 μικρός \"small\"，字母为希腊 mu）</td></tr><tr><td><strong>n</strong></td><td>10⁻⁹</td><td>纳</td><td><strong>nano</strong>（希腊 νᾶνος \"dwarf\"）</td></tr><tr><td><strong>p</strong></td><td>10⁻¹²</td><td>皮</td><td><strong>pico</strong>（意大利 piccolo \"small\"）</td></tr></tbody></table>\n<blockquote><ul><li><strong>易错</strong>：<strong>M（大写）= 10⁶ 兆；m（小写）= 10⁻³ 毫</strong>——大小写错就完蛋；<strong>G/T</strong> 都是大写；<strong>μ</strong> 是希腊小写 mu，不是字母 u。</li></ul></blockquote>\n<p><strong>SI 物理量单位</strong>（<strong>以人名命名</strong>）：</p>\n<table><thead><tr><th>物理量</th><th>单位</th><th>英文</th><th>命名来源</th></tr></thead><tbody><tr><td>电压 / 电动势</td><td>V</td><td><strong>V</strong>olt</td><td>Volta（伏特，电池发明者）</td></tr><tr><td>电流</td><td>A</td><td><strong>A</strong>mpere</td><td>Ampère（安培）</td></tr><tr><td>电阻 / 阻抗</td><td>Ω</td><td><strong>O</strong>hm</td><td>Ohm（欧姆）</td></tr><tr><td>功率</td><td>W</td><td><strong>W</strong>att</td><td>Watt（瓦特）</td></tr><tr><td>频率</td><td>Hz</td><td><strong>H</strong>ert<strong>z</strong></td><td>Hertz（赫兹）</td></tr><tr><td>电感</td><td>H</td><td><strong>H</strong>enry</td><td>Henry（亨利）</td></tr><tr><td>电容</td><td>F</td><td><strong>F</strong>arad</td><td>Faraday（法拉第）</td></tr><tr><td>电荷</td><td>C</td><td><strong>C</strong>oulomb</td><td>Coulomb（库仑）</td></tr></tbody></table>\n<p>[Qs: 941–955]</p>\n<p>单位：电动势/电压=<strong>伏 V</strong>；电流=<strong>安 A</strong>；电阻/阻抗=<strong>欧 Ω</strong>；功率=<strong>瓦 W</strong>；频率=<strong>赫 Hz</strong>；电感=<strong>亨 H</strong>；电容=<strong>法 F</strong>；电量=<strong>库 C</strong>。</p>\n<hr>","chapters":["4.1.3"],"qIds":["MC1-0941","MC1-0942","MC1-0943","MC1-0944","MC1-0945","MC1-0946","MC1-0947","MC1-0948","MC1-0949","MC1-0950","MC1-0951","MC1-0952","MC1-0953","MC1-0954","MC1-0955"],"qCount":15},{"id":30,"part":27,"partName":"电学基础、设备与测量","partOrd":"五","title":"射频/音频/接口阻抗","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>必背</strong>：<strong>音频范围 16 Hz – 20 kHz</strong>；<strong>接口阻抗 50/75/600 Ω</strong>（通信/电视/音频）；音频位于 <strong>VLF – MF</strong> 多个频带（<strong>不是</strong> VHF）。</li></ul></blockquote>\n<p><strong>频段缩写英文对照</strong>（<strong>A 类高频考点</strong>——题目用中英两种表述都出过）：</p>\n<table><thead><tr><th>缩写</th><th>英文原文</th><th>中文</th><th>频率范围</th></tr></thead><tbody><tr><td><strong>ELF</strong></td><td><strong>E</strong>xtremely <strong>L</strong>ow <strong>F</strong>requency</td><td>极低频</td><td>3–30 Hz</td></tr><tr><td><strong>SLF</strong></td><td><strong>S</strong>uper <strong>L</strong>ow <strong>F</strong>requency</td><td>超低频</td><td>30–300 Hz</td></tr><tr><td><strong>ULF</strong></td><td><strong>U</strong>ltra <strong>L</strong>ow <strong>F</strong>requency</td><td>特低频</td><td>300–3000 Hz</td></tr><tr><td><strong>VLF</strong></td><td><strong>V</strong>ery <strong>L</strong>ow <strong>F</strong>requency</td><td>甚低频（甚长波）</td><td>3–30 kHz</td></tr><tr><td><strong>LF</strong></td><td><strong>L</strong>ow <strong>F</strong>requency</td><td>低频（长波）</td><td>30–300 kHz</td></tr><tr><td><strong>MF</strong></td><td><strong>M</strong>edium <strong>F</strong>requency</td><td>中频（中波）</td><td>300 kHz–3 MHz</td></tr><tr><td><strong>HF</strong></td><td><strong>H</strong>igh <strong>F</strong>requency</td><td>高频（短波）</td><td>3–30 MHz</td></tr><tr><td><strong>VHF</strong></td><td><strong>V</strong>ery <strong>H</strong>igh <strong>F</strong>requency</td><td>甚高频（米波）</td><td>30–300 MHz</td></tr><tr><td><strong>UHF</strong></td><td><strong>U</strong>ltra <strong>H</strong>igh <strong>F</strong>requency</td><td>特高频（分米波）</td><td>300 MHz–3 GHz</td></tr><tr><td><strong>SHF</strong></td><td><strong>S</strong>uper <strong>H</strong>igh <strong>F</strong>requency</td><td>超高频（厘米波）</td><td>3–30 GHz</td></tr><tr><td><strong>EHF</strong></td><td><strong>E</strong>xtremely <strong>H</strong>igh <strong>F</strong>requency</td><td>极高频（毫米波）</td><td>30–300 GHz</td></tr><tr><td><strong>THF</strong></td><td><strong>T</strong>remendously <strong>H</strong>igh <strong>F</strong>requency</td><td>至高频（亚毫米波）</td><td>300 GHz–3 THz</td></tr></tbody></table>\n<p><strong>通用术语</strong>：</p>\n<ul><li><strong>RF = Radio Frequency</strong> 射频（无线电频率）</li><li><strong>AF = Audio Frequency</strong> 音频</li><li><strong>IF = Intermediate Frequency</strong> 中频</li><li><strong>BFO = Beat Frequency Oscillator</strong> 拍频振荡器</li></ul>\n<p>[Qs: 956–960]</p>\n<hr>","chapters":["4.1.3"],"qIds":["MC1-0956","MC1-0957","MC1-0958","MC1-0959","MC1-0960","MC1-0961","MC1-0962","MC1-0963","MC1-0964"],"qCount":9},{"id":31,"part":27,"partName":"电学基础、设备与测量","partOrd":"五","title":"电源","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：可充 vs 不可充；正负极方向。</li><li><strong>必背</strong>：①可充电池 = <strong>锂离子 / 钠离子 / 铅酸</strong>；<strong>碱性干电池不可充</strong>；②电网停电充铅酸 → <strong>与汽车电瓶并联后发动车辆</strong>；③电池供电时长 = <strong>标称安时 / 平均工作电流</strong>；④<strong>电动势方向：负→正</strong>（内电路）；<strong>电压方向：正→负</strong>（外电路）；⑤反极保护 = <strong>PN 结单向导电 + 熔丝 + 反向二极管</strong>。</li><li><strong>易错</strong>：复位按钮（极性反保护按钮）→ ①过流切断 / ②极性反切断（<strong>不是</strong>过温/过压）。</li></ul></blockquote>\n<p>[Qs: 965–974]</p>\n<hr>","chapters":["4.1.4"],"qIds":["MC4-0965","MC1-0966","MC1-0967","MC3-0968","MC3-0969","MC1-0970","MC1-0971","MC1-0972","MC1-0973","MC2-0974"],"qCount":10},{"id":32,"part":27,"partName":"电学基础、设备与测量","partOrd":"五","title":"测量仪表 / 万用表","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>必背</strong>：①直流电压档测正负对称方波 → <strong>读数=零</strong>；②指针式直流电压档测 0–V 方波 → 读数 = <strong>峰值/2 = 有效值</strong>；③电阻档读数由小变大 → <strong>测到大电容</strong>（充电过程）；④\"欧姆/伏\"越大 → 测量对电路<strong>影响越小</strong>；⑤测电解电容 → <strong>指针式电阻档 + 数字电容档</strong>。</li><li><strong>易错</strong>：数字电压档测音频后交换表笔极性反转 → <strong>叠加了直流成分</strong>。</li></ul></blockquote>\n<p>[Qs: 1298–1305]</p>\n<hr>","chapters":["4.6.1"],"qIds":["MC1-1298","MC1-1299","MC1-1300","MC1-1301","MC2-1302","MC1-1303","MC1-1304","MC1-1305"],"qCount":8},{"id":33,"part":33,"partName":"安全与法规收尾","partOrd":"六","title":"频率容限 & 杂散发射","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：业余设备必备 = <strong>频率容限 + 杂散发射</strong>。</li><li><strong>必背</strong>：①频率容限 = 中心频率/特征频率偏离指配/参考频率的最大容许偏差；单位 <strong>ppm 或 Hz</strong>；②杂散发射 = 必要带宽外辐射 + 含<strong>谐波/寄生/互调/变频产物</strong>（<strong>带外发射不属于杂散</strong>！）；③杂散单位 <strong>dBm / dBc / dB</strong>；④<strong>减幅波辐射来源 = 电路接触点打火</strong>；⑤<strong>ITU 禁止阻尼波</strong>。</li><li><strong>易错</strong>：题干\"杂散\"与\"带外\"经常混选项，看清！</li></ul></blockquote>\n<p><strong>单位英文对照</strong>：</p>\n<table><thead><tr><th>单位</th><th>英文原文</th><th>含义</th></tr></thead><tbody><tr><td><strong>ppm</strong></td><td><strong>p</strong>arts <strong>p</strong>er <strong>m</strong>illion</td><td>百万分之几</td></tr><tr><td><strong>dB</strong></td><td><strong>d</strong>eci<strong>B</strong>el</td><td>分贝（10 倍以 10 为底对数）</td></tr><tr><td><strong>dBm</strong></td><td>dB referenced to 1 <strong>m</strong>illi<strong>w</strong>att</td><td>相对 1 mW 的功率分贝绝对值</td></tr><tr><td><strong>dBc</strong></td><td>dB relative to <strong>c</strong>arrier</td><td>相对载波功率的分贝差值</td></tr><tr><td><strong>dBμV</strong></td><td>dB referenced to 1 <strong>μV</strong></td><td>相对 1 μV 的电压分贝值</td></tr><tr><td><strong>PEP</strong></td><td><strong>P</strong>eak <strong>E</strong>nvelope <strong>P</strong>ower</td><td>峰包功率</td></tr><tr><td><strong>EIRP</strong></td><td><strong>E</strong>ffective <strong>I</strong>sotropic <strong>R</strong>adiated <strong>P</strong>ower</td><td>等效全向辐射功率</td></tr><tr><td><strong>GB</strong></td><td><strong>G</strong>uo<strong>B</strong>iao 国标</td><td>中国国家标准</td></tr></tbody></table>\n<p>[Qs: 1345–1352]</p>\n<hr>","chapters":["5.1.1"],"qIds":["MC1-1345","MC1-1346","MC2-1347","MC2-1348","MC3-1349","MC3-1350","MC1-1351","MC1-1352"],"qCount":8},{"id":34,"part":33,"partName":"安全与法规收尾","partOrd":"六","title":"电磁辐射环境","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：GB 8702-2014 公众曝露管理限值。</li><li><strong>必背</strong>：免管理：①<strong>0.1–3 MHz</strong> 等效辐射功率 <strong>&lt; 300 W</strong>；②<strong>3 MHz – 300 GHz</strong> 等效辐射功率 <strong>&lt; 100 W</strong>；③<strong>公众曝露 = 公众所受全部电场/磁场/电磁场照射</strong>（不含职业、医疗）；④<strong>VHF/UHF = 非电离辐射</strong>。</li><li><strong>易错</strong>：限值随频率变化原因 = <strong>人体对某些波长吸收更多</strong>。</li></ul></blockquote>\n<p>[Qs: 1353–1357]</p>\n<hr>","chapters":["5.1.2"],"qIds":["MC2-1353","MC1-1354","MC1-1355","MC3-1356","MC1-1357"],"qCount":5},{"id":35,"part":33,"partName":"安全与法规收尾","partOrd":"六","title":"防雷","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：接闪器 + 引下线 + 接地体。</li><li><strong>必背</strong>：①防雷接地作用 = <strong>把雷击电流泄入大地</strong>；②要求 = <strong>单独接地体 + 接地电阻小 + 引下线短而粗</strong>；③避雷针保护范围 = <strong>60 m 半径滚球曲线</strong>；④接地材料首选 = <strong>镀银软铜丝编织扁带</strong>；⑤铁塔接地 = <strong>尽可能短而直</strong>（不直角弯，地装不远离塔）。</li><li><strong>易错</strong>：①<strong>不能</strong>用自来水管 / 交流零线代替防雷接地；②同轴避雷器 → <strong>所有地线接到同一金属条带</strong>再连接地。</li></ul></blockquote>\n<p>[Qs: 1358–1364]</p>\n<hr>","chapters":["5.1.3"],"qIds":["MC1-1358","MC1-1359","MC1-1360","MC1-1361","MC1-1362","MC1-1363","MC1-1364"],"qCount":7},{"id":36,"part":33,"partName":"安全与法规收尾","partOrd":"六","title":"用电安全","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>核心</strong>：低压限值 + 触电检修规范。</li><li><strong>必背</strong>：①<strong>ELV = E</strong>xtra-<strong>L</strong>ow <strong>V</strong>oltage（特低电压）潮湿限值 = <strong>交流 16 V / 直流 33 V</strong>；②<strong>触电检修：双脚绝缘 + 单手操作 + 另一手不碰机壳</strong>；③外壳带电预防 = 金属机箱接地 + 漏电保护器 + 三线插头确认接地；④220 V 自制最低安全 = <strong>火线串联保险丝</strong>；⑤拔电源线仍有风险 = <strong>电容器存高压</strong>。</li><li><strong>易错</strong>：①<strong>自来水管不能</strong>作公共地线；②工频威胁 &gt; HF &gt; UHF（频率越高皮肤效应越强，致死风险下降但灼伤上升）。</li></ul></blockquote>\n<p>[Qs: 1365–1372]</p>\n<hr>","chapters":["5.1.4"],"qIds":["MC1-1365","MC1-1366","MC1-1367","MC1-1368","MC3-1369","MC1-1370","MC1-1371","MC3-1372"],"qCount":8},{"id":37,"part":33,"partName":"安全与法规收尾","partOrd":"六","title":"电池 / 火灾","body":"<blockquote><p><strong>⚡ 速记</strong></p>\n<ul><li><strong>必背</strong>：①12 V 铅酸主要风险 = <strong>通风不良时爆炸性气体聚集</strong>（<strong>不是</strong>触电）；②充放过快 = <strong>过热 + 释氢 + 爆炸风险</strong>；③<strong>电气火灾用 CO₂ 或干粉</strong>（<strong>不用水、不用泡沫</strong>！）。</li></ul></blockquote>\n<p>[Qs: 1373–1375]</p>\n<hr>","chapters":["5.1.5"],"qIds":["MC1-1373","MC1-1374","MC1-1375"],"qCount":3}];
const QUESTIONS = [{"i":"MC2-0001","p":"1.1.1","q":"我国专门针对无线电管理的行政法规及其制定机构是：","a":"AC","A":"《中华人民共和国无线电管理条例》","B":"《中华人民共和国无线电管理办法》","C":"国务院和中央军委","D":"工业和信息化部","n":2,"img":""},{"i":"MC2-0002","p":"1.1.1","q":"我国专门针对业余无线电台的管理文件及其制定机构分别是：","a":"AC","A":"《业余无线电台管理办法》","B":"《业余无线电台管理暂行规定》","C":"工业和信息化部","D":"国务院","n":2,"img":""},{"i":"MC1-0003","p":"1.1.1","q":"我国依法负责对业余无线电台实施监督管理的机构是：","a":"A","A":"国家无线电管理机构和省、自治区、直辖市无线电管理机构","B":"在国家或地方民政部门注册的业余无线电协会","C":"国家体育管理机构和地方体育管理机构","D":"国家和地方公安部门","n":1,"img":""},{"i":"MC1-0004","p":"1.1.1","q":"我国对无线电管理术语“业余业务”、“卫星业余业务”和“业余电台”做出具体定义的法规文件是：","a":"A","A":"《中华人民共和国无线电频率划分规定》","B":"《中华人民共和国无线电管理条例》","C":"《中华人民共和国电信条例》","D":"《无线电台执照管理规定》","n":1,"img":""},{"i":"MC1-0005","p":"1.1.1","q":"最新发布的《业余无线电台管理办法》自何时开始施行：","a":"A","A":"自 2024 年 3 月 1 日起施行","B":"自 2024 年 12 月 1 日起施行","C":"自 2025 年 3 月 1 日起施行","D":"自 2025 年 12 月 1 日起施行","n":1,"img":""},{"i":"MC1-0006","p":"1.1.2","q":"将某个特定的频段列入频率划分表，规定该频段可在指定的条件下供一种或多种地面或空间无线电通信业务或射电天文业务使用，这个过程称为：","a":"A","A":"划分","B":"分配","C":"指配","D":"授权","n":1,"img":""},{"i":"MC1-0007","p":"1.1.2","q":"将无线电频率或频道规定由一个或多个部门，在指定的区域内供地面或空间无线电通信业务在指定条件下使用，这个过程称为：","a":"A","A":"分配","B":"划分","C":"指配","D":"授权","n":1,"img":""},{"i":"MC1-0008","p":"1.1.2","q":"将无线电频率或频道批准给无线电台在规定条件下使用，这个过程称为：","a":"A","A":"指配","B":"划分","C":"分配","D":"授权","n":1,"img":""},{"i":"MC1-0009","p":"1.1.2","q":"在频率划分表中，一个频段被标明划分给多种业务时，这些业务被分为下述类别：","a":"A","A":"主要业务和次要业务","B":"业余业务和非业余业务","C":"民用业务和军用业务","D":"安全业务和一般业务","n":1,"img":""},{"i":"MC1-0010","p":"1.1.2","q":"辐射（radiation）是指任何源的能量流以无线电波的形式向外发出。正确的说法是：","a":"A","A":"闪电产生的电磁波干扰是一种辐射","B":"沿电源线窜入接收机的差模干扰是一种辐射","C":"射频电路中变压器内磁芯里的磁场是一种辐射","D":"射频电路中电容器内极板间的电场是一种辐射","n":1,"img":""},{"i":"MC1-0011","p":"1.1.2","q":"发射（emission）是指：由无线电发信电台产生的辐射或辐射产物。正确的说法是：","a":"A","A":"业余电台向周围发送的杂散产物是一种发射","B":"无线电接收机本地振荡器辐射的能量是一种发射","C":"医用高频电疗机向周围发送的无线电波能量是一种发射","D":"闪电产生的电磁波干扰是一种发射","n":1,"img":""},{"i":"MC4-0012","p":"1.1.2","q":"下列关于无线电的一般术语，说法正确的是：","a":"ABCD","A":"无线电测定是指利用无线电波的传播特性测定目标的位置、速度和/或其他特性，或获得与这些参数有关的信息","B":"无线电导航是指用于导航（包括障碍物告警）的无线电测定","C":"无线电定位是指用于除无线电导航以外的无线电测定","D":"无线电测向是指利用接收无线电波来确定一个电台或目标的方向的无线电测定","n":4,"img":""},{"i":"MC1-0013","p":"1.1.2","q":"关于业余无线电台，下列说法正确的是：","a":"A","A":"业余无线电台是指为开展业余业务（含卫星业余业务）使用的一个或者多个发信机、收信机，或者发信机与收信机的组合（包括附属设备）","B":"一个业余无线电台只能包含一个发信机","C":"一个业余无线电台只能包含一个收信机","D":"一个业余无线电台只能包含一个发信机和一个收信机","n":1,"img":""},{"i":"MC1-0014","p":"1.1.2","q":"关于业余业务、卫星业余业务，下列说法正确的是：","a":"AB","A":"业余业务是指供业余无线电爱好者进行自我训练、相互通信和技术研究的无线电通信业务","B":"卫星业余业务是指利用地球卫星上的空间电台开展与业余业务相同目的的无线电通信业务","C":"业余无线电爱好者可以在业余业务、卫星业余业务以及其他的无线电业务相互通信","D":"业余无线电台可以在业余业务、卫星业余业务以及其他的无线电业务进行通信","n":2,"img":""},{"i":"MC2-0015","p":"1.1.2","q":"关于业余无线电爱好者的定义，下列说法正确的是：","a":"AB","A":"业余无线电爱好者系指经正式批准的、对无线电技术有兴趣的人","B":"其兴趣纯系个人爱好而不涉及谋取利润","C":"其兴趣纯系个人爱好可涉及谋取利润","D":"只有成年人能成为业余无线电爱好者","n":2,"img":""},{"i":"MC1-0016","p":"1.1.2","q":"关于发射类别，下列说法正确的是：","a":"AB","A":"是指用标准符号标示的某发射的一组特性","B":"标示的特性包含主载波调制方式，调制信号，被发送信息的类型以及其他适用的信号特性","C":"一个业余无线电台只能包含一个收信机","D":"一个业余无线电台只能包含一个发信机和一个收信机","n":2,"img":""},{"i":"MC1-0017","p":"1.1.2","q":"关于单边带发射，下列说法正确的是：","a":"A","A":"单边带发射是只传送一个边带的调幅发射","B":"单边带发射是只传送一个边带的调频发射","C":"单边带发射是不传送载波的调幅发射","D":"单边带发射是不传送载波的调频发射","n":1,"img":""},{"i":"MC3-0018","p":"1.1.2","q":"关于干扰的定义，下列说法正确的是：","a":"ABC","A":"由于一种或多种发射、辐射、感应或其组合所产生的无用能量对无线电通信系统的接收产生的影响","B":"表现为性能下降、误解或信息丢失","C":"若不存在这种无用能量，则此后果可以避免","D":"不会对无线电通信系统的接收产生的影响","n":3,"img":""},{"i":"MC2-0019","p":"1.1.2","q":"关于有害干扰的定义，下列说法正确的是：","a":"AB","A":"危害无线电导航或其他安全业务的正常运行的干扰","B":"严重地损害、阻碍、或一再阻断按规定正常开展的无线电通信业务的干扰","C":"产生有害干扰不会受到处罚","D":"使用业余无线电台时，只要不对其他业余无线电台产生干扰即可","n":2,"img":""},{"i":"MC3-0020","p":"1.1.2","q":"关于次要业务台站，下列说法正确的是：","a":"ABC","A":"不得对业经指配或将来可能指配频率的主要业务电台产生有害干扰","B":"不得对来自业经指配或将来可能指配频率的主要业务电台的有害干扰提出保护要求","C":"可要求保护不受来自将来可能指配频率的同一业务或其他次要业务电台的有害干扰","D":"使用业余无线电台时，只要不对其他业余无线电台产生干扰即可","n":3,"img":""},{"i":"MC1-0021","p":"1.1.2","q":"协调国际无线电管理的国际组织是：","a":"A","A":"国际电信联盟","B":"国际业余无线电联盟","C":"联合国大会","D":"联合国科教文组织","n":1,"img":""},{"i":"MC1-0022","p":"1.1.2","q":"国际业余无线电联盟支持会员协会在发展业余无线电时把它看成一种：","a":"A","A":"国家资源","B":"拉动经济的措施","C":"休闲娱乐手段","D":"国防后备队伍","n":1,"img":""},{"i":"MC1-0023","p":"1.1.2","q":"下述通信不属于电信（telecommunication）范畴：","a":"A","A":"邮政通信","B":"有线通信","C":"无线电通信","D":"光通信","n":1,"img":""},{"i":"MC1-0024","p":"1.1.2","q":"关于无线电通信的正确说法：","a":"A","A":"无线电通信是指利用无线电波进行的符号、信号、文字、图像、声音或其他信息的传输、发射或接收","B":"无线电通信包括利用光在内的所有电磁波所进行的各种通信","C":"利用无线电波进行的符号、信号、文字、图像、声音以外的信息传输不属于无线电通信","D":"产生无线电波并用其加热属于无线电通信的一种应用","n":1,"img":""},{"i":"MC1-0025","p":"1.1.2","q":"关于地面无线电通信（terrestrial radio communication）的正确说法是：","a":"A","A":"航空通信属于地面无线电通信","B":"水上通信不属于地面无线电通信","C":"业余电台之间所进行的任何无线电通信都属于地面无线电通信","D":"依靠电离层反射的天波所进行的通信不属于地面无线电通信","n":1,"img":""},{"i":"MC1-0026","p":"1.1.2","q":"无线电波是指：","a":"A","A":"频率为 3,000GHz 以下的在空间传播的电磁波","B":"频率为 3,000GHz 以下的所有电磁波","C":"频率为 30Hz 至 30GHz 的在空间传播的电磁波","D":"频率为 3,000Hz 至 3,000MHz 的电磁波","n":1,"img":""},{"i":"MC3-0027","p":"1.2.1","q":"个人设置、使用业余无线电台应当向无线电管理机构提交的材料为：","a":"ABC","A":"一份申请表","B":"身份证明复印件；申请人为未成年人的，还应当提交其监护人身份证明复印件，以及申请人与监护人关系的说明材料","C":"无线电发射设备相关说明材料","D":"本人写的申请书，操作证书的原件、复印件","n":3,"img":""},{"i":"MC3-0028","p":"1.2.1","q":"单位设置、使用业余无线电台应当向无线电管理机构提交的材料为：","a":"ABC","A":"一份申请表","B":"无线电发射设备相关说明材料","C":"单位营业执照等复印件，以及业余无线电台技术负责人为本单位工作人员的说明材料","D":"业余无线电台技术负责人写的申请书，操作证书的原件、复印件","n":3,"img":""},{"i":"MC4-0029","p":"1.2.1","q":"设置、使用业余无线电台，下列哪些条件符合规定：","a":"ABCD","A":"使用的无线电发射设备依法取得型号核准","B":"型号核准证载明的频率范围包含业余业务频段","C":"使用的自制、改装、拼装等未取得型号核准的无线电发射设备符合国家标准和国家无线电管理规定","D":"使用的自制、改装、拼装等未取得型号核准的无线电发射设备的无线电发射频率范围仅限于业余业务频段","n":4,"img":""},{"i":"MC1-0030","p":"1.2.1","q":"设置、使用业余无线电台拟使用自制、改装、拼装等未取得型号核准的无线电发射设备的，无线电管理机构开展对该设备进行技术检测时：","a":"A","A":"不得收取任何费用","B":"收取技术检测费","C":"根据业余无线电台类型进行收费","D":"根据爱好者操作类别进行收费","n":1,"img":""},{"i":"MC2-0031","p":"1.2.1","q":"设置、使用 15 瓦以上短波业余无线电台以及涉及国家主权、安全的其他重要业余无线电台的，下列说法正确的是：","a":"AB","A":"由国家无线电管理机构作出许可决定","B":"可以委托电台所在地或者申请人住所地的省、自治区、直辖市无线电管理机构对业余无线电台的使用方式、技术条件、安装环境等进行现场核查","C":"由省、自治区、直辖市无线电管理机构作出许可决定","D":"持有 A 类业余无线电台操作技术能力验证证书即可申请","n":2,"img":""},{"i":"MC4-0032","p":"1 照新版《办法》中 B 类业余无线电台操作技术能力验证规定的范围设置、使用电台","D":"新版《办法》施行前取得的 B 类业余无线电台操作技术能力验证证书不再有效","n":2,"img":""},{"i":"MC3-0072","p":"1.4.1","q":"《业余无线电台管理办法》规定正确使用业余无线电台呼号的方法是：","a":"ABC","A":"使用业余无线电台的单位或者个人应当在每次通信建立及结束时发送本业余无线电台呼号","B":"在通信过程中不定期（间隔不超过 10 分钟）发送本业余无线电台呼号","C":"鼓励业余无线电台在通联期间通过技术手段自动发送电台呼号","D":"使用业余无线电台的单位或者个人在通信中可以用姓名、代号、适当的别名或者法规定呼号的部分数字和字母代替完整的业余电台呼号作为电台的标识","n":3,"img":""},{"i":"MC1-0073","p":"1.4.1","q":"业余无线电台呼号的核发流程是：","a":"A","A":"无线电管理机构颁发业余无线电台执照，应当同时向申请人核发业余无线电台呼号","B":"在向无线电管理机构委托的受理服务机构提交设台申请窗口后，由服务机构核发呼号","C":"无线电管理机构核发业余无线电台执照后，由申请人再向其申请核发呼号","D":"业余无线电台设台人在提交设台申请的同时提出所要求指配的呼号，经服务机构同意后，报无线电管理机构正式核发","n":1,"img":""},{"i":"MC1-0074","p":"1.4.1","q":"无线电管理机构颁发业余无线电台执照时，若申请人已取得业余中继台、业余信标台呼号以外的其他业余无线电台呼号，无线电管理机构将：","a":"A","A":"无线电管理机构不再核发新的业余无线电台呼号","B":"由申请人再向其申请核发呼号，无线电管理机构将核发新的业余无线电台呼号","C":"无线电管理机构向其更换业余无线电台呼号","D":"业余无线电台设台人在提交设台申请的同时提出所要求指配的呼号，经服务机构同意后，报无线电管理机构正式核发","n":1,"img":""},{"i":"MC2-0075","p":"1.4.1","q":"业余无线电台呼号停止使用的，下列说法正确的是：","a":"AB","A":"业余无线电台呼号停止使用的，应当依法予以注销","B":"除业余中继台、业余信标台呼号外，其他业余无线电台呼号注销 1 年后，无线电管理机构可以将相关电台呼号重新投入分配","C":"业余无线电台呼号停止使用的，不用申请注销","D":"除业余中继台、业余信标台呼号外，其他业余无线电台呼号注销后，无线电管理机构可立即将相关电台呼号重新投入分配","n":2,"img":""},{"i":"MC1-0076","p":"1.4.1","q":"注销的电台呼号重新投入分配前，申请人再次申请设置、使用业余无线电台，下列说法正确的是：","a":"A","A":"无线电管理机构经审查决定颁发业余无线电台执照的，应当同时核发申请人已注销的电台呼号","B":"无线电管理机构经审查决定颁发业余无线电台执照的，应当同时核发新的的电台呼号","C":"电台呼号注销后，将不再向申请人核发电台呼号","D":"电台呼号注销后，申请人不能再次申请设置、使用业余无线电台","n":1,"img":""},{"i":"MC2-0077","p":"1.4.1","q":"在他人依法设置的业余无线电台上进行发射操作的，下列说法正确的是：","a":"AB","A":"应当使用所操作业余无线电台的呼号或者实际操作人员取得的呼号","B":"使用实际操作人员取得的呼号的，业余无线电台通联期间发送呼号的格式应当符合国内国际相关要求","C":"不可在他人依法设置的业余无线电台上进行发射操作","D":"业余无线电爱好者只能在自己设置的业余无线电台上进行发射操作","n":2,"img":""},{"i":"MC3-0078","p":"1.4.1","q":"满足下列哪些条件，可以临时使用其他业余无线电台呼号？","a":"ABC","A":"参加或者举办业余无线电通联比赛以及其他重大业余无线电活动","B":"经比赛（活动）主办方（牵头单位）报国家无线电管理机构批准","C":"其他业余无线电台呼号符合国际规则","D":"何时何地都不能临时使用其他业余无线电台呼号","n":3,"img":""},{"i":"MC4-0079","p":"1.4.1","q":"关于业余无线电台呼号，下列说法正确的是：","a":"ABCD","A":"呼号第一部分为呼号前缀","B":"呼号第二部分为电台种类","C":"呼号第三部分为分区编号","D":"呼号第四部分为呼号后缀","n":4,"img":""},{"i":"MC2-0080","p":"1.4.1","q":"关于业余无线电台呼号前缀，下列说法正确的是：","a":"AB","A":"呼号前缀（呼号第一部分）由一位字母组成","B":"为国际电信联盟分配的呼号前缀字母 B","C":"为国际电信联盟分配的呼号前缀字母 BA","D":"为国际电信联盟分配的呼号前缀字母 A","n":2,"img":""},{"i":"MC4-0081","p":"1.4.1","q":"关于电台种类（呼号第二部分），下列说法正确的是：","a":"ABCD","A":"字母 G、H、I、D、A、B、C、E、F、K、L 用于一般业余无线电台呼号","B":"字母 J 用于空间业余无线电台呼号","C":"字母 R 用于业余中继台和业余信标台呼号","D":"字母 S、T、Y、Z 以及其他字母序列的业余无线电台呼号由国家无线电管理机构保留","n":4,"img":""},{"i":"MC3-0082","p":"1.4.1","q":"关于分区编号（呼号第三部分），下列说法正确的是：","a":"ABC","A":"由一位数字组成","B":"用于表示业余无线电台分区号","C":"空间业余无线电台分区号为 1","D":"空间业余无线电台分区号为 2","n":3,"img":""},{"i":"MC3-0083","p":"1.4.1","q":"关于呼号后缀（呼号第四部分），下列说法正确的是：","a":"ABC","A":"由 1～4 位的字母或者字母和数字的组合组成","B":"1 位、4 位呼号后缀，以及带有数字的呼号后缀由国家无线电管理机构保留","C":"QOA～QUZ 及 SOS、XXX、TTT 等可能与遇险信号或类似性质的其他信号混淆的字母组合不用作呼号后缀","D":"呼号后缀由 1～4 位数字组成","n":3,"img":""},{"i":"MC3-0084","p":"1.4.1","q":"各省、自治区、直辖市无线电管理机构核发一般业余无线电台呼号时，下列说法正确的是：","a":"ABC","A":"呼号第二部分按照 G、H、I、D、A、B、C、E、F、K、L 顺序","B":"第四部分按照双字母、三字母组合顺序依次编制并核发业余无线电台呼号","C":"各省、自治区、直辖市无线电管理机构核发的业余无线电台呼号前缀都相同","D":"各省、自治区、直辖市无线电管理机构核发的业余无线电台呼号的分区号都相同","n":3,"img":""},{"i":"MC1-0085","p":"1.4.1","q":"业余无线电爱好者对已核发给自己的电台呼号不满意，是否可以申请另行核发业余无线电台呼号？","a":"A","A":"不可以。颁发业余无线电台执照的无线电管理机构已经为申请人核发业余无线电台呼号的，不另行核发其他业余无线电台呼号","B":"更新所设置的业余无线电台类别时可以申请另行核发业余无线电台呼号","C":"可以申请另行核发业余无线电台呼号，但须缴纳额外的费用","D":"业余无线电台执照有效期届满、设台人向核发执照的无线电管理机构申请办理延续手续时可以申请另行核发业余无线电台呼号","n":1,"img":""},{"i":"MC1-0086","p":"1.4.1","q":"各地业余无线电台呼号前缀字母和后缀字符的可用范围的确定方法是：","a":"A","A":"由国家无线电管理机构编制和分配","B":"地方无线电管理机构根据当地呼号资源的使用情况自行分配","C":"地方无线电民间组织提出建议，当地无线电管理机构批准","D":"由业余无线电爱好者根据需求提出建议，当地无线电管理机构批准","n":1,"img":""},{"i":"MC3-0087","p":"1.4.1","q":"关于使用业余无线电台呼号正确的是：","a":"ABC","A":"应当在每次通信建立时主动发送（报出）本台业余无线电台呼号","B":"应当在每次通信结束时主动发送（报出）本台业余无线电台呼号","C":"应当在每次通信过程中每十分钟发送（报出）本台业余无线电台呼号","D":"应当在每次通信过程中主动发送（报出）自造的呼号作为本台业余无线电台呼号的补充","n":3,"img":""},{"i":"MC4-0088","p":"1.4.1","q":"业余无线电台呼号由下列哪些部分组成：","a":"ABCD","A":"呼号前缀","B":"电台种类","C":"分区编号","D":"呼号后缀","n":4,"img":""},{"i":"MC1-0089","p":"1.4.1","q":"《业余无线电台管理办法》要求业余电台在建立和结束通信时主动发送本台呼号。允许使用呼号的一部分（比如后缀）替代完整呼号的情况包括：","a":"A","A":"在任何情况下都必须使用完整的呼号","B":"联络相识的友台时可将呼号的后缀用作电台标识","C":"在 VHF/UHF 等本地频段建立通信时可将呼号的后缀用作电台标识","D":"在 HF 频段联络国内电台时可将呼号的后缀用作电台标识，但是 DX 联络不可以","n":1,"img":""},{"i":"MC1-0090","p":"1.4.1","q":"在业余无线电通联中，是否可将本台或对方电台呼号之中的地区码加后缀视作《业余无线电台管理办法》中的“电台呼号”？","a":"A","A":"不可以。这是对呼号的不完整表述。其不具标识意义，不能视作电台呼号","B":"与熟悉的友台通联就可以使用这种不完整呼号。这就如同将对方称为 OM","C":"在 VHF/UHF 等频段进行通联可以使用这种不完整呼号。这会增加亲切感","D":"在 HF 进行国内通联可以使用这种不完整呼号。但是如遇 DX 电台则不可以","n":1,"img":""},{"i":"MC1-0091","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 1 的省（自治区、直辖市）为：","a":"A","A":"北京","B":"黑龙江","C":"河北","D":"上海","n":1,"img":""},{"i":"MC3-0092","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 2 的省（自治区、直辖市）为：","a":"ABC","A":"黑龙江","B":"吉林","C":"辽宁","D":"广东","n":3,"img":""},{"i":"MC4-0093","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 3 的省（自治区、直辖市）为：","a":"ABCD","A":"天津","B":"内蒙古","C":"河北","D":"山西","n":4,"img":""},{"i":"MC3-0094","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 4 的省（自治区、直辖市）为：","a":"ABC","A":"上海","B":"山东","C":"江苏","D":"海南","n":3,"img":""},{"i":"MC3-0095","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 5 的省（自治区、直辖市）为：","a":"ABC","A":"浙江","B":"江西","C":"福建","D":"广西","n":3,"img":""},{"i":"MC3-0096","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 6 的省（自治区、直辖市）为：","a":"ABC","A":"安徽","B":"河南","C":"湖北","D":"四川","n":3,"img":""},{"i":"MC4-0097","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 7 的省（自治区、直辖市）为：","a":"ABCD","A":"湖南","B":"广东","C":"广西","D":"海南","n":4,"img":""},{"i":"MC4-0098","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 8 的省（自治区、直辖市）为：","a":"ABCD","A":"四川","B":"重庆","C":"贵州","D":"云南","n":4,"img":""},{"i":"MC4-0099","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 9 的省（自治区、直辖市）为：","a":"ABCD","A":"陕西","B":"甘肃","C":"宁夏","D":"青海","n":4,"img":""},{"i":"MC2-0100","p":"1.4.2","q":"关于我国业余无线电台分区号，业余分区号为 0 的省（自治区、直辖市）为：","a":"AB","A":"新疆","B":"西藏","C":"上海","D":"重庆","n":2,"img":""},{"i":"MC1-0105","p":"1.5.1","q":"合法设置、使用业余电台的必要步骤是：","a":"A","A":"按照《业余无线电台管理办法》的规定向无线电管理机构提出申请，取得业余无线电台执照","B":"加入指定的业余无线电民间组织，并按其章程规定的办法办理申请手续","C":"经过业余无线电协会或无线电运动协会同意","D":"经过所在单位或居委会批准","n":1,"img":""},{"i":"MC1-0106","p":"1.5.1","q":"业余无线电台的法定用途为：","a":"A","A":"用于相互通信、技术研究和自我训练","B":"供公民在业余时间进行与个人生活事务有关的通信","C":"供公民在业余时间进行休闲娱乐","D":"供私家车主或者相应组织作为行车安全保障和途中消遣工具","n":1,"img":""},{"i":"MC1-0107","p":"1.5.1","q":"申请设置使用配备有多台业余无线电发射设备的业余无线电台，应该：","a":"A","A":"视为一个业余电台，指配一个电台呼号，但所有设备均应经过核定并将参数载入电台执照","B":"视为一个业余电台，指配一个电台呼号，其中只需有一台设备加以核定并将参数载入电台执照","C":"每台设备视为一个业余电台，各指配一个电台呼号，并都应经过核定并将参数载入电台执照","D":"视为一个业余电台，指配一个电台呼号，每个频段选择一台设备加以核定并将参数载入电台执照","n":1,"img":""},{"i":"MC1-0108","p":"1.5.1","q":"业余中继台必备的技术措施为：","a":"A","A":"设专人负责监控和管理工作，配备有效的遥控手段，保证造成有害干扰时及时停止发射","B":"技术加密措施，防止未经设台人允许的业余无线电台启用中继","C":"尽量提高发射功率，以便压制覆盖区内的其他强信号干扰","D":"设热备份系统，保证不间断工作","n":1,"img":""},{"i":"MC1-0109","p":"1.5.1","q":"某团体依法设置了一部业余中继台。其正确做法是：","a":"A","A":"向其覆盖区域内的所有业余无线电台提供平等的服务，并将使用业余中继台所需的各项技术参数公开","B":"中继台是设台者出资建设和维护的，因此仅供经设置者允许的业余电台使用","C":"中继台是设台者出资建设和维护的，因此仅供本团体成员优先使用，空闲时方供其他业余电台使用","D":"为保证中继台正常运行，要求覆盖区内所有业余电台缴纳维护成本，否则不准使用","n":1,"img":""},{"i":"MC1-0110","p":"1.5.1","q":"选择 144MHz 或 430MHz 业余模拟调频中继台同频段收发频差的原则是：","a":"A","A":"采用业余无线电标准频差，即 144MHz 频段 600kHz，430MHz 频段 5MHz","B":"尽量采用非标准频差以阻止一般业余无线电台占用","C":"采用经常变换频差的办法减少占用度","D":"可以在国家《无线电频率划分规定》所规定业余频率范围内任意选择","n":1,"img":""},{"i":"MC2-0111","p":"1.5.1","q":"业余无线电台使用的无线电发射设备必须符合下列条件：","a":"AB","A":"商品设备应依法取得型号核准，型号核准证载明的频率范围包含业余业务频段","B":"自制、改装、拼装设备应符合国家标准和国家无线电管理规定，且无线电发射频率范围仅限于业余业务频段","C":"自制、改装、拼装设备不受限制","D":"国外商品设备符合国际流行技术标准即可","n":2,"img":""},{"i":"MC1-0112","p":"1.5.1","q":"“我不是业余无线电爱好者，申请设置业余电台只是为了行车方便，不需要遵守业余无线电的规范”。这种说法：","a":"A","A":"是错误的，也是不具备“熟悉无线电管理规定”设台条件的表现","B":"有一定道理，既然行车通信有需求，法规管理应该迎合个人需求","C":"有一定道理，只要是遵守规定，业余电台也可以为非业余无线电爱好者所用","D":"很难说对错，业余电台的定义可以因人而异","n":1,"img":""},{"i":"MC1-0113","p":"1.5.2","q":"某业余电台操作者听到业余专用频率上出现某种显然出自非业余电台的人为干扰发射，于是按下话筒向该发射者宣传无线电管理法规知识。对这种做法的评论应该是：","a":"A","A":"错误；违反“业余无线电台只能用于相互通信、技术研究和自我训练”规定","B":"正确；但有干扰，不予提倡","C":"正确；抓机遇宣传法规，应该提倡","D":"正确；但需注意态度耐心、用语文明","n":1,"img":""},{"i":"MC1-0114","p":"1.5.2","q":"在业余无线电台中转发广播电台、互联网聊天、电话通话、其他电台的联络信号，这类行为的性质是：","a":"A","A":"错误行为；违反“业余无线电台只能用于相互通信、技术研究和自我训练”规定，因为通信中产生信息的一方不是业余无线电台","B":"正确行为；既然可以联络，不必要限制向话筒送什么内容","C":"如果转发的目的是进行技术调试、用转发信号作为测试信号的话，就是正常行为","D":"不算错误但也不值得提倡","n":1,"img":""},{"i":"MC1-0115","p":"1.5.2","q":"业余电台在通信中为其他人或者单位、组织转达信息。对这种做法的评论应该是：","a":"A","A":"违法行为；违反“业余无线电台只能用于相互通信、技术研究和自我训练”的规定","B":"只要所转达的信息在内容上不违反《业余电台管理法规》的禁止规定就是合法行为","C":"只要转达信息是无偿的，就是合法行为","D":"只要所转达的信息是有利于社会的公益信息，就是合法行为","n":1,"img":""},{"i":"MC1-0116","p":"1.5.2","q":"某业余无线电协会在发射操作中向其会员播发公益性通知和技术训练讲座，但未得到相应无线电管理机构的批准。对这种做法的评论应该是：","a":"A","A":"违法行为；违反“未经批准，业余无线电台不得以任何方式进行广播或者发射通播性质的信号”的规定","B":"只要所播发的通知或讲座有利于当地业余无线电爱好者技术水平的提高，不能算违法行为","C":"只要所播发的通知或讲座有利于当地业余无线电应急通信训练，不能算违法行为","D":"只要所播发的通知或讲座是涉及宣传业余电台管理知识的，不能算违法行为","n":1,"img":""},{"i":"MC1-0117","p":"1.5.2","q":"关于业余无线电台在通信过程中使用的语言，正确的做法为：","a":"A","A":"任何时候都应当使用明语或者业余无线电领域公认的缩略语、简语","B":"可以使用虽然不是所有火腿通用、但在某些火腿圈子内部有一定可懂度的新编缩略语或暗语","C":"语言要创新，可以使用自创的特殊缩略语，虽开始时象是暗语，用多了就会变明语","D":"可提倡使用稀有语言或方言，尽量使特定通信对象以外的业余无线电台听不懂，以减少他台呼叫和插入的机会","n":1,"img":""},{"i":"MC1-0118","p":"1.5.2","q":"具备国家无线电管理机构规定的操作技术能力并具有法律规定有效证明文件、但还没有获准设置自己的业余电台的人是否可以到业余电台进行发射操作？答案是：","a":"A","A":"可以。使用所操作业余电台的呼号，由该业余电台的设台人对操作不妥而造成的有害干扰负责","B":"可以。因为自己没有呼号，只能在通信中使用临时自编的呼号，或用姓名代替呼号","C":"不可以","D":"青少年可以，成人不可以","n":1,"img":""},{"i":"MC3-0119","p":"1.5.2","q":"未取得相应业余无线电台执照或者相应操作技术能力的人员，为提高业余无线电台操作技术能力的需要，可以在他人依法设置的业余无线电台上进行发射操作实习。应遵守的条件是什么？","a":"ABC","A":"发射操作实习应当由业余无线电台设置、使用人或者其技术负责人现场监督指导","B":"使用的频率范围和发射功率应当在 B 类业余无线电台操作技术能力验证证书确定的范围内","C":"使用的频率范围和发射功率不得超过现场监督指导人员依法取得的业余无线电台操作技术能力验证证书确定的范围","D":"尚未取得关于具备操作技术能力有效证明文件的人任何情况下都不可以进行发射操作","n":3,"img":""},{"i":"MC1-0120","p":"1.5.2","q":"业余无线电台设置人应对其无线电发射设备担负的法定责任为：","a":"A","A":"应当确保其无线电发射设备处于正常工作状态，避免对其他无线电业务造成有害干扰","B":"应当确保其无线电发射设备随最先进型号更新，为其他业余电台树立求新的榜样","C":"应当确保其无线电发射设备达到最大发射功率，以克服其他无线电业务的干扰","D":"应当确保其无线电发射设备经常处于工作状态，以提高业余频率的实际占用度","n":1,"img":""},{"i":"MC1-0121","p":"1.5.2","q":"业余无线电爱好者使用业余无线电收信设备应遵守的规定为：","a":"A","A":"不得接收与业余业务和卫星业余业务无关的信号","B":"只要不造成对其他业务的无线电干扰，接收无线电信号没有限制","C":"只要不被查出来，可以接收任何无线电信号","D":"只要出于个人对信息的兴趣而不涉及赢利，可以接收任何无线电信号","n":1,"img":""},{"i":"MC1-0122","p":"1.5.2","q":"业余无线电爱好者无意接收到非业余业务和卫星业余业务的信息时，应遵守的规则为：","a":"A","A":"不得传播、公布","B":"只可以在业余无线电台间共享，不得在其他场合公开","C":"只可以用非无线电方式在业余无线电爱好者之间交流，不得以无线电方式转发","D":"既然自己可以收到，别人也一定可以收到，当然可以传播、公布或者利用","n":1,"img":""},{"i":"MC1-0123","p":"1.5.2","q":"业余无线电台是否可以发射从广播电台收到的信号、音像节目的录音，或者故意转送电台周围的声音？","a":"A","A":"不可以，不得发送与业余业务和卫星业余业务无关的信号","B":"可以，因为该类信息没有保密性","C":"可以，用于显示自己发射设备的信号质量","D":"可以，用于提起其他有业余无线电台操作员精神，防止乏困","n":1,"img":""},{"i":"MC1-0124","p":"1.5.2","q":"国家对于利用业余无线电台从事发布、传播违反法律或者公共道德的信息的行为的态度是：","a":"A","A":"禁止","B":"不提倡","C":"容忍","D":"不可以发布传播违法信息。但违反公共道德的信息属于道德问题，不鼓励就是了","n":1,"img":""},{"i":"MC1-0125","p":"1.5.2","q":"出租车安装业余电台并用来传递有关载客的信息，这种行为的性质是：","a":"A","A":"违法行为，违反了严禁利用业余无线电台谋取商业利益的规定","B":"不太好，因为占用了其他业余电台通信的频率","C":"只要不影响其他业余电台的正常通信就可以","D":"只要管理部门不来查处就可以","n":1,"img":""},{"i":"MC1-0126","p":"1.5.2","q":"利用业余无线电台通信来促销业余无线电产品或者推动与业余无线电活动有关的其他商业性活动，对这类行为的态度应该是：","a":"A","A":"禁止","B":"不提倡但也不禁止，毕竟有利于业余无线电活动发展","C":"只要是业余无线电民间组织是获利方，即使从事商业或其他营利活动，应支持","D":"如果设台人或者设台单位本身是以这类经营为生的，应适当理解和容忍","n":1,"img":""},{"i":"MC1-0127","p":"1.5.2","q":"利用自己的业余电台强信号故意压制其他业余电台的正常通信，或者在业余无线电频率上转播音乐或广播节目，这些行为的性质属于：","a":"A","A":"违法行为，违反了严禁阻碍其他无线电台通信的规定","B":"不妥行为，没有考虑到他人的乐趣","C":"正常现象，社会上一些人素质就是如此，应该谅解","D":"不文明行为，对其他业余电台不够礼貌","n":1,"img":""},{"i":"MC1-0128","p":"1.5.2","q":"业余无线电活动是否有序开展，会影响整个社会的无线电通信的安全和有效，使用不当甚至会导致生命财产损失。业余无线电爱好者在这方的责任是：","a":"A","A":"业余无线电台设置、使用人应当加强自律","B":"个人没有责任，只能依靠管理部门的监督检查和违法查处","C":"个人没有责任，只能依靠业余无线电民间组织充当“协管”","D":"有了电台执照，日常一切言行当然可以带到电台通信中，无责任可言","n":1,"img":""},{"i":"MC1-0129","p":"1.5.2","q":"业余无线电台可用于下列用途：","a":"A","A":"相互通信、技术研究和自我训练","B":"救灾抢险、车队联络和广播通信","C":"娱乐休闲、报告路况和公益服务","D":"技术教学、民兵训练和公益服务","n":1,"img":""},{"i":"MC1-0130","p":"1.5.2","q":"符合业余无线电爱好者基本条件的人群是：","a":"A","A":"对无线电技术有兴趣并经无线电管理机构批准设置使用业余无线电台的人","B":"任何对无线电技术有兴趣的公民","C":"对无线电技术有兴趣并加入业余无线电协会的人","D":"拥有较高无线电技术水平并加入业余无线电协会的人","n":1,"img":""},{"i":"MC4-0131","p":"1.5.2","q":"业余无线电台禁止从事下列活动：","a":"ABCD","A":"在我国境内进行电波参数测试或者电波监测","B":"向境外组织或者个人提供涉及国家安全的境内电波参数资料","C":"故意收发无线电台执照许可事项之外的无线电信号","D":"传播、公布或者利用无意接收的信息","n":4,"img":""},{"i":"MC4-0132","p":"1.5.2","q":"业余无线电台应当遵守下列哪些规定：","a":"ABCD","A":"在业余业务或者卫星业余业务频段内收发信号","B":"不得擅自使用无线电频率","C":"不得对依法开展的无线电业务造成有害干扰","D":"不得利用无线电台(站)进行违法犯罪活动","n":4,"img":""},{"i":"MC3-0133","p":"1.5.2","q":"以下哪些使用业余无线电台的行为超越了在业余业务频率范围内收发信号的规定：","a":"ABC","A":"利用业余无线电台收听民用航空器电台通联","B":"利用业余无线电台收听铁路机车电台通联","C":"利用业余无线电台收听渔船海事电台通联","D":"利用业余无线电台收听国际空间站业余无线电台","n":3,"img":""},{"i":"MC3-0134","p":"1.5.2","q":"下列哪些未取得型号核准的无线电发射设备不可以作为自制、改装、拼装的业余无线电台设置、使用：","a":"ABC","A":"相关企业批量生产的未取得型号核准证的无线电发射设备","B":"已取得型号核准证，但型号核准证载明的频率范围不含业余业务的无线电发射设备","C":"已取得型号核准证，但自行更换设备操作软件将频率范围扩展到业余业务频段的无线电发射设备","D":"依法改装的取得型号核准证载明的频率范围包含业余业务频段的无线电发射设备","n":3,"img":""},{"i":"MC4-0135","p":"1.5.2","q":"使用业余无线电台不得从事下列活动:","a":"ABCD","A":"发布、传播法律、行政法规禁止发布、传播的信息","B":"用于谋取商业利益等超出业余无线电台使用属性之外的目的","C":"故意干扰、阻碍其他无线电台（站）通信","D":"故意收发业余无线电台执照载明事项之外的无线电信号","n":4,"img":""},{"i":"MC4-0136","p":"1.5.2","q":"使用业余无线电台不得从事下列活动:","a":"ABCD","A":"传播、公布或者利用无意接收的信息","B":"擅自编制、使用业余无线电台呼号","C":"涂改、倒卖、出租或者出借业余无线电台执照","D":"向境外组织或者个人提供涉及国家安全的境内电波参数资料","n":4,"img":""},{"i":"MC4-0137","p":"1.5.2","q":"使用业余无线电台应当符合如下规定：","a":"ABCD","A":"定期维护业余无线电台","B":"保证其性能指标符合国家标准","C":"保证其性能指标符合国家无线电管理的有关规定","D":"避免对其他依法设置、使用的无线电台（站）产生有害干扰","n":4,"img":""},{"i":"MC3-0138","p":"1.5.2","q":"关于业余无线电台在通信过程中使用的语言，正确的做法为:","a":"ABC","A":"在通信过程中使用明语","B":"在通信过程中使用业余无线电领域公认的缩略语、简语","C":"在通信过程中使用公开的技术体制和通信协议","D":"在通信过程中使用自创的特殊缩略语","n":3,"img":""},{"i":"MC1-0139","p":"1.5.3","q":"关于业余无线电台的应急通信，正确的叙述是：","a":"A","A":"在突发重大自然灾害等紧急情况下，业余无线电台才可以和非业余无线电台进行规定内容的通信","B":"在日常应急通信训练中，业余无线电台可以和各种非业余无线电台进行通信","C":"在日常应急通信训练中，业余无线电台可以和地方公益性救援团体的非业余无线电台进行通信","D":"在日常应急通信训练中，业余无线电台可以和地方公益性救援团体的非业余无线电台进行通信，但须经当地业余无线电协会同意","n":1,"img":""},{"i":"MC1-0140","p":"1.5.3","q":"业余无线电台允许与非业余无线电台通信的条件是：","a":"A","A":"在突发重大自然灾害等紧急情况下，内容限于与抢险救灾直接相关的紧急事务或者应急救援相关部门交办的任务","B":"在当地政府或非盈利机构组织的公益活动中，内容限于与公益事务或者相关的活动组织机构交办的任务","C":"在青少年科技教育活动中，仅可与青少年非业余无线电台通信，内容限于与青少年科技教育直接有关的事务","D":"在无线电技术研究中，仅可与具备其他业务电台执照的对象通信，内容限于技术实验所需的信号","n":1,"img":""},{"i":"MC1-0141","p":"1.5.3","q":"关于业余无线电台的应急通信，正确的叙述是：","a":"A","A":"在突发重大自然灾害等紧急情况下，业余无线电台的通信内容可以涉及应急救援相关部门交办的任务","B":"在平时的任何时侯，业余无线电台的通信内容可以涉及任何政府组织和非盈利机构交办的任务","C":"平时在专门的应急通信训练活动中，业余无线电台的通信内容可以涉及应急救援相关部门和组织机构交办的任务","D":"在日常公益性社会活动中，业余无线电台的通信内容可以涉及各种公益机构交办的任务","n":1,"img":""},{"i":"MC4-0142","p":"1.5.3","q":"业余无线电爱好者在应对突发事件应急处置应当遵守下列规定：","a":"ABCD","A":"为突发事件应急处置的需要，业余无线电台可以与非业余无线电台通信","B":"通信内容应当限于与突发事件应急处置直接相关的紧急事务","C":"遇有危及国家安全、公共安全、生命财产安全等紧急情况，可以不经批准临时设置、使用业余无线电台，但应当在 48 小时内向电台所在地的无线电管理机构报告","D":"遇有危及国家安全、公共安全、生命财产安全等紧急情况，未经批准临时设置、使用业余无线电台应在紧急情况消除后及时关闭","n":4,"img":""},{"i":"MC1-0143","p":"1.6.1","q":"业余无线电台设置、使用人应当接受下列机构对业余无线电台及其使用情况的监督检查：","a":"A","A":"无线电管理机构的监督检查","B":"业余无线电民间组织的独立监督检查","C":"单位或所在居委会、村民委员会、物主委员会的监督检查","D":"国家计量监督部门的监督检查","n":1,"img":""},{"i":"MC4-0144","p":"1.6.1","q":"关于无线电频谱资源，下列说法正确的是：","a":"ABCD","A":"无线电频谱资源属于国家所有","B":"国家对无线电频谱资源实行统一规划、合理开发、有偿使用的原则","C":"国家鼓励、支持对无线电频谱资源的科学技术研究和先进技术的推广应用，提高无线电频谱资源的利用效率","D":"根据维护国家安全、保障国家重大任务、处置重大突发事件等需要，国家可以实施无线电管制","n":4,"img":""},{"i":"MC4-0145","p":"1.6.1","q":"关于无线电频率、业务、台（站），下列说法正确的是：","a":"ABCD","A":"任何单位或者个人不得擅自使用无线电频率","B":"任何单位或者个人不得对依法开展的无线电业务造成有害干扰","C":"任何单位或者个人不得利用无线电台（站）进行违法犯罪活动","D":"设置、使用业余无线电台需要遵守《中华人民共和国无线电管理条例》","n":4,"img":""},{"i":"MC1-0146","p":"1.6.1","q":"违反国家规定，擅自设置、使用无线电台（站），或者擅自使用无线电频率，干扰无线电通讯秩序，情节严重的，处三年以下有期徒刑、拘役或者管制，并处或者单处罚金；情节特别严重的，处三年以上七年以下有期徒刑，并处罚金。单位犯前款罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员，依照前款的规定处罚。这个规定出自于下列法规律：","a":"A","A":"中华人民共和国刑法","B":"中华人民共和国民法通则","C":"中华人民共和国无线电管理条例","D":"中华人民共和国电信法","n":1,"img":""},{"i":"MC1-0147","p":"1.6.1","q":"无线电频率的使用必须得到无线电管理机构的批准，基本依据是“无线电频谱资源属于国家所有”，出自于下列法律的第二百五十二条：","a":"A","A":"中华人民共和国民法典","B":"中华人民共和国宪法","C":"中华人民共和国刑法","D":"中华人民共和国电信法","n":1,"img":""},{"i":"MC1-0148","p":"1.6.1","q":"无线电管制是指在下列范围内依法采取的对无线电波的发射、辐射和传播实施的强制性管理：","a":"A","A":"在特定时间和特定区域内","B":"在全国范围、所有时间内","C":"在特定范围、所有时间内","D":"在例行范围和例行时间内","n":1,"img":""},{"i":"MC1-0149","p":"1.6.1","q":"无线电管制是指在特定时间和 "A":"非特指地呼叫任何一部国内和国外业余电台","B":"呼叫国内业余电台","C":"呼叫国外业余电台","D":"倾向于呼叫 DX 电台，国内电台最好别回应","n":1,"img":""},{"i":"MC1-0260","p":"2.2.1","q":"一部业余电台如何发起 CQ 呼叫？","a":"A","A":"呼叫 CQ 并报出己方呼号。清晰起见，可重复一两次 CQ 并对呼号进行字母拼读","B":"呼叫“有朋友在频率上吗？”  ，然后报出自己的呼号。清晰起见，可对呼号进行字母拼读","C":"说“CQ”三次，再说“请过来”一次。清晰起见，可对 CQ 进行字母拼读","D":"说“CQ”三次，再说“standing by”一次。清晰起见，可对 CQ 进行字母拼读","n":1,"img":""},{"i":"MC1-0261","p":"2.2.1","q":"如何回答一个 CQ 呼叫？","a":"A","A":"报出对方的呼号并报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读","B":"报出自己的呼号并报出对方的呼号。清晰起见，可重复关键内容或进行字母拼读","C":"说“CQ”三次再报出对方的呼号三次。清晰起见，可重复关键内容或进行字母拼读","D":"先给出信号报告再报出自己的呼号。清晰起见，可重复关键内容或进行字母拼读","n":1,"img":""},{"i":"MC1-0262","p":"2.2.1","q":"业余电台操作员小强呼叫另一业余电台并希望与操作员小明通话的方法是：","a":"A","A":"报出对方的呼号并报出自己的呼号。建立通信后即可提出与小明通话","B":"报出自己的呼号并报出对方的呼号。建立联络后即可提出与小明通话","C":"说“CQ 小明”三次再报出自己的呼号。清晰起见，可对呼号进行字母拼读","D":"说“CQ 小明”三次再报出“我是小强”。清晰起见，可对 CQ 进行字母拼读","n":1,"img":""},{"i":"MC1-0263","p":"2.2.1","q":"业余电台建立通信后，双方应首先交换的必要信息是：","a":"A","A":"信号报告","B":"操作员名字","C":"操作地点","D":"设备、设施情况","n":1,"img":""},{"i":"MC1-0264","p":"2.2.1","q":"为什么业余电台建立通信后总是立即交换信号报告？","a":"A","A":"双方需要此报告来了解传播情况，安排最适合的操作","B":"这是最基本的报务要求，不必去问，只管去执行就好","C":"双方需要此报告来校准发射功率","D":"决定是否放弃联络，因为低于 S5 的信号与奖状无缘","n":1,"img":""},{"i":"MC1-0265","p":"2.2.1","q":"在现代业余无线电通信中，信号报告均采用“RST 格式”。缩语 RST 中的字母 R 代表：","a":"A","A":"信号的可辩度","B":"信号的强度","C":"信号的纯净度","D":"Q 简语 QRK","n":1,"img":""},{"i":"MC1-0266","p":"2.2.1","q":"小明和小强进行 CW 和 FM 联络，双方的收信机均指示信号强度为“5”。通报时，双方评价听抄顺畅，没有变调等信号缺陷；通话时，双方认为声音易于辩识，没有明显影响听抄的失真。此时，双方应当为 CW 和 FM 通联给出信号报告：","a":"A","A":"559 和 55","B":"55 和 559","C":"不必关心信号强度表的指示，给出 599 和 59 才是最好的","D":"不必关心信号强度表的指示，给出 59 和 599 才是最好的","n":1,"img":""},{"i":"MC1-0267","p":"2.2.2","q":"业余电台在发起呼叫前应先守听。但是，我们有时会因听不到通信中的某一方而误认为频率空闲。此时呼叫“CQ”有可能干扰他人联络。为尽量避免这种情况，我们可以：","a":"A","A":"询问“有人使用频率吗？”，确认没有应答再发起呼叫","B":"询问“有吗？有吗？请过来。”，确认没有应答再发起呼叫","C":"先启动呼叫再进行通信，等听到确实有电台在工作再让出频率不迟","D":"先启动呼叫再进行通信，只要没有其他电台要求 QSY 就持续使用","n":1,"img":""},{"i":"MC1-0268","p":"2.2.2","q":"BH1ZZZ 希望加入两个电台相互之间的联络。正确的方法是：","a":"A","A":"在一方刚刚停止讲话时迅速发出“插入”或“break”。如得到回应，再说明“BH1ZZZ请求插入”。待对方正式邀请后，开始正式对话","B":"在一方正在讲话时短暂插入一次“break”，向正在收听的一方发出插入请求","C":"短暂发射一次“插入”或“break”。如对方无反应，可以加大功率反复尝试","D":"如果双方都是自己熟悉的业余电台操作员，直接讲进去便是，不必拘泥礼节","n":1,"img":""},{"i":"MC1-0269","p":"2.2.2","q":"如果在联络中听到有个遇险的电台要求插入，你该怎么做？","a":"A","A":"立即与该台确认险情并了解其需要什么帮助","B":"立即联系或找人协助联系当地熟悉紧急情况下通信联络的爱好者或爱好者团队","C":"立即变更工作频率","D":"立即停止发射活动","n":1,"img":""},{"i":"MC1-0270","p":"2.2.2","q":"在请求插入两个电台间的对话之时，一个值得借鉴的经验是：","a":"A","A":"思考自己的加入是否会影响原通信双方的交谈乐趣","B":"确认自己的信号质量可以得到原通信双方的共同赞赏","C":"确定自己的操作等级与原通信双方的大体相当","D":"确信自己有比原通信双方更具吸引力的谈话内容","n":1,"img":""},{"i":"MC1-0271","p":"2.2.2","q":"若发现有业余电台的发射操作技巧不够规范，但还不至于造成严重的干扰和影响，正确的做法是：","a":"A","A":"通过电话、邮件等方式提出善意的改进建议","B":"立即在频率上当面加以指出和纠正","C":"立即报告无线电管理机构进行干涉","D":"立即报告当地业余无线电协会，由其总部电台到频率上进行纠察","n":1,"img":""},{"i":"MC1-0272","p":"2.2.2","q":"业余电台通信受到违法电台或者不明电台的严重干扰。正确的做法是：","a":"A","A":"不予理睬，收集有关信息并向无线电管理机构举报","B":"在频率上向其宣传无线电管理法，要求其停止干扰","C":"立即报告无线电管理机构进行干涉","D":"用大功率信号对其进行压制","n":1,"img":""},{"i":"MC1-0273","p":"2.2.2","q":"如果与几十千米以外的某业余电台有很多重要的技术问题和个人情况要交流，应该选用下列通信方式：","a":"A","A":"电话或者互联网","B":"利用当地的业余中继台","C":"利用 HF 频段业余电台","D":"利用天线足够高的 VHF/UHF 频段业余电台","n":1,"img":""},{"i":"MC1-0274","p":"2.2.3","q":"法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：","a":"A","A":"通信时间、通信频率、通信模式、对方呼号、双方信号报告","B":"通信对方姓名、对方所在国家或城市、通信模式、双方信号报告","C":"通信时间、通信频率、双方收发信设备和天线、对方台址","D":"通信时间、通信模式、对方信号报告、对方台址、对方天气","n":1,"img":""},{"i":"MC1-0275","p":"2.2.3","q":"法规和国际业余无线电惯例要求业余电台日志应记载的必要内容是：","a":"A","A":"DATE、TIME、FREQ、MODE、CALL（对方）、RST（双方）","B":"DATE、FREQ、QTH（对方） 、RIG（对方）、RST（双方）、WX（对方）","C":"DATE、TIME、MODE、CALL（对方）、QTH（对方）、RST（双方）","D":"CALL（通信对方）、TIME、FREQ、RIG（对方） 、RST（双方）、PWR（双方）","n":1,"img":""},{"i":"MC4-0276","p":"2.2.3","q":"业余无线电台交换 QSL 卡具有多重意义，包括：","a":"ABCD","A":"确认本地、国内，甚至世界范围内的无线电联络","B":"掌握包括自制发射机在内的本台设备的运作表现","C":"申请奖状，证明自己在通信、技术等领域的努力","D":"纯粹收集，欣赏，展示来自世界各地的 QSL 卡片","n":4,"img":""},{"i":"MC4-0277","p":"2.2.3","q":"QSL 卡片应至少涵盖哪些内容：","a":"ABCD","A":"联络双方的电台呼号","B":"双方信号报告和联络时间","C":"操作方式及联络频率","D":"操作员签章、本台通信地址","n":4,"img":""},{"i":"MC1-0278","p":"2.2.3","q":"关于 QSL 卡片的用法，以下说法正确的是：","a":"A","A":"如果所交换的 QSL 卡片并非用作通联或收听证明，则应在通信方式一栏填写“现场交流”或“Eyeball QSO”等字样。不应赠送空白卡片","B":"业余无线电爱好者的空白 QSL 卡片可以用作照片或名片，适合赠送，交换或散发","C":"火腿都是互相的。虽然对方没有联络自己，但是也可以发去确认联络的 QSL 卡片","D":"如果在联络中没有听清对方呼号，或在日志中漏填或打错了对方呼号，则在寄发 QSL 卡片时可在对方呼号一栏填写对方操作员的名字","n":1,"img":""},{"i":"MC1-0279","p":"2.2.3","q":"收到国外寄来的 QSL 卡片时，如果信封中夹带有一张或多张 IRC，则应：","a":"A","A":"尽快检查电台日志，确认联络的真实性，向对方地址直接寄出自己的 QSL 卡片","B":"不必确认联络的真实性，只要尽快向对方地址直接寄出自己的卡片即可","C":"尽快检查电台日志，确认联络的真实性，向国内 QSL 卡片管理局寄出自己的卡片","D":"不必理会。操作类别越低越不必理会。低级别业余电台的 QSL 卡片通常不具价值","n":1,"img":""},{"i":"MC1-0280","p":"2.2.3","q":"填写和邮寄 QSL 卡片的正确做法是：","a":"A","A":"迫切需要对方回寄卡片时，应直接向对方地址邮寄卡片并附加 SASE","B":"填写错误时应划去或使用涂改液覆盖错误内容并加以改正","C":"自己的邮寄地址与电台的发射地点不同时，应在 QTH 栏目内填明详细邮寄地址","D":"通过卡片管理局寄出卡片并希望对方回卡时，应在卡片上注明 PSE QSL DIRECT","n":1,"img":""},{"i":"MC1-0281","p":"2.2.3","q":"交换 QSL 卡片时，我们时有遇见一类特殊的无线电爱好者，他们仅向我们寄发收听卡片。而我们在确认卡片所载内容之后会立即回卡以示敬意。这类爱好者是：","a":"A","A":"短波收听者（SWL）","B":"广播爱好者","C":"DIY 爱好者","D":"业余无线电监测员","n":1,"img":""},{"i":"MC1-0282","p":"2.2.4","q":"通过中继台进行通联时，我们应事先设好电台的接收和发射频差，以便顺利应对上行或下行频率上的各种操作，避免边联络边设置，忙中出错。144 和 430MHz 频段业余中继台的上下行频差分别为：","a":"A","A":"0.6MHz，5MHz","B":"12.5kHz，25kHz","C":"4MHz，10MHz","D":"2MHz，5MHz","n":1,"img":""},{"i":"MC1-0283","p":"2.2.4","q":"如果通过中继台呼叫一部业余电台，你应当：","a":"A","A":"呼叫对方的呼号并报出自己的呼号","B":"呼叫“break, break”，然后说出对方呼号二至三次","C":"呼叫“CQ”三次，然后说出自己的呼号三次","D":"等待，直到你要呼叫的电台通过中继台呼叫 CQ","n":1,"img":""},{"i":"MC1-0284","p":"2.2.4","q":"业余中继台的使用原则是：","a":"A","A":"除必要的简短联络外，业余中继台的上行和下行频率应保持空闲，以备随时响应突发灾害等紧急情况下的呼叫","B":"应使中继台尽量处于接近饱和的忙碌状态，提高使用效率","C":"鼓励业余无线电民间组织（协会）通过中继台向当地会员发布通知","D":"鼓励青少年学生通过中继台交流解题方法和学习心得","n":1,"img":""},{"i":"MC1-0306","p":"2.3.1","q":"业余电台在发起呼叫前应先守听一段时间，然后再询问“有人使用频率吗？”，确认没有应答方可发起呼叫。下列英语短句中不能正确表达这一询问的是：","a":"A","A":"Calling you, Roger？","B":"Is this frequency in use？","C":"Is anyone at this frequency？","D":"Anybody here？","n":1,"img":""},{"i":"MC1-0307","p":"2.3.1","q":"业余电台 BH1ZZZ 用 FM 或 SSB 话音发起 CQ 呼叫的方法为：","a":"A","A":"CQ CQ CQ，这里是 BH1ZZZ，Bravo Hotel One Zulu Zulu Zulu，BH1ZZZ 呼叫 CQ，听到请回答","B":"CQ CQ CQ，请您继续","C":"CQ CQ CQ，我是 1ZZZ，请过来","D":"CQ CQ CQ；CQ CQ CQ；CQ CQ CQ，我是 BH1ZZZ，您请讲","n":1,"img":""},{"i":"MC1-0308","p":"2.3.1","q":"业余电台 BH1ZZZ 用话音发起 CQ 呼叫的方法为：","a":"A","A":"CQ CQ CQ, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu, BH1ZZZ calling CQ andstanding by","B":"CQ CQ, calling CQ. Go ahead","C":"CQ CQ, calling CQ, this is One Zulu Zulu Zulu. Come on","D":"CQ CQ CQ, CQ CQ CQ, CQ CQ CQ, this is BH1ZZZ. Back to you","n":1,"img":""},{"i":"MC1-0309","p":"2.3.1","q":"业余电台 BH1ZZZ 用话音呼叫 BH8YYY 的方法为：","a":"A","A":"BH8YYY，BH8YYY，BH8YYY，这里是 BH1ZZZ，Bravo Hotel One Zulu Zulu Zulu，BH1ZZZ 呼叫，听到请回答","B":"BH8YYY，我是 BH1ZZZ，我是 BH1ZZZ，我是 BH1ZZZ，您继续","C":"BH8YYY，我是 1ZZZ，请过来","D":"8YYY，BH1ZZZ，听到讲","n":1,"img":""},{"i":"MC1-0310","p":"2.3.1","q":"业余电台 BH1ZZZ 用话音呼叫 BH8YYY 的方法为：","a":"A","A":"BH8YYY, BH8YYY, BH8YYY, this is BH1ZZZ, Bravo Hotel One Zulu Zulu Zulu,BH1ZZZ calling you and standing by","B":"BH8YYY, Bravo Hotel Eight Yankee Yankee Yankee, BH8YYY, go ahead","C":"BH8YYY, this is One Zulu Zulu Zulu, come on","D":"8YYY, this is BH1ZZZ, over over","n":1,"img":""},{"i":"MC1-0311","p":"2.3.1","q":"建立话音通信后，操作员小明打算给对方电台 BH1ZZZ “57”的信号报告。他可以这样讲：","a":"A","A":"BH1ZZZ，你的信号 57。是否抄收？","B":"BH1ZZZ，我给你 57 的信号可以吗？","C":"57，57，拷贝了吗？","D":"57，57，这里是 BH1ZZZ，听到请回答","n":1,"img":""},{"i":"MC1-0312","p":"2.3.1","q":"建立话音通信后，操作员小明打算给对方电台 BH1ZZZ “57”的信号报告。他可以这样讲：","a":"A","A":"BH1ZZZ, you are 57, QSL?","B":"BH1ZZZ, may I rate you 57?","C":"Hey, 57, QSL?","D":"Hey 57，this is BH1ZZZ. Roger?","n":1,"img":""},{"i":"MC1-0313","p":"2.3.1","q":"建立话音通信后，小明打算介绍自己是在成都操作的。他可以这样讲：","a":"A","A":"我的 QTH 是成都","B":"我 QRT 在成都","C":"我在成都 QRO","D":"我在成都 QRV","n":1,"img":""},{"i":"MC1-0314","p":"2.3.1","q":"建立话音通信后，小明打算介绍自己是在成都操作的。他可以这样讲：","a":"A","A":"My QTH is Chengdu","B":"I QRT in Chengdu","C":"I run QRO in Chengdu","D":"I am QRV at Chengdu","n":1,"img":""},{"i":"MC1-0315","p":"2.3.1","q":"收听业余无线电爱好者的 SSB 通联时，我们有时会听到 “Cheerio.”、“Ciao ciao.”或“Do svidaniya.”一类的短句。其含义是：","a":"A","A":"不同国家或地区的爱好者互致美好祝愿并表达再见之意","B":"一些英语词汇","C":"一些非英语词汇","D":"从一种语言至另一种语言的转写","n":1,"img":""},{"i":"MC1-0343","p":"2.4.1","q":"QRP 操作时如果对方反映信号不好，我们可能会追问是否需要增加功率。此时可发送：","a":"A","A":"QRO？","B":"QSO？","C":"QRP？","D":"QRS？","n":1,"img":""},{"i":"MC1-0344","p":"2.4.1","q":"通联时，如认为 QRP 操作足以保证可靠联络，则可与对方协商降低功率。短句为：","a":"A","A":"QRP？","B":"May I try QRO for you？","C":"QRU？","D":"May I try QRT for you？","n":1,"img":""},{"i":"MC1-0345","p":"2.4.1","q":"业余电台以低于 5 瓦的功率开展通信研究或追逐奖状时，常在呼号之后附加操作属性“QRP”。例如：BI9XYZ/QRP。Q 简语“QRP”表示：","a":"A","A":"我已降低发射功率","B":"我已降低发射功率至 5W","C":"我是新手，请发慢一些，照顾一下","D":"我在挑战小功率通信极限，请高速发过来","n":1,"img":""},{"i":"MC1-0346","p":"2.4.1","q":"通联时，如果希望对方加快发报速度，我们可以发送：","a":"A","A":"PSE QRQ","B":"PSE QRS","C":"PSE QRT","D":"PSE QTR","n":1,"img":""},{"i":"MC1-0347","p":"2.4.1","q":"通联时，如果对方要求加快发报速度，我们可以通过反问来确认。此时可以发送：","a":"A","A":"QRQ？","B":"QRS？","C":"QRT？","D":"QTR？","n":1,"img":""},{"i":"MC1-0348","p":"2.4.1","q":"通联时，如果希望对方放慢发报速度，我们可以发送：","a":"A","A":"PSE QRS","B":"PSE QRQ","C":"PSE QSY","D":"PSE QSL","n":1,"img":""},{"i":"MC1-0349","p":"2.4.1","q":"通联时，如果对方要求放慢发报速度，我们可以通过反问来确认。此时可以发送：","a":"A","A":"QRS？","B":"QRQ？","C":"QSY？","D":"QSL？","n":1,"img":""},{"i":"MC1-0350","p":"2.4.1","q":"结束当天的通联活动时，业余电台常会发送 Q 简语“QRT”。其含义为：","a":"A","A":"我要关闭收发信机了，再见","B":"我要变更发射频率至 nnnn 千赫（或兆赫）","C":"我不再呼叫了，尚未联络的请用 email 约起来","D":"我要变更操作方式了，有要联络的请尽快叫过来","n":1,"img":""},{"i":"MC1-0351","p":"2.4.1","q":"在结束联络之前，我们可以询问对方是否还有消息要传达。此时可以发送：","a":"A","A":"QRU？","B":"QRL？","C":"QRB？","D":"QRQ？","n":1,"img":""},{"i":"MC1-0352","p":"2.4.1","q":"结束联络时，我们可以告诉对方这里已无事。此时可以发送：","a":"A","A":"QRU","B":"QRL","C":"QRM","D":"QRN","n":1,"img":""},{"i":"MC1-0353","p":"2.4.1","q":"通联时，如希望相约对方参加某个业余无线电活动（如，“木兰围场-通联中国之省”），可使用短句：","a":"A","A":"QRV IN WAPC?","B":"QSY TO WAPC?","C":"QSO WID WAPC?","D":"QRT OVER WAPC?","n":1,"img":""},{"i":"MC1-0354","p":"2.4.1","q":"Q 简语“QRV”的含义是：","a":"A","A":"我准备好收信了","B":"我正忙于（与某台）联络","C":"我有消息要发给你","D":"我要减小发射功率","n":1,"img":""},{"i":"MC1-0355","p":"2.4.1","q":"进行呼叫时，如果没有听清对方呼号，可使用如下短句请求对方重发：","a":"A","A":"QRZ？","B":"QRU？","C":"QSY？","D":"QSA？","n":1,"img":""},{"i":"MC1-0356","p":"2.4.1","q":"Q 简语“QRZ”的含义为：","a":"A","A":"呼叫你的电台是...；做疑问句时则为：谁在呼叫我？","B":"我准备好了","C":"我正忙于（与某台）联络","D":"我要减小发射功率","n":1,"img":""},{"i":"MC1-0357","p":"2.4.1","q":"阅读我国早期业余无线电文献，我们可能发现一种用 Q 简语和 5 个强度等级来表示的信号报告。该 Q 简语是：","a":"A","A":"QSA","B":"QSB","C":"QSD","D":"QSK","n":1,"img":""},{"i":"MC1-0358","p":"2.4.1","q":"通联时，如需了解自己的信号是否衰落，可使用短句：","a":"A","A":"QSB？","B":"QSD？","C":"QRB？","D":"QSP？","n":1,"img":""},{"i":"MC1-0359","p":"2.4.1","q":"Q 简语“QSB”的含义为：","a":"A","A":"你的信号正在衰落","B":"你的电台存在键控缺陷（交流声、键击声、接触不良或发报手法不佳等）","C":"请重复上一条消息","D":"发报时，我能够在电码的间隙中听到电台的插入","n":1,"img":""},{"i":"MC1-0360","p":"2.4.1","q":"小强和小明练习 CW。若小强问“我发报的手法有毛病吗？”，他可以发：","a":"A","A":"QSD？","B":"QSB？","C":"QSV？","D":"QRM？","n":1,"img":""},{"i":"MC1-0361","p":"2.4.1","q":"小强与小明练习 CW。小明认为小强刚才发字母“Y”时手法不好。他可以拍发：","a":"A","A":"QSD AT Y","B":"QRH AT Y","C":"QSU AT Y","D":"QSS AT Y","n":1,"img":""},{"i":"MC1-0362","p":"2.4.1","q":"小强与小明练习 CW。小明认为小强发报时有砰然的键击声。他可以拍发：","a":"A","A":"QSD PSE CK","B":"QRI PSE CK","C":"QRH PSE CK","D":"TVI PSE CK","n":1,"img":""},{"i":"MC1-0363","p":"2.4.1","q":"Q 简语“QSK”的含义为：","a":"A","A":"发报时，我能够在电码的间隙中听到电台的插入","B":"你的信号正在衰落","C":"你的电台存在键控缺陷（交流声、键击声、接触不良或发报手法不佳等）","D":"请重复上一条消息","n":1,"img":""},{"i":"MC1-0364","p":"2.4.1","q":"通联时，如需对方电台确认收妥自己发出的消息，可使用短句：","a":"A","A":"QSL？","B":"QRZ？","C":"QSP？","D":"QRO？","n":1,"img":""},{"i":"MC1-0365","p":"2.4.1","q":"Q 简语“QSL”的含义为：","a":"A","A":"我确认抄收了你所发送的消息","B":"我要寄一张 QSL 卡片给你","C":"我刚刚错过了你的消息，请再发一遍","D":"你应当寄一张 QSL 卡片给我","n":1,"img":""},{"i":"MC1-0366","p":"2.4.1","q":"Q 简语“QSO”的含义为：","a":"A","A":"我能够直接或通过他台转信通联（某个电台）；常指业余电台间的当前联络","B":"我可以直接或通过卡片管理局寄发 QSL；常指业余电台交换 QSL 卡片的操作","C":"我可以将你的消息转信至某个电台；常指业余电台帮助他台中转消息的操作","D":"我没有需要发送的消息了；常见于业余电台即将结束联络并互致再见之时","n":1,"img":""},{"i":"MC1-0367","p":"2.4.1","q":"通联时，如需了解对方电台可否帮助转信至“xxx 电台”，可使用短句：","a":"A","A":"QSP ×××？","B":"QRD ×××？","C":"QSX ×××？","D":"QRV ×××？","n":
